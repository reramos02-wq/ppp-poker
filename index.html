  // Blind editor
  // Trabalha num RASCUNHO (BLV_DRAFT): nada muda no relógio nem é gravado até tocar em Salvar.
  bindClkBtn("edit", ()=>{
    const s=DB.stages.find(x=>x.id===CLOCK_STAGE_ID); if(!s) return;
    const el=document.getElementById("admin-modal"); if(!el) return;
    BLV_DRAFT = JSON.parse(JSON.stringify(getBlindLevels(s))); BLV_ONCE = new WeakSet(); BLV_ADDED = new WeakSet(); BLV_ORIG = JSON.parse(JSON.stringify(BLV_DRAFT)); BLV_ORIG_IDX = new Map(BLV_DRAFT.map((l,i)=>[l,i]));
    el.innerHTML=`<div class="ov" style="z-index:1200;align-items:flex-start;padding:16px;overflow-y:auto"><div class="modal" style="max-width:500px;width:100%">${renderBlindEditor(s)}</div></div>`;
    bindBlindEditorEvents(s);
  });

  // Copia para o rascunho o que está digitado nos campos (senão mover/inserir/apagar perderia a edição).
  function readBlindEditor(){
    const levels = BLV_DRAFT; if(!levels) return;
    document.querySelectorAll("[data-blv-sb]").forEach(inp=>{const i=parseInt(inp.dataset.blvSb);if(levels[i])levels[i].sb=parseInt(inp.value)||0;});
    document.querySelectorAll("[data-blv-bb]").forEach(inp=>{const i=parseInt(inp.dataset.blvBb);if(levels[i])levels[i].bb=parseInt(inp.value)||0;});
    document.querySelectorAll("[data-blv-ante]").forEach(inp=>{const i=parseInt(inp.dataset.blvAnte);if(levels[i])levels[i].ante=parseInt(inp.value)||0;});
    document.querySelectorAll("[data-blv-dur]").forEach(inp=>{const i=parseInt(inp.dataset.blvDur);if(levels[i])levels[i].dur=(parseInt(inp.value)||15)*60;});
  }
  const checkedBlindRows = () => [...document.querySelectorAll(".blv-chk:checked")].map(c=>parseInt(c.dataset.blv));

  // Redesenha o editor NO LUGAR (não fecha a janela): mantém a rolagem e, se `follow` for o índice novo
  // de uma linha, mantém essa linha no mesmo ponto da tela — assim dá para tocar ▲/▼ várias vezes seguidas.
  function redrawBlindEditor(s, opts){
    opts = opts||{};
    const modal = document.querySelector("#admin-modal .modal");   // é o .modal que rola (max-height + overflow)
    if(!modal) return;
    const scroll = modal.scrollTop;
    const oldRow = opts.followFrom!=null ? modal.querySelector(`[data-blv-row="${opts.followFrom}"]`) : null;
    const oldTop = oldRow ? oldRow.getBoundingClientRect().top : null;
    modal.innerHTML = renderBlindEditor(s);
    bindBlindEditorEvents(s);
    modal.scrollTop = scroll;
    (opts.checked||[]).forEach(i=>{ const c=modal.querySelector(`.blv-chk[data-blv="${i}"]`); if(c) c.checked=true; });
    if(opts.follow!=null){
      const row = modal.querySelector(`[data-blv-row="${opts.follow}"]`);
      if(row){
        if(oldTop!=null) modal.scrollTop += row.getBoundingClientRect().top - oldTop;
        else row.scrollIntoView({block:"center"});
      }
    }
  }

  function bindBlindEditorEvents(s){
    document.getElementById("blv-cancel")?.addEventListener("click", ()=>{ BLV_DRAFT=null; closeAdminModal(); });

    // Inserir: logo abaixo da última linha marcada; sem marcação, no fim (comportamento de antes)
    const addLevel = (isBreak)=>{
      readBlindEditor();
      const marked = checkedBlindRows();
      const at = marked.length ? Math.max(...marked)+1 : BLV_DRAFT.length;
      const lv = {sb:0,bb:0,ante:0,dur:900,isBreak};
      BLV_DRAFT.splice(at, 0, lv); BLV_ADDED.add(lv);
      redrawBlindEditor(s, {follow:at, checked:[]});
      if(!isBreak) document.querySelector(`[data-blv-sb="${at}"]`)?.focus({preventScroll:true});
      askScope(lv, at);
    };
    // Ao salvar com exclusões/edições/reordenação de níveis existentes: true = futuras · false = pontual · null = voltar
    const askChangeScope = ()=>new Promise((resolve)=>{
      const host = document.getElementById("admin-modal"); if(!host){ resolve(null); return; }
      const box = document.createElement("div");
      box.innerHTML = `<div class="ov" style="z-index:1300;align-items:center;padding:16px"><div class="modal" style="max-width:420px;width:100%">
        <div class="mtitle">Alterações nos níveis existentes</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.4">Você editou, excluiu ou moveu níveis. Isso vale só para esta etapa ou para todas as estruturas de blinds futuras?</div>
        <button class="btn by fw mb10" data-sc="f">Todas as estruturas futuras</button>
        <button class="btn fw mb10" data-sc="o">Pontual (só esta etapa)</button>
        <button class="btn fw" data-sc="b">Voltar ao editor</button></div></div>`;
      host.appendChild(box);
      box.querySelectorAll("[data-sc]").forEach(b=>b.addEventListener("click",()=>{ const v=b.dataset.sc; box.remove(); resolve(v==="f"?true:v==="o"?false:null); }));
    });
    // Pergunta a cada nível inserido: só nesta etapa (pontual) ou também nas estruturas futuras
    const askScope = (lv, at)=>{
      const host = document.getElementById("admin-modal"); if(!host) return;
      const box = document.createElement("div");
      box.id = "blv-scope";
      box.innerHTML = `<div class="ov" style="z-index:1300;align-items:center;padding:16px"><div class="modal" style="max-width:420px;width:100%">
        <div class="mtitle">${lv.isBreak?"☕ Break":"Nível"} adicionado (posição ${at+1})</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.4">Esta alteração vale só para esta etapa ou para todas as estruturas de blinds futuras?</div>
        <button class="btn by fw mb10" id="blv-scope-future">Todas as estruturas futuras</button>
        <button class="btn fw" id="blv-scope-once">Pontual (só esta etapa)</button></div></div>`;
      host.appendChild(box);
      const done = (once)=>{ if(once) BLV_ONCE.add(lv); else BLV_ONCE.delete(lv); box.remove(); };
      box.querySelector("#blv-scope-once").addEventListener("click",()=>done(true));
      box.querySelector("#blv-scope-future").addEventListener("click",()=>done(false));
    };
    document.getElementById("blv-add-blind")?.addEventListener("click",()=>addLevel(false));
    document.getElementById("blv-add-break")?.addEventListener("click",()=>addLevel(true));

    // Mover ▲ ▼ (troca com o vizinho; o nível movido continua sob o dedo)
    const move = (i, dir)=>{
      readBlindEditor();
      const j = i+dir;
      if(i<0 || j<0 || i>=BLV_DRAFT.length || j>=BLV_DRAFT.length) return;
      [BLV_DRAFT[i], BLV_DRAFT[j]] = [BLV_DRAFT[j], BLV_DRAFT[i]];
      const marked = checkedBlindRows().map(k=> k===i ? j : k===j ? i : k);
      redrawBlindEditor(s, {followFrom:i, follow:j, checked:marked});
    };
    document.querySelectorAll("[data-blv-up]").forEach(btn=>btn.addEventListener("click",()=>move(parseInt(btn.dataset.blvUp),-1)));
    document.querySelectorAll("[data-blv-down]").forEach(btn=>btn.addEventListener("click",()=>move(parseInt(btn.dataset.blvDown),+1)));

    document.querySelectorAll("[data-blv-del]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        readBlindEditor();
        const i = parseInt(btn.dataset.blvDel);
        const marked = checkedBlindRows().filter(k=>k!==i).map(k=> k>i ? k-1 : k);
        BLV_DRAFT.splice(i,1);
        redrawBlindEditor(s, {checked:marked});
      });
    });
    document.getElementById("blv-bulk-apply")?.addEventListener("click",()=>{
      readBlindEditor();
      const dur=(parseInt(document.getElementById("blv-bulk-dur")?.value)||15)*60;
      const marked = checkedBlindRows();
      marked.forEach(i=>{ if(BLV_DRAFT[i]) BLV_DRAFT[i].dur=dur; });
      redrawBlindEditor(s, {checked:marked});
    });
    document.getElementById("blv-save")?.addEventListener("click", async()=>{
      readBlindEditor();
      if(!BLV_DRAFT || !BLV_DRAFT.length){ showToast("A estrutura precisa ter pelo menos 1 nível","red"); return; }
      const draft = BLV_DRAFT;
      const norm = (l)=>[l.sb,l.bb,l.ante,l.dur,!!l.isBreak];
      // Houve exclusão, edição ou mudança de ordem em níveis que já existiam? Então pergunta o alcance.
      const kept = draft.filter(l=>!BLV_ADDED.has(l));
      const changedOther = JSON.stringify(kept.map(norm)) !== JSON.stringify(BLV_ORIG.map(norm));
      let otherFuture = false;
      if(changedOther){
        const ans = await askChangeScope();
        if(ans===null) return;           // voltou ao editor
        otherFuture = ans;
      }
      const futureAdds = draft.filter(l=>BLV_ADDED.has(l) && !BLV_ONCE.has(l));
      // Modelo das etapas futuras
      let tpl = null;
      if(!changedOther || otherFuture){
        if(otherFuture || futureAdds.length) tpl = draft.filter(l=>!BLV_ADDED.has(l) || !BLV_ONCE.has(l));
      } else if(futureAdds.length){
        // alterações nos existentes foram pontuais: modelo = estrutura original + só os níveis novos "futuros"
        const anchors = new Map();   // índice do original → novos inseridos logo depois (-1 = início)
        let anchor = -1;
        draft.forEach(l=>{
          if(BLV_ORIG_IDX.has(l)) anchor = BLV_ORIG_IDX.get(l);
          else if(BLV_ADDED.has(l) && !BLV_ONCE.has(l)){ if(!anchors.has(anchor)) anchors.set(anchor,[]); anchors.get(anchor).push(l); }
        });
        tpl = [...(anchors.get(-1)||[])];
        BLV_ORIG.forEach((o,k)=>{ tpl.push(o, ...(anchors.get(k)||[])); });
      }
      BLV_DRAFT = null;
      // Etapa primeiro (não perde nada se o modelo falhar); depois o modelo
      const prevLevels = s.blindLevels;
      s.blindLevels = draft;
      const okStage = await saveClockState(s);
      if(!okStage){ s.blindLevels = prevLevels; BLV_DRAFT = draft; return; }   // não fecha o editor, não muda o relógio local: nada se perde
      let tplMsg = "";
      if(tpl){
        try{
          await setDoc(doc(db,"clocks",tplDocId()),{levels:JSON.parse(JSON.stringify(tpl)), updatedAt:serverTimestamp()});
          tplMsg = " · modelo futuro atualizado";
        }catch(e){ showToast("Etapa salva, mas o modelo futuro falhou: "+e.message,"red"); }
      }
      closeAdminModal(); render();
      showToast("Estrutura de blinds salva ✓"+tplMsg,"green");
    });
  }

  // Live tick — single instance guaranteed by generation counter.
  // Every render() increments the generation; any older tick loop sees the
  // mismatch and exits. This prevents multiple concurrent loops after
  // admin actions trigger render() via onSnapshot.
  if(CLOCK_STAGE_ID){
    if(!window._clkGen) window._clkGen = 0;
    const myGen = ++window._clkGen;
    const tickStageId = CLOCK_STAGE_ID;
    let lastSec = -1;
    const tick = () => {
      // Stop if a newer tick loop was started (render called again)
      if(window._clkGen !== myGen) return;
      // Stop if user closed the clock
      if(CLOCK_STAGE_ID !== tickStageId) return;
      const dP = document.getElementById("clk-display");
      const dL = document.getElementById("clk-display-land");
      if(!dP && !dL) return;
      const s = DB.stages.find(x=>x.id===tickStageId); if(!s) return;
      // O tick só LÊ: nível e tempo são derivados do estado + hora do servidor.
      // Ninguém grava nada quando o nível vira — por isso não trava se o admin sair.
      const v = clockView(s);

      // Nível virou (ou rodando/parado mudou, ex.: fim do torneio): bipa e redesenha
      // a tela inteira, pois rótulo de round, blinds e botões mudam.
      const shown = window._clkRendered;
      if(shown && (shown.idx !== v.idx || shown.running !== v.running || shown.waiting !== v.waiting)){
        // bip quádruplo no último nível: o relógio estava rodando e o torneio acabou
        // (nas trocas de nível o bip toca ao ZERAR — mais abaixo — e a troca vem 2s depois)
        if(shown.running && v.finished) playLevelUpBeep();
        render();
        return;
      }

      const prev = window._clkPrev;
      // bip quádruplo ao ZERAR: o tempo do nível acabou e o relógio segura 00:00 por 2s antes de trocar
      if(prev && prev.idx===v.idx && v.running && v.holding && !prev.holding) playLevelUpBeep();
      // bip simples ao ENTRAR no último minuto (só se a gente viu o tempo cruzar 60s rodando)
      if(prev && prev.idx===v.idx && v.running && v.durMs>60000 && prev.rem>60000 && v.remainingMs<=60000 && v.remainingMs>0) playWarnBeep();
      window._clkPrev = {idx:v.idx, rem:v.remainingMs, holding:v.holding};

      const {mm,ss,rem,total} = clockRemaining(v);
      if(rem !== lastSec){
        lastSec = rem;
        const txt = String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
        const pct = Math.max(0, Math.min(100, (rem/total)*100));
        const bP = document.getElementById("clk-bar");
        const bL = document.getElementById("clk-bar-land");
        if(dP) dP.textContent = txt;
        if(bP) bP.style.width = pct+"%";
        if(dL) dL.textContent = txt;
        if(bL) bL.style.width = pct+"%";
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ── PREMIAÇÃO TAB EVENTS ─────────────────────────────────────────────────────
  // Helper: build override array preserving both value AND caixinha from current state
  function buildPrizeOverride(current){
    return current.map(p=>({value:p.value, caixinha:Number(p.caixinha)||0}));
  }

  document.querySelectorAll("[data-prize-pct]").forEach(el=>{
    el.addEventListener("change", async function(){
      const s = DB.stages.find(x=>x.id===BUYIN_MGMT); if(!s) return;
      const i = parseInt(this.dataset.prizePct);
      const fin = getFinanceData(s);
      const totalAPremiar = calcPotLiquido(s) - calcCaixinhaTorneioTotal(s);
      const current = calcPremiacao(s);
      const override = buildPrizeOverride(current);
      const newPct = parseFloat(this.value)||0;
      override[i].value = totalAPremiar * (newPct/100);
      fin.prizeOverrides = override;
      await saveFinanceData(); requestAnimationFrame(render);
    });
  });
  document.querySelectorAll("[data-prize-value]").forEach(el=>{
    el.addEventListener("change", async function(){
      const s = DB.stages.find(x=>x.id===BUYIN_MGMT); if(!s) return;
      const i = parseInt(this.dataset.prizeValue);
      const fin = getFinanceData(s);
      const current = calcPremiacao(s);
      const override = buildPrizeOverride(current);
      override[i].value = parseFloat(this.value)||0;
      fin.prizeOverrides = override;
      await saveFinanceData(); requestAnimationFrame(render);
    });
  });
  // New: caixinha per position — updates the derived caixinhaTorneio total
  // When caixinha changes, we keep the % and recalculate the prize value on
  // the new totalAPremiar so the "Soma dos Prêmios" indicator stays green.
  document.querySelectorAll("[data-prize-caixa]").forEach(el=>{
    el.addEventListener("change", async function(){
      const s = DB.stages.find(x=>x.id===BUYIN_MGMT); if(!s) return;
      const i = parseInt(this.dataset.prizeCaixa);
      const fin = getFinanceData(s);
      const current = calcPremiacao(s);
      const override = buildPrizeOverride(current);
      override[i].caixinha = parseFloat(this.value)||0;
      // Recalculate all prize values on the NEW totalAPremiar
      const newCaixinhaTot = override.reduce((sum,o)=>sum+(Number(o.caixinha)||0),0);
      const newTotalAPremiar = calcPotLiquido(s) - newCaixinhaTot;
      // Keep pcts, recalc values proportionally
      const pcts = current.map(p=>p.pct);
      override.forEach((o,idx)=>{ o.value = newTotalAPremiar * (pcts[idx]/100); });
      fin.prizeOverrides = override;
      await saveFinanceData(); requestAnimationFrame(render);
    });

  document.getElementById("bi-export-geral")?.addEventListener("click", async()=>{

    if(!el) return;
    try{
      if(!window.html2canvas){
        await new Promise((res,rej)=>{
          const sc=document.createElement("script");
          sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
          sc.onload=res; sc.onerror=rej;
          document.head.appendChild(sc);
        });
      }
      showToast("Gerando imagem...","green");

      // Clone the element so we can mutate it without affecting the live DOM.
      // Key fix: remove overflow:auto from the table wrapper so html2canvas
      // captures the full table width instead of just the visible viewport slice.
      const clone = el.cloneNode(true);
      clone.style.position = "fixed";
      clone.style.top = "-99999px";
      clone.style.left = "0";
      clone.style.width = "auto";       // let it expand to full content width
      clone.style.minWidth = "700px";   // ensure columns don't collapse
      clone.style.background = "#1a1a1a";
      clone.style.padding = "20px";
      clone.style.boxSizing = "border-box";

      // Remove overflow:auto from any scrollable wrappers so everything shows
      clone.querySelectorAll("*").forEach(node=>{
        const s = node.style;
        if(s.overflowX === "auto" || s.overflow === "auto"){
          s.overflowX = "visible";
          s.overflow  = "visible";
          s.width     = "auto";
          s.minWidth  = "none";
        }
        // Also expand tables to auto width
        if(node.tagName === "TABLE"){
          s.width    = "auto";

      // Try native share sheet first (works on mobile and most tablets) —
      // lets the user pick WhatsApp directly instead of just saving the file.
      if(navigator.share && navigator.canShare){
        try{
          const blob = await (await fetch(dataUrl)).blob();

            await navigator.share({ files:[file], text: caption });
            return;
          }
        } catch(e){ /* user cancelled or share failed — fall through to download */ }
      }

      // Fallback (desktop / unsupported browsers): download the image and
      // open WhatsApp Web so the user can attach it manually.
      const link = document.createElement("a");
      link.download = fileName;
      link.href = dataUrl;
      link.click();

    const newEmail = document.getElementById("new-email")?.value.trim();
    const newUid   = document.getElementById("new-uid")?.value.trim();
    const msgEl    = document.getElementById("dedit-msg");

    // Get current player to use as fallback
    const cur = DB.players.find(p=>p.uid===oldUid)||{};
    const finalName  = newName  || cur.name     || "";
    const finalNick  = newNick  || cur.nickname || "";
    const finalEmail = newEmail || cur.email    || "";
    const finalUid   = (newUid && newUid.length>5) ? newUid : oldUid;

    if(!finalName){

      return;

        stages = stages.map(s=>remapUidDeep(s, oldUid, finalUid));

// Re-render on real layout changes (rotation, window resize) but NOT on virtual
// keyboard open/close — keyboard only changes height, not width, and toggling
// it shouldn't tear down the DOM while the user has an input focused (this was
// causing edit fields to lose focus instantly, looking like they "wouldn't open").
let _lastViewportWidth = window.innerWidth;
let _resizeDebounce = null;
window.addEventListener("resize",()=>{
  clearTimeout(_resizeDebounce);
  _resizeDebounce = setTimeout(()=>{
    const widthChanged = window.innerWidth !== _lastViewportWidth;
    _lastViewportWidth = window.innerWidth;
    // Only re-render if width actually changed (rotation/real resize).
    // Height-only changes (virtual keyboard) are ignored.
    if(widthChanged && CURRENT_USER) render();
  }, 250);
});

    dbg("9. Admin: " + IS_ADMIN);
    try {
      dbg("12. Iniciando listeners...");
      startListeners(user); // pass user so we can link after data loads
      dbg("13. Listeners OK");
    } catch(e) {
      dbg("ERRO startListeners: " + e.message);
    }
    initNotifState().catch(()=>{});
  } else {
    CURRENT_USER     = null;
    CURRENT_USER_UID = null;
    CURRENT_PLAYER   = null;
    IS_ADMIN         = false;
    stopListeners();
    document.getElementById("app").innerHTML = renderLoginScreen();
    bindLoginEvents();
  }
});

// ── ENSURE PLAYER PROFILE ─────────────────────────────────────────────────────
async function ensurePlayerProfile(user){
  if(window._deletingAccount) return;   // exclusão em andamento (LGPD): não recria e-mail/nome no registro anonimizado
  let player = DB.players.find(p=>p.uid===user.uid);
  if(player && player.deleted) return;  // registro anonimizado
  let needsSave = false, relinked = false;

  if(!player){
    // 1. Match by email
    if(user.email){
      player = DB.players.find(p=>p.email && p.email.toLowerCase()===user.email.toLowerCase());
    }

    // 2. Match by displayName (normalize: lowercase, no accents, trim)
    if(!player && user.displayName){
      const norm = s => (s||"").toLowerCase().normalize("NFD")
        .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
      // Handle "Nome|Apelido" format from signup
      const rawDisplay = user.displayName.includes("|")
        ? user.displayName.split("|")[0].trim()
        : user.displayName;
      const normDisplay = norm(rawDisplay);
      const nameMatches = DB.players.filter(p=>{
        if(!String(p.uid||"").startsWith("p_")) return false;   // só jogadores pré-cadastrados sem login; nunca "rouba" conta já vinculada
        const normName = norm(p.name||"");
        // Full name match
        if(normName === normDisplay) return true;
        // First + last name match (handles "Victor Asdourian" vs "victor asdourian")
        const partsA = normDisplay.split(" ").filter(Boolean);
        const partsB = normName.split(" ").filter(Boolean);
        if(partsA.length>=2 && partsB.length>=2){
          return partsA[0]===partsB[0] && partsA[partsA.length-1]===partsB[partsB.length-1];
        }
        return false;
      });
      if(nameMatches.length===1) player = nameMatches[0];   // ambíguo (2+ iguais) → não vincula sozinho; vira perfil novo
    }

    if(player && SCHEMA_V2 && player.uid!==user.uid){
      const _adm = ADMIN_EMAILS.includes(user.email) || (DB.admins||[]).includes(user.email) || (DB.admins||[]).includes(user.uid);
      if(!_adm){
        // estrutura nova: jogador comum não reescreve o histórico de outro registro; pede vínculo ao admin
        const cand = player; player = null;
        const via = (cand.email && user.email && String(cand.email).toLowerCase()===String(user.email).toLowerCase()) ? "email" : "nome";
        try{ await setDoc(v2ClaimRef(user.uid), {uid:user.uid, candidate:cand.uid, via, email:user.email||"", emailVerified: !!user.emailVerified, name:user.displayName||"", createdAt:serverTimestamp()}); }catch(e){ console.warn("claim:", e.message); }
      }
    }
    if(player){
      // Link Firebase uid — user's own data ALWAYS wins over pre-created seed data
      const prevUid = player.uid;
      player.uid   = user.uid;
      if(prevUid && prevUid !== user.uid){
        // o histórico do jogador pré-cadastrado (inscrições, resultados, buy-ins, cash) passa para o uid real
        DB.stages = DB.stages.map(s=>remapUidDeep(s, prevUid, user.uid));
        relinked = true;
      }
      player.email = user.email || player.email;

      let rawName = (user.displayName||"").trim();

      if(rawName.includes("|")){
        // Email/password signup: "Nome|Apelido" format
        const parts = rawName.split("|");
        const userN = parts[0].trim();
        const userNick = parts[1].trim();
        if(userN)    player.name     = userN;
        if(userNick) player.nickname = userNick;
        try{ await updateProfile(user,{displayName:userN}); }catch(e){}
      } else if(rawName && !rawName.includes("@")){
        // Google login with real displayName: use it as name
        player.name = rawName;
        // Keep existing nickname if pre-created, otherwise use first name
        if(!player.nickname || player.nickname===player.name.split(" ")[0]){
          player.nickname = rawName.split(" ")[0];
        }
      } else if(rawName.includes("@") || !rawName){
        // Google login with no displayName or email as name — keep pre-created data
        // Don't override with empty/email values
      }
      needsSave = true;
    }
  }

  if(player){
    // Update email if missing
    if(!player.email && user.email){ player.email=user.email; needsSave=true; }
  } else {
    // New user — create profile
    let rawName = user.displayName || user.email?.split("@")[0] || "Jogador";
    let realName = rawName;
    let nick = rawName.split(" ")[0];
    if(rawName.includes("|")){
      const parts = rawName.split("|");
      realName = parts[0].trim();
      nick     = parts[1].trim(); // no fallback — must come from signup form
      try{ await updateProfile(user, { displayName: realName }); }catch(e){}
    }
    // Only create if truly new
    if(!DB.players.find(p=>p.uid===user.uid)){
      // If name looks like email or is empty, don't create yet
      // renderProfileSetup will handle it
      if(!realName || realName.includes("@") || realName.length<2){
        realName = "";
        nick     = "";
      }
      player = { uid:user.uid, name:realName, nickname:nick, email:user.email||"", season:ACTIVE_SEASON, needsSetup: !realName };
      DB.players.push(player);
      needsSave = true;
    } else {
      player = DB.players.find(p=>p.uid===user.uid);
    }
  }

  if(needsSave){
    try {
      if(relinked) await commitDB();   // jogadores + etapas juntos (mescla com o servidor)
      else await savePlayers();        // só o perfil
    } catch(e){ console.warn("Profile save:", e.message); }
  }
  CURRENT_PLAYER = player;
}

// ── FIRESTORE LISTENERS (real-time) ──────────────────────────────────────────
let _unsubListeners = [];
function stopListeners(){ _unsubListeners.forEach(fn=>fn()); _unsubListeners=[]; }

function handleServerData(data, user, fromV2){
    const _srvPlayers = sanitizeIncoming(data.players || [], "players");
    const _srvStages  = sanitizeIncoming(data.stages || [], "stages");
    setBaseline(_srvPlayers, _srvStages, (data.admins||[]));
    DB.players = _srvPlayers;
    DB.admins  = (data.admins || []).map(a=> typeof a==="string" ? a.replace(/[<>"'`]/g,"") : a);
    // If admin is editing a result, preserve local draft to avoid overwrite
    const editingStageId = resultStage ? resultStage.id : null;
    // If admin has the financial management screen open for a stage,
    // preserve local finance/buyinData so in-progress edits (inputs being
    // typed) aren't wiped out by the snapshot echo of our own save.
    const editingFinanceId = BUYIN_MGMT;
    // (O estado do relógio não vive mais neste documento — ver coleção "clocks".)
    DB.stages = _srvStages.map(s=>{
      const local = DB.stages.find(x=>x.id===s.id);
      if(s.id===editingStageId && local){
        return {...s, draft: local.draft};
      }
      if(s.id===editingFinanceId && local){
        return {...s, finance: local.finance, buyinData: local.buyinData};
      }
      return s;
    }).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  dbg("16. Players=" + DB.players.length + " Stages=" + DB.stages.length);
  if(!fromV2 && DB.players.length === 0 && DB.stages.length === 0){
    dbg("17. Documento vazio!");
    setDoc(doc(db,"seasons",DATA_SEASON), {players: SEED.players, stages: SEED.stages, updatedAt: serverTimestamp()})
      .then(()=>{ dbg("SEED enviado com sucesso!"); }).catch(e=>{ dbg("ERRO seed: " + e.message); });
    DB.players = SEED.players; DB.stages = SEED.stages;
  }
    // Link user to player after data is loaded
    if(user && DB.players.length > 0){
      ensurePlayerProfile(user).then(()=>{
        IS_ADMIN = ADMIN_EMAILS.includes(user.email) || (DB.admins||[]).includes(user.email) || (DB.admins||[]).includes(user.uid);
        dbg("18. Renderizando app...");
        render();
      });
    } else {
      // Re-apply current player (snapshot may have stale data briefly)
      const freshPlayer = DB.players.find(p=>p.uid===CURRENT_USER_UID);
      CURRENT_PLAYER = freshPlayer || CURRENT_PLAYER;
      dbg("18. Renderizando app...");
      render();
    }
}
function startListeners(user){
  stopListeners();
  dbg("14. Conectando ao Firestore...");
  // Detecta a estrutura de dados (config/schema). Se mudar em tempo real (virada), recarrega o app.
  let _decided = false;
  const unsubSchema = onSnapshot(doc(db,"config","schema"), (snap)=>{
    const v2 = !!(snap.exists() && snap.data().version===2);
    if(_decided){ if(v2!==SCHEMA_V2){ dbg("Estrutura de dados mudou — recarregando"); location.reload(); } return; }
    _decided = true; SCHEMA_V2 = v2; V2.verified = !!(snap.exists() && snap.data().verified);
    if(v2) v2Listen(user); else legacyListen(user);
  }, (e)=>{ if(_decided) return; _decided = true; dbg("config/schema indisponível: "+e.code+" — usando estrutura antiga"); legacyListen(user); });
  _unsubListeners.push(unsubSchema);
  startAuxListeners(user);
}
function legacyListen(user){
  const unsub = onSnapshot(
    doc(db,"seasons",DATA_SEASON),
    (snap)=>{
      dbg("15. Firestore snapshot recebido, exists=" + snap.exists());
      if(snap.exists()){
        handleServerData({players:snap.data().players||[], stages:snap.data().stages||[], admins:snap.data().admins||[]}, user, false);
      } else {
        dbg("16. Documento 2026 NAO existe! Criando...");
        setDoc(doc(db,"seasons",DATA_SEASON), {players: SEED.players, stages: SEED.stages, updatedAt: serverTimestamp()})
          .then(()=>{ dbg("17. SEED criado!"); }).catch(e=>{ dbg("ERRO ao criar seed: " + e.message); });
        DB.players = SEED.players; DB.stages = SEED.stages;
        const fp = DB.players.find(p=>p.uid===CURRENT_USER_UID); CURRENT_PLAYER = fp || CURRENT_PLAYER;
        render();
      }
    },
    (err)=>{
      dbg("ERRO Firestore: " + err.code + " - " + err.message);
      DB.players = SEED.players; DB.stages = SEED.stages; render();
    }
  );
  _unsubListeners.push(unsub);
}
function startAuxListeners(user){

  // Relógios (para o aviso "Relógio ao vivo" na tela principal) — tolerante a falha, não bloqueia o app
  try {
    const unsubClocks = onSnapshot(collection(db,"clocks"), (snap)=>{
      const prefix = DATA_SEASON + "_";
      const seen = {};
      snap.forEach(d=>{
        if(!d.id.startsWith(prefix) || d.id===tplDocId()) return;
        seen[d.id.slice(prefix.length)] = clockNormalize(d.data());
      });
      const sigBefore = clockBannerSig();
      Object.keys(CLOCK_LIVE).forEach(k=>delete CLOCK_LIVE[k]);
      Object.assign(CLOCK_LIVE, seen);
      // só redesenha se o aviso mudou e o usuário está na tela principal (não interrompe quem está digitando em outra tela)
      if(clockBannerSig()!==sigBefore && !CLOCK_STAGE_ID && TAB==="home" && CURRENT_USER) render();
    }, (e)=>{ console.warn("Clocks listener:", e.message); });
    _unsubListeners.push(unsubClocks);
  } catch(e) { console.warn("Clocks setup:", e.message); }

  // Listen to rules config (non-blocking)
  try {
    const unsubRules = onSnapshot(doc(db,"config","rules"), (snap)=>{
      if(snap.exists()){
        const data = snap.data();
        // Only use if has actual content
        if(data.nlholdem && data.nlholdem.buyin){
          DEFAULT_RULES = data;
        }
      }
    }, (e)=>{ console.warn("Rules listener:", e.message); });
    _unsubListeners.push(unsubRules);
  } catch(e) { console.warn("Rules setup:", e.message); }
}

// ── EXPOSE FUNCTIONS TO GLOBAL SCOPE (required for inline onclick with type=module) ──
window.openRouteModal    = openRouteModal;
window.openEditRulesModal = openEditRulesModal;
window.showProfile       = showProfile;
window.closeProfile      = closeProfile;

</script>

// ── ABA: CUSTOS ───────────────────────────────────────────────────────────────
function renderBuyinCustos(s){
  const fin = getFinanceData(s);
  const arrecadado = calcArrecadado(s);
  const custosFixos = calcCustosFixos(fin);
  const potFinal = calcPotFinal(s);
  const taxaFT = calcTaxaFT(s);
  const potLiquido = calcPotLiquido(s);

  // Shared input styles
  const nameStyle = `width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:10px 12px;color:#fff;font-size:14px;box-sizing:border-box`;
  const valWrap = `position:relative;width:100%`;
  const valPrefix = `position:absolute;left:10px;top:11px;color:var(--muted);font-size:13px;pointer-events:none`;
  const valStyle = `width:100%;background:var(--surface2);border:1px solid var(--yellow);border-radius:4px;padding:10px 12px 10px 32px;color:#fff;font-size:15px;font-weight:700;box-sizing:border-box`;

  const dealersHtml = (fin.dealers||[]).map((d,i)=>`
    <div style="border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--bg-dark)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Dealer ${i+1}</div>
        ${(fin.dealers||[]).length>1?`<button data-dealer-remove="${i}" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:12px;flex-shrink:0">✕</button>`:""}
      </div>
      <input data-dealer-name="${i}" value="${d.name||""}" placeholder="Nome do Dealer" style="${nameStyle};margin-bottom:8px"/>
      <div style="${valWrap}">
        <span style="${valPrefix}">R$</span>
        <input data-dealer-cost="${i}" type="number" inputmode="decimal" value="${d.cost}" style="${valStyle}"/>
      </div>
    </div>`).join("");

  const extrasHtml = (fin.extraCosts||[]).map((e,i)=>`
    <div style="border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--bg-dark)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Custo Extra ${i+1}</div>
        <button data-extra-remove="${i}" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:12px;flex-shrink:0">✕</button>
      </div>
      <input data-extra-label="${i}" value="${e.label||""}" placeholder="Descrição" style="${nameStyle};margin-bottom:8px"/>
      <div style="${valWrap}">
        <span style="${valPrefix}">R$</span>
        <input data-extra-value="${i}" type="number" inputmode="decimal" value="${e.value}" style="${valStyle}"/>
      </div>
    </div>`).join("");

  return `
    <!-- Floor -->
    <div class="card" style="margin-bottom:12px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:10px">Floor</div>
      <input id="bi-floor-name" value="${fin.floorName||""}" placeholder="Nome do Floor" style="${nameStyle};margin-bottom:8px"/>
      <div style="${valWrap}">
        <span style="${valPrefix}">R$</span>
        <input id="bi-floor-cost" type="number" inputmode="decimal" value="${fin.floorCost}" style="${valStyle}"/>
      </div>
    </div>

    <!-- Dealers -->
    <div class="card" style="margin-bottom:12px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:10px">Dealers</div>
      <div id="bi-dealers-list">${dealersHtml}</div>
      <button id="bi-add-dealer" class="btn bo sm" style="margin-top:4px">＋ Adicionar Dealer</button>
    </div>

    <!-- Extra costs -->
    <div class="card" style="margin-bottom:12px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:10px">Custos Extras</div>
      <div id="bi-extras-list">${extrasHtml || '<div style="color:var(--muted);font-size:12px;margin-bottom:8px">Nenhum custo extra.</div>'}</div>
      <button id="bi-add-extra" class="btn bo sm" style="margin-top:4px">＋ Adicionar Custo Extra</button>
    </div>

    <!-- Caixinhas -->
    <div class="card" style="margin-bottom:16px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:10px">Caixinhas</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Caixinha Cash</div>
          <div style="${valWrap}">
            <span style="${valPrefix}">R$</span>
            <input id="bi-caixinha-cash" type="number" inputmode="decimal" value="${fin.caixinhaCash}" style="${valStyle}"/>
          </div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Caixinha Torneio</div>
          <div style="${valWrap}">
            <span style="${valPrefix}">R$</span>
            <input id="bi-caixinha-torneio" type="number" inputmode="decimal" value="${calcCaixinhaTorneioTotal(s).toFixed(2)}" ${fin.prizeOverrides&&fin.prizeOverrides.length?`readonly style="${valStyle};opacity:0.6;cursor:not-allowed" title="Calculado automaticamente pela soma das caixinhas por posição (aba Premiação)"`:`style="${valStyle}"`}/>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px">As caixinhas não afetam o Pot Final — são divididas entre Floor e Dealers separadamente (ver Resumo Geral). A Caixinha Torneio é descontada da premiação.</div>
    </div>

    <!-- Summary -->
    <div class="card" style="border:1px solid var(--yellow)">
      <div class="row" style="justify-content:space-between;padding:4px 0"><span style="color:var(--muted);font-size:13px">Arrecadado</span><span style="color:#fff;font-weight:600">${fmtBRL(arrecadado)}</span></div>
      <div class="row" style="justify-content:space-between;padding:4px 0"><span style="color:var(--muted);font-size:13px">Custos Fixos</span><span style="color:var(--red);font-weight:600">− ${fmtBRL(custosFixos)}</span></div>
      <div class="row" style="justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);margin-top:4px;padding-top:8px"><span style="color:#fff;font-weight:700">POT FINAL</span><span style="color:var(--yellow);font-weight:900;font-size:16px">${fmtBRL(potFinal)}</span></div>
      <div class="row" style="justify-content:space-between;padding:4px 0"><span style="color:var(--muted);font-size:13px">Taxa FT (15%)</span><span style="color:var(--red);font-weight:600">− ${fmtBRL(taxaFT)}</span></div>
      ${s.type==="knockout"?`<div class="row" style="justify-content:space-between;padding:4px 0"><span style="color:var(--muted);font-size:13px">🥊 KO Pool (entradas×${Number(getFinanceData(s).koPer)||DEFAULT_KO_PER_ENTRY}×${fmtBRL(Number(getFinanceData(s).koValue)||DEFAULT_KO_VALUE)})</span><span style="color:var(--red);font-weight:600">− ${fmtBRL(calcKOFromEntries(s))}</span></div>`:""}
      <div class="row" style="justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);margin-top:4px;padding-top:8px"><span style="color:#fff;font-weight:700">POT LÍQUIDO</span><span style="color:var(--yellow);font-weight:900;font-size:18px">${fmtBRL(potLiquido)}</span></div>
    </div>`;
}

// ── ABA: PREMIAÇÃO (ITM) ──────────────────────────────────────────────────────
function renderBuyinPremiacao(s){
  const fin = getFinanceData(s);
  const numPlayers = (s.inscriptions||[]).length;
  const potLiquido = calcPotLiquido(s);
  const premios = calcPremiacao(s);
  const caixinhaTorneio = calcCaixinhaTorneioTotal(s); // derived from per-position caixinhas
  const totalAPremiar = potLiquido - caixinhaTorneio;
  const isPKO = s.type==="knockout";
  const koValue = Number(fin.koValue)||DEFAULT_KO_VALUE;
  const koTotal = isPKO ? calcKOTotalPayout(s) : 0;

  // KO section (PKO only): list each player's KO count and earnings
  const koPer       = Number(fin.koPer)||DEFAULT_KO_PER_ENTRY;
  const koFromEntry = isPKO ? calcKOFromEntries(s) : 0;  // rule-based (used for pot calc)
  const koFromResult= isPKO ? calcKOTotalPayout(s) : 0;  // results-based (conference)
  const koDiff      = koFromEntry - koFromResult;
  const koMatch     = Math.abs(koDiff) < 0.01;

  const ins    = (s.inscriptions||[]).length;
  const records= s.buyinData||[];
  const totalRS= records.reduce((sum,r)=>sum+(Number(r.rs)||0),0);
  const totalRD= records.reduce((sum,r)=>sum+(Number(r.rd)||0),0);

  // KO section (PKO only)
  const koSection = isPKO ? `
    <div class="card" style="margin-bottom:16px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:12px">🥊 Bounties (KO)</div>

      <!-- Editable params -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Valor por KO</div>
          <div style="position:relative;width:100px">
            <span style="position:absolute;left:8px;top:8px;color:var(--muted);font-size:12px;pointer-events:none">R$</span>
            <input id="bi-ko-value" type="number" inputmode="decimal" value="${koValue}" style="width:100%;background:var(--surface2);border:1px solid var(--yellow);border-radius:4px;padding:7px 8px 7px 26px;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box"/>
          </div>
        </div>
        <div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">KOs por entrada</div>
          <input id="bi-ko-per" type="number" inputmode="decimal" value="${koPer}" style="width:80px;background:var(--surface2);border:1px solid var(--yellow);border-radius:4px;padding:7px 10px;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box"/>
        </div>
      </div>

      <!-- Rule-based calculation breakdown -->
      <div style="background:var(--bg-dark);border-radius:6px;padding:10px 12px;margin-bottom:12px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Cálculo pela Regra (base do pot)</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px">
          <span>(${ins} entradas</span>
          ${totalRS>0?`<span>+ ${totalRS} RS</span>`:""}
          ${totalRD>0?`<span>+ ${totalRD} RD</span>`:""}
          <span>) × ${koPer} KOs × ${fmtBRL(koValue)}</span>
        </div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--yellow)">${fmtBRL(koFromEntry)}</div>
      </div>

      <!-- Conference: results vs rule -->
      <div style="background:var(--surface2);border:1px solid ${koMatch?"var(--green)":"var(--red)"};border-radius:6px;padding:10px 12px;margin-bottom:12px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Conferência (KOs registrados no resultado)</div>
        ${(s.results||[]).filter(r=>Number(r.knockouts)>0).sort((a,b)=>a.position-b.position).map(r=>{
          const pl=getP(r.playerId)||{nickname:"?"};
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <span style="font-size:12px;color:#fff">${pl.nickname||pl.name} <span style="color:var(--muted)">(${r.position}º)</span></span>
            <span style="font-size:12px;color:var(--muted)">🥊 ${r.knockouts} × ${fmtBRL(koValue)} = <b style="color:#fff">${fmtBRL(Number(r.knockouts)*koValue)}</b></span>
          </div>`;
        }).join("") || `<div style="font-size:12px;color:var(--muted)">Nenhum resultado publicado ainda.</div>`}
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;margin-top:6px;border-top:1px solid rgba(255,255,255,.1)">
          <span style="font-size:12px;color:var(--muted)">Total registrado</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:${koMatch?"var(--green)":"var(--red)"}">${fmtBRL(koFromResult)}</span>
        </div>
        ${!koMatch?`<div style="font-size:11px;color:var(--red);margin-top:6px;font-weight:600">⚠ Diferença de ${fmtBRL(Math.abs(koDiff))} entre regra e resultado registrado</div>`:""}
        ${koMatch?`<div style="font-size:11px;color:var(--green);margin-top:4px">✓ KOs conferidos</div>`:""}
      </div>
    </div>` : "";

  // Validation indicators
  const sumPct   = premios.reduce((sum,p)=>sum+p.pct,0);
  const sumValue = premios.reduce((sum,p)=>sum+p.value,0);
  const sumCaixa = premios.reduce((sum,p)=>sum+(Number(p.caixinha)||0),0);
  const pctOk   = Math.abs(sumPct-100) < 0.01;
  const valueOk = Math.abs(sumValue-totalAPremiar) < 0.5;
  const caixaOk  = Math.abs(sumCaixa-caixinhaTorneio) < 0.5;

  // Detect stale overrides (e.g. values calculated before PKO bounties were configured)
  const hasStaleOverrides = fin.prizeOverrides && fin.prizeOverrides.length && sumPct > 110;
  const staleWarning = hasStaleOverrides ? `
    <div style="background:rgba(231,76,60,.1);border:1px solid var(--red);border-radius:6px;padding:12px 14px;margin-bottom:16px">
      <div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:6px">⚠ Premiação desatualizada</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Os valores foram calculados com uma base diferente (antes de configurar os bounties PKO). Recalcule automaticamente para corrigir.</div>
      <button id="bi-reset-prizes" class="btn bd fw" style="font-size:13px;padding:10px;color:var(--yellow);border-color:var(--yellow)">↺ Recalcular Automático agora</button>
    </div>` : "";

  const rows = premios.map((p,i)=>`
    <div style="padding:10px 0;border-bottom:1px solid var(--border)" data-prize-row="${i}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:var(--yellow);width:28px;flex-shrink:0">${p.position}º</div>
        <div style="width:70px;flex-shrink:0">
          <div style="position:relative">
            <input data-prize-pct="${i}" type="number" inputmode="decimal" value="${p.pct.toFixed(2)}" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px 18px 6px 8px;color:#fff;font-size:12px;box-sizing:border-box"/>
            <span style="position:absolute;right:6px;top:7px;color:var(--muted);font-size:11px">%</span>
          </div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">Prêmio</div>
          <div style="position:relative">
            <span style="position:absolute;left:8px;top:7px;color:var(--muted);font-size:11px">R$</span>
            <input data-prize-value="${i}" type="number" inputmode="decimal" step="0.01" value="${p.value.toFixed(2)}" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px 8px 6px 26px;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box;text-align:right"/>
          </div>
        </div>
        <div style="width:90px;flex-shrink:0">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">Caixinha</div>
          <div style="position:relative">
            <span style="position:absolute;left:8px;top:7px;color:var(--muted);font-size:11px">R$</span>
            <input data-prize-caixa="${i}" type="number" inputmode="decimal" step="0.01" value="${(Number(p.caixinha)||0).toFixed(2)}" style="width:100%;background:var(--surface2);border:1px solid var(--yellow);border-radius:4px;padding:6px 6px 6px 26px;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box;text-align:right"/>
          </div>
        </div>
        ${premios.length>2?`<button data-prize-remove="${i}" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:4px;width:28px;height:28px;cursor:pointer;flex-shrink:0;font-size:12px">✕</button>`:""}
      </div>
    </div>`).join("");

  return `
    <div style="background:var(--surface2);border:1px solid var(--yellow);border-radius:6px;padding:12px 16px;margin-bottom:16px">
      <div style="font-size:12px;color:var(--muted)">Pot Líquido (base do cálculo)</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--yellow)">${fmtBRL(potLiquido)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${numPlayers} inscritos · Faixa ITM ${isPKO?"PKO":"NLH"} aplicada automaticamente</div>
      ${isPKO&&koTotal>0?`<div style="font-size:11px;color:var(--yellow);margin-top:4px">🥊 Bounties: ${fmtBRL(koTotal)} (separados do ITM)</div>`:""}
    </div>

    ${koSection}

    <!-- Caixinha Torneio — read-only, derived as sum of per-position caixinhas -->
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase">Caixinha Torneio</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:var(--yellow)">${fmtBRL(caixinhaTorneio)}</div>
      </div>
      <div style="font-size:11px;color:var(--muted)">Soma das caixinhas por posição — descontada do Pot Líquido antes da distribuição.</div>
      <div style="display:flex;justify-content:space-between;padding-top:8px;margin-top:8px;border-top:1px solid var(--border)">
        <span style="color:var(--muted);font-size:12px">Total a Premiar</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:var(--yellow)">${fmtBRL(totalAPremiar)}</span>
      </div>
    </div>

    ${staleWarning}

    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;justify-content:space-between">
      <span>Posição</span><span style="margin-right:98px">Prêmio</span><span>Caixinha</span>
    </div>
    <div class="card" style="padding:0 12px">${rows}</div>

    <!-- Validation indicators -->
    <div style="display:flex;gap:10px;margin-top:14px">
      <div style="flex:1;background:var(--surface2);border:1px solid ${pctOk?"var(--green)":"var(--red)"};border-radius:6px;padding:10px 12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Soma das %</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:${pctOk?"var(--green)":"var(--red)"}">${pctOk?"✓":"⚠"} ${sumPct.toFixed(2)}%</div>
      </div>
      <div style="flex:1;background:var(--surface2);border:1px solid ${valueOk?"var(--green)":"var(--red)"};border-radius:6px;padding:10px 12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Soma dos Prêmios</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:${valueOk?"var(--green)":"var(--red)"}">${valueOk?"✓":"⚠"} ${fmtBRL(sumValue)}</div>
      </div>
    </div>
    ${sumCaixa>0?`<div style="display:flex;gap:10px;margin-top:8px">
      <div style="flex:1;background:var(--surface2);border:1px solid ${caixaOk?"var(--green)":"var(--red)"};border-radius:6px;padding:10px 12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Total Caixinhas</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:${caixaOk?"var(--green)":"var(--red)"}">${caixaOk?"✓":"⚠"} ${fmtBRL(sumCaixa)}</div>
      </div>
    </div>`:""}

    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="bi-add-prize-pos" class="btn bo sm">＋ Adicionar Posição</button>
      <button id="bi-reset-prizes" class="btn bo sm" style="color:var(--muted)">↺ Recalcular Automático</button>
    </div>`;
}

// ── ABA: RESUMO GERAL ─────────────────────────────────────────────────────────
function renderBuyinGeral(s){
  const vals = getBuyinValues(s);
  const fin = getFinanceData(s);
  const ins = s.inscriptions||[];
  const premios = calcPremiacao(s);
  const arrecadado = calcArrecadado(s);
  const custosFixos = calcCustosFixos(fin);
  const potFinal = calcPotFinal(s);
  const potLiquido = calcPotLiquido(s);
  const staffPayouts = calcStaffPayouts(s);
  const results = s.results || [];
  const isPKO = s.type==="knockout";

  // All UIDs to show: torneio inscribed + cash-game-only players
  const cg = getCashGameData(s);
  const cashOnlyUids = (cg.players||[]).filter(uid=>!ins.includes(uid));
  const allUids = [...ins, ...cashOnlyUids];

  const thStyle = "padding:6px;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase";

  const playerRows = allUids.map(uid=>{
    const pl = getP(uid)||{name:uid,nickname:"?"};
    const isCashOnly = !ins.includes(uid);
    const rec = isCashOnly ? {rs:0,rd:0,addon:false,paid:false} : getBuyinRecord(s, uid);
    const totalTorneio = isCashOnly ? 0 : entradaJogador(vals, rec);
    const result = results.find(r=>r.playerId===uid);
    const prize = result ? (premios.find(p=>p.position===result.position)?.value || 0) : 0;
    const koEarnings = isPKO ? calcKOEarnings(s, uid) : 0;

    // Cash game saldo for this player
    const cashSaldo = getCashPlayerSaldo(s, uid); // null = em jogo / sem cash

    // Saldo Final = Prêmio + KO − Entrada Torneio + Saldo Cash (if any)
    const saldoTorneio = prize + koEarnings - totalTorneio;
    const saldoFinal = saldoTorneio + (cashSaldo !== null ? cashSaldo : 0);

    const isPaid = !!rec.paid;
    const tdS = "padding:8px 6px;border-bottom:1px solid var(--border);font-size:13px";

    return `<tr style="${isCashOnly?"opacity:0.85":""}">
      <td style="${tdS};color:#fff">${pl.nickname||pl.name}${isCashOnly?` <span style="font-size:10px;color:var(--green)">CG</span>`:""}</td>
      <td style="${tdS};color:var(--muted);text-align:center">${result?result.position+"º":"—"}</td>
      <td style="${tdS};text-align:right">${isCashOnly?"—":fmtBRL(totalTorneio)}</td>
      ${isPKO?`<td style="${tdS};text-align:right;color:${koEarnings>0?"var(--yellow)":"var(--muted)"};font-weight:${koEarnings>0?"700":"400"}">${koEarnings>0?fmtBRL(koEarnings):"—"}</td>`:""}
      <td style="${tdS};color:${prize>0?"var(--yellow)":"var(--muted)"};text-align:right;font-weight:${prize>0?"700":"400"}">${prize>0?fmtBRL(prize):"—"}</td>
      <td style="${tdS};text-align:right;font-weight:700;color:${cashSaldo===null?"var(--muted)":cashSaldo<0?"var(--red)":cashSaldo>0?"var(--green)":"var(--muted)"}">${cashSaldo===null?"—":(cashSaldo>0?"+":"")+fmtBRL(cashSaldo)}</td>
      <td style="${tdS};text-align:right;font-weight:700;color:${saldoFinal<0?"var(--red)":saldoFinal>0?"var(--green)":"var(--muted)"}">${saldoFinal===0?"—":(saldoFinal>0?"+":"")+fmtBRL(saldoFinal)}</td>
      <td style="${tdS};text-align:center">
        <input type="checkbox" data-paid-uid="${uid}" ${isPaid?"checked":""} style="width:18px;height:18px;cursor:pointer;accent-color:var(--yellow)"/>
      </td>
    </tr>`;
  }).join("");

  const staffRows = staffPayouts.map(st=>`
    <div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="color:#fff;font-size:13px;font-weight:600">${st.role}${st.name!=="—"?" — "+st.name:""}</div>
        <div style="font-size:11px;color:var(--muted)">Base ${fmtBRL(st.base)}${st.share>0?` + Caixinha ${fmtBRL(st.share)}`:""}</div>
      </div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:var(--yellow)">${fmtBRL(st.total)}</div>
    </div>`).join("");

  return `
    <div id="bi-geral-export">
      <div style="background:var(--surface2);border:1px solid var(--yellow);border-radius:6px;padding:14px 16px;margin-bottom:16px">
        <div class="row" style="justify-content:space-between;padding:3px 0"><span style="color:var(--muted);font-size:12px">Arrecadado</span><span style="color:#fff;font-size:13px">${fmtBRL(arrecadado)}</span></div>

function renderCashGameMgmt(){
  const s = DB.stages.find(x=>x.id===CASHGAME_MGMT);
  if(!s) return "<div class='sec'>Etapa não encontrada.</div>";

  if(CASHGAME_PLAYER) return renderCashGamePlayer(s);

  const cg = getCashGameData(s);
  const fin = getFinanceData(s);
  const caixinhaCash = Number(fin.caixinhaCash)||0;

  const playerRows = (cg.players||[]).map((uid,i)=>{
    const pl = getP(uid)||{name:uid,nickname:"?"};
    const totalEntries = getCashPlayerTotalEntries(s, uid);
    const cashout = getCashPlayerCashout(s, uid);
    const saldo = getCashPlayerSaldo(s, uid);
    return `<div data-cg-player="${uid}" style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer">
      <div style="color:var(--muted);font-size:12px;width:22px;text-align:center;flex-shrink:0">${i+1}</div>
      ${AV(uid)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:#fff;font-size:14px">${pl.nickname||pl.name}</div>
        <div style="font-size:11px;color:var(--muted)">Entrada: ${fmtBRL(totalEntries)}${cashout!==null?` · Saída: ${fmtBRL(cashout)}`:" · Em jogo"}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:${saldo===null?"var(--muted)":saldo<0?"var(--red)":saldo>0?"var(--green)":"var(--muted)"}">${saldo===null?"—":(saldo>0?"+":"")+fmtBRL(saldo)}</div>
        <div style="font-size:10px;color:var(--muted)">saldo</div>
      </div>
      <div style="color:var(--muted);font-size:18px;flex-shrink:0">›</div>
    </div>`;
  }).join("");

  const addPanel = `
  <div style="margin-top:16px;border-top:2px solid var(--green);padding-top:14px">
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px">Adicionar jogador ao Cash Game</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="cg-search" type="text" placeholder="Buscar jogador..." style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:8px 10px;color:#fff;font-size:13px"/>
    </div>
    <div id="cg-search-results" style="max-height:180px;overflow-y:auto"></div>
    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">
      <button id="cg-new-player-btn" class="btn bo sm">＋ Novo jogador</button>
    </div>
  </div>`;

  // Totals: saídas dos jogadores + caixinha cash (que sai do pot do cash game)
  const totalEntradas = (cg.players||[]).reduce((sum,uid)=>sum+getCashPlayerTotalEntries(s,uid),0);
  const totalSaidasJogadores = (cg.players||[]).reduce((sum,uid)=>{
    const c = getCashPlayerCashout(s,uid);
    return sum + (c===null?0:c);
  },0);
  const totalSaidas = totalSaidasJogadores + caixinhaCash;
  const balanced = Math.abs(totalEntradas - totalSaidas) < 0.01;

  return `<div class="sec">
    <button id="btn-cg-back" class="btn bo mb10" style="font-size:12px">‹ Voltar à etapa</button>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;margin-bottom:4px">🃏 Cash Game</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">${s.name}</div>

    <!-- Caixinha Cash — synced with Financeiro tab (fin.caixinhaCash) -->
    <div class="card" style="margin-bottom:14px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:8px">Caixinha Cash</div>
      <div style="position:relative;margin-bottom:6px">
        <span style="position:absolute;left:9px;top:9px;color:var(--muted);font-size:13px">R$</span>
        <input id="cg-caixinha-cash" type="number" value="${fin.caixinhaCash}" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:8px 10px 8px 30px;color:#fff;font-size:13px;box-sizing:border-box"/>
      </div>
      <div style="font-size:11px;color:var(--muted)">Vinculada ao Financeiro → Custos. Entra no Total Saídas para conferência.</div>
    </div>

    <!-- Summary cards -->
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <div style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Total Entradas</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;color:#fff">${fmtBRL(totalEntradas)}</div>
      </div>
      <div style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Total Saídas</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;color:#fff">${fmtBRL(totalSaidas)}</div>
        ${caixinhaCash>0?`<div style="font-size:10px;color:var(--muted);margin-top:2px">incl. caixinha ${fmtBRL(caixinhaCash)}</div>`:""}
      </div>
    </div>

    <!-- Validation indicator -->
    <div style="background:var(--surface2);border:1px solid ${balanced?"var(--green)":"var(--red)"};border-radius:6px;padding:10px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;color:var(--muted)">Conferência (Entradas vs Saídas)</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:${balanced?"var(--green)":"var(--red)"}">
        ${balanced?"✓ FECHADO":`⚠ DIFERENÇA: ${fmtBRL(Math.abs(totalEntradas-totalSaidas))}`}
      </div>
    </div>

    <div class="card" style="padding:0 12px">
      ${(cg.players||[]).length===0?'<div style="color:var(--muted);font-size:13px;padding:16px 0">Nenhum jogador no Cash Game ainda.</div>':playerRows}
    </div>
    ${addPanel}
  </div>`;
}

function renderClock(){
  const s = DB.stages.find(x=>x.id===CLOCK_STAGE_ID);
  if(!s) return `<div class="clock-screen"><div style="color:#fff">Etapa não encontrada.</div></div>`;

  // Antes do 1º snapshot do Firestore não mostramos nada (evita piscar "tempo cheio" para quem entra tarde)
  if(CLOCK_DOCS[s.id]===undefined || BLIND_TEMPLATE===undefined) return `<div class="clock-screen" id="clock-screen">
    <button id="clk-close" style="position:fixed;top:10px;right:10px;z-index:601;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px">✕</button>
    <div style="color:rgba(255,255,255,.6);font-family:'Barlow Condensed',sans-serif;font-size:22px;letter-spacing:3px;text-transform:uppercase">Conectando ao relógio…</div></div>`;

  const levels = getBlindLevels(s);
  const v      = clockView(s);   // nível e tempo calculados a partir do estado + hora do servidor
  const idx    = v.idx;
  const level  = v.level;
  const {mm,ss,rem,total} = clockRemaining(v);
  window._clkRendered = {idx, running:v.running, waiting:v.waiting}; // o tick re-renderiza quando isso muda
  const pct    = total>0 ? Math.max(0, Math.min(100, (rem/total)*100)) : 0;
  const nextLv = levels[idx+1];
  const isBreak= !!level.isBreak;
  const avgStack = calcAvgStack(s);
  const ins = s.inscriptions||[];
  const records = s.buyinData||[];
  const totalRS = records.reduce((sum,r)=>sum+(Number(r.rs)||0),0);
  const totalRD = records.reduce((sum,r)=>sum+(Number(r.rd)||0),0);
  const totalAddon = records.filter(r=>r.addon).length;
  const totalEntries = ins.length;
  const totalRebuys  = totalRS+totalRD;

  const fmtTime = (m,sc) => `${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;
  const blindLabel = isBreak ? "INTERVALO" : `${fmtChips(level.sb)} / ${fmtChips(level.bb)}${level.ante?` ANTE ${fmtChips(level.ante)}`:""}`;
  const nextLabel = nextLv ? (nextLv.isBreak ? "→ Intervalo" : `→ ${fmtChips(nextLv.sb)}/${fmtChips(nextLv.bb)}${nextLv.ante?" ante "+fmtChips(nextLv.ante):""}`) : "Último nível";
  const nonBreakIdx = levels.slice(0,idx+1).filter(l=>!l.isBreak).length;
  const nextBreak = levels.slice(idx+1).find(l=>l.isBreak);
  const levelsUntilBreak = nextBreak ? levels.slice(idx+1,levels.indexOf(nextBreak)).length+1 : null;

  // Admin controls
  const isAdmin = IS_ADMIN;
  const roundNum = idx+1 - levels.slice(0,idx+1).filter(l=>l.isBreak).length;
  // Break pré-programado para sozinho no início e espera o admin iniciar a contagem
  const roundLabel = isBreak ? (v.waiting ? "☕ BREAK · AGUARDANDO" : "☕ BREAK") : "ROUND "+roundNum;
  const playLabel  = v.waiting ? "▶ Iniciar Break" : "▶ Iniciar";

  // Blinds na tela larga: sb/bb grandes e o ante numa linha própria, menor
  const blindMain = isBreak ? "INTERVALO" : `${fmtChips(level.sb)} / ${fmtChips(level.bb)}`;
  const anteLine  = (!isBreak && level.ante) ? `<div class="clk-land-ante">ANTE ${fmtChips(level.ante)}</div>` : "";

  // Premiação na parte de baixo da tela, depois do 1º intervalo (posições que têm valor na aba Premiação)
  const firstBreak = levels.findIndex(l=>l.isBreak);
  let prizeList = [];
  if(firstBreak>=0 && idx>firstBreak){
    try{ prizeList = calcPremiacao(s).filter(p=>p.value>0); }catch(e){ prizeList = []; }
  }
  const prizeItem = (p) => `<div class="clk-prize ${p.position<=3?"top p"+p.position:"rest"}"><span class="clk-prize-pos">${p.position}º</span><span>${fmtBRL(p.value)}</span></div>`;
  const prizeTop  = prizeList.filter(p=>p.position<=3);
  const prizeRest = prizeList.filter(p=>p.position>3);
  const prizeFrag = prizeList.length ? `<div class="clk-prizes" id="clk-prizes">
      <div class="clk-prize-row">${prizeTop.map(prizeItem).join("")}</div>
      ${prizeRest.length?`<div class="clk-prize-row">${prizeRest.map(prizeItem).join("")}</div>`:""}
    </div>` : "";
  const prizeCls = prizeList.length ? " has-prizes"+(prizeRest.length?" prizes-2":"") : "";

  // ── Shared fragments ──────────────────────────────────────────────────────
  const logoHdr = (w) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    ${logoSvg(Math.round(w*0.62))}
    <div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(10px,2vw,16px);letter-spacing:2px;color:rgba(255,255,255,.8);text-transform:uppercase;line-height:1.1">${s.name}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:clamp(8px,1.4vw,11px);letter-spacing:3px;color:rgba(255,255,255,.3);text-transform:uppercase">${s.type==="knockout"?"PKO":"NL Hold'em"}</div>
    </div>
  </div>`;

  const levelFrag = `<div class="clock-level-label">${roundLabel}</div>`;
  const blindsFrag = `<div class="clock-blinds-label ${isBreak?"break-color":""}" style="margin-top:2px">${blindLabel}</div>`;

  const timerFrag = (id,landId) => `
    <div class="clock-timer ${isBreak?"break-color":""}" id="${id}" title="${isAdmin?"Clique para editar o tempo":""}" style="${isAdmin?"cursor:pointer":"cursor:default"}">${fmtTime(mm,ss)}</div>
    <div class="clock-bar"><div class="clock-bar-fill" id="${landId||id+"-bar"}" style="width:${pct}%"></div></div>`;

  const nextFrag = `<div class="clock-next-label" style="margin-top:6px">${nextLabel}</div>
  ${levelsUntilBreak ? `<div class="clock-break-label" style="margin-top:4px">☕ Break em ${levelsUntilBreak} ${levelsUntilBreak!==1?"níveis":"nível"}</div>` : ""}`;

  const statFrag = (sz) => `<div style="display:flex;gap:clamp(10px,3vw,32px);flex-wrap:wrap${sz!=="lg"?";justify-content:center":""}">
    <div style="text-align:center"><div class="clock-stat-v" style="font-size:clamp(16px,${sz==="lg"?"4vw":"5vw"},${sz==="lg"?"30px":"34px"})">${totalEntries}</div><div class="clock-stat-l">Entradas</div></div>
    <div style="text-align:center"><div class="clock-stat-v" style="font-size:clamp(16px,${sz==="lg"?"4vw":"5vw"},${sz==="lg"?"30px":"34px"})">${totalRebuys}</div><div class="clock-stat-l">Rebuys</div></div>
    <div style="text-align:center"><div class="clock-stat-v" style="font-size:clamp(16px,${sz==="lg"?"4vw":"5vw"},${sz==="lg"?"30px":"34px"})">${totalAddon}</div><div class="clock-stat-l">Add-ons</div></div>
    ${avgStack>0?`<div style="text-align:center"><div class="clock-stat-v" style="font-size:clamp(16px,${sz==="lg"?"4vw":"5vw"},${sz==="lg"?"30px":"34px"})">${fmtChips(avgStack)}</div><div class="clock-stat-l">Avg Stack</div></div>`:""}
  </div>`;

  // ── Admin controls ────────────────────────────────────────────────────────
  const adminBar = isAdmin ? `
    <div style="display:flex;gap:7px;margin-top:14px;flex-wrap:wrap;justify-content:center">
      ${v.running
        ? `<button data-clk="pause" class="clk-btn" style="background:rgba(231,76,60,.18);border-color:#e74c3c;color:#e74c3c">⏸ Pausar</button>`
        : `<button data-clk="play"  class="clk-btn" style="background:rgba(46,204,113,.18);border-color:#2ecc71;color:#2ecc71;font-size:15px;padding:8px 22px">${playLabel}</button>`}
      <button data-clk="prev"  class="clk-btn" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff">◀</button>
      <button data-clk="next"  class="clk-btn" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff">▶</button>
      <button data-clk="reset" class="clk-btn" style="background:rgba(255,120,0,.12);border-color:rgba(255,120,0,.4);color:#FF7800">↺ Reset</button>
      <button data-clk="edit"  class="clk-btn" style="background:rgba(245,168,0,.1);border-color:rgba(245,168,0,.35);color:#F5A800">⚙</button>
    </div>` : "";

  // ── Fullscreen + close buttons ────────────────────────────────────────────
  const topBtns = `
    <div style="position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:601">
      <button id="clk-fullscreen" title="Tela cheia" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center">${clockFsActive()?"⛶✕":"⛶"}</button>
      <button id="clk-close"      style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center">✕</button>
    </div>`;

  return `<div class="clock-screen${prizeCls}" id="clock-screen">
    ${topBtns}
    ${prizeFrag}

    <!-- ═══ PORTRAIT ═══ -->
    <div class="clk-portrait">
      ${logoHdr(32)}
      ${levelFrag}
      ${blindsFrag}
      <div class="clock-timer ${isBreak?"break-color":""}" id="clk-display" title="${isAdmin?"Clique para editar o tempo":""}">${fmtTime(mm,ss)}</div>
      <div class="clock-bar"><div class="clock-bar-fill" id="clk-bar" style="width:${pct}%"></div></div>
      <div style="margin-top:6px">${nextFrag}</div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);width:100%">${statFrag("sm")}</div>
      ${adminBar}
    </div>

    <!-- ═══ LANDSCAPE (3 cols: info | round+timer+btns | next+break) ═══ -->
    <div class="clk-landscape">

      <!-- LEFT: logo + stats only -->
      <div class="clk-land-left">
        ${logoHdr(32)}
        ${statFrag("lg")}
      </div>

      <!-- CENTRE: round+blinds ABOVE timer, admin buttons BELOW -->
      <div class="clk-land-center" style="padding:12px 0">
        <!-- Round + blinds ABOVE -->
        <div style="text-align:center;margin-bottom:4px">
          <div class="clock-level-label clk-land-round">${roundLabel}</div>
          <div class="clock-blinds-label clk-land-blinds ${isBreak?"break-color":""}">${blindMain}</div>
          ${anteLine}
        </div>

        <!-- Big timer -->
        <div class="clock-timer clk-land-timer ${isBreak?"break-color":""}" id="clk-display-land"
          title="${IS_ADMIN?"Clique para editar o tempo":""}">${fmtTime(mm,ss)}</div>
        <div class="clock-bar" style="max-width:min(640px,90%);margin-top:8px">
          <div class="clock-bar-fill" id="clk-bar-land" style="width:${pct}%"></div>
        </div>

        <!-- Admin buttons BELOW timer -->
        ${IS_ADMIN ? `<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center">
          ${v.running
            ? `<button data-clk="pause" class="clk-btn" style="background:rgba(231,76,60,.18);border-color:#e74c3c;color:#e74c3c">⏸ Pausar</button>`
            : `<button data-clk="play"  class="clk-btn" style="background:rgba(46,204,113,.18);border-color:#2ecc71;color:#2ecc71;padding:8px 20px">${playLabel}</button>`}
          <button data-clk="prev"  class="clk-btn" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff">◀</button>
          <button data-clk="next"  class="clk-btn" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff">▶</button>
          <button data-clk="reset" class="clk-btn" style="background:rgba(255,120,0,.12);border-color:rgba(255,120,0,.4);color:#FF7800">↺</button>
          <button data-clk="edit"  class="clk-btn" style="background:rgba(245,168,0,.1);border-color:rgba(245,168,0,.35);color:#F5A800">⚙</button>
        </div>` : ""}
      </div>

      <!-- RIGHT: next blind + break info -->
      <div class="clk-land-right">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:clamp(9px,1.6vw,14px);letter-spacing:2.5px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:8px">Próximo Nível</div>
          <div class="clock-next-label" style="font-size:clamp(16px,2.6vw,34px);line-height:1.2">${nextLabel}</div>
        </div>
        ${levelsUntilBreak ? `
        <div style="border-top:1px solid rgba(255,255,255,.08);padding-top:16px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:clamp(9px,1.6vw,14px);letter-spacing:2.5px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:8px">Break em</div>
          <div class="clock-break-label" style="font-size:clamp(26px,4.4vw,60px);line-height:1">${levelsUntilBreak} ${levelsUntilBreak!==1?"níveis":"nível"}</div>
        </div>` : ""}
      </div>

    </div>
  </div>`;
}


// Rascunho da estrutura enquanto o editor está aberto. Mexer na ordem/valores NÃO altera o relógio
// em andamento nem grava nada: só o botão Salvar aplica (e o Cancelar descarta).
let BLV_DRAFT = null; let BLV_ONCE = new WeakSet(); let BLV_ADDED = new WeakSet(); let BLV_ORIG = null, BLV_ORIG_IDX = null;   // ONCE = inseridos só nesta etapa · ADDED = inseridos nesta edição · ORIG = estrutura de quando o editor abriu
const BLV_COLS = "22px 1fr 1fr 1fr 58px 26px 28px";

function renderBlindEditor(s){
  const levels = BLV_DRAFT || getBlindLevels(s);
  const fmtDur = d => `${Math.round((d||900)/60)}min`;
  const mvBtn = "background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:3px;width:26px;height:17px;padding:0;cursor:pointer;font-size:9px;line-height:1";

  const rows = levels.map((lv,i)=>`
    <div data-blv-row="${i}" style="display:grid;grid-template-columns:${BLV_COLS};gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:11px;color:var(--muted);text-align:center">
        <input type="checkbox" class="blv-chk" data-blv="${i}" style="cursor:pointer;accent-color:var(--yellow)" title="Marcar (duração em massa / inserir abaixo)"/>
      </div>
      ${lv.isBreak
        ? `<div colspan="3" style="grid-column:2/5;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--yellow)">☕ BREAK</div>`
        : `<input data-blv-sb="${i}" type="number" value="${lv.sb}" placeholder="SB" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:5px 7px;color:#fff;font-size:12px;width:100%;box-sizing:border-box"/>
           <input data-blv-bb="${i}" type="number" value="${lv.bb}" placeholder="BB" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:5px 7px;color:#fff;font-size:12px;width:100%;box-sizing:border-box"/>
           <input data-blv-ante="${i}" type="number" value="${lv.ante||0}" placeholder="Ante" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:5px 7px;color:#fff;font-size:12px;width:100%;box-sizing:border-box"/>`}
      <input data-blv-dur="${i}" type="number" value="${Math.round((lv.dur||900)/60)}" placeholder="min" style="background:var(--surface2);border:1px solid ${lv.isBreak?"var(--yellow)":"var(--border)"};border-radius:4px;padding:5px 7px;color:#fff;font-size:12px;width:100%;box-sizing:border-box" title="Duração em minutos"/>
      <div style="display:flex;flex-direction:column;gap:2px">
        <button data-blv-up="${i}" ${i===0?"disabled":""} title="Subir" style="${mvBtn}${i===0?";opacity:.25;cursor:default":""}">▲</button>
        <button data-blv-down="${i}" ${i===levels.length-1?"disabled":""} title="Descer" style="${mvBtn}${i===levels.length-1?";opacity:.25;cursor:default":""}">▼</button>
      </div>
      <button data-blv-del="${i}" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:12px">✕</button>
    </div>`).join("");

  return `
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;color:#fff;margin-bottom:4px">⚙ Estrutura de Blinds</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${s.name}</div>
    <div style="display:grid;grid-template-columns:${BLV_COLS};gap:6px;margin-bottom:6px">

function renderFTPrize(){
  const finishedStages = DB.stages
    .filter(s=>s.status==="finished" && !s.isFinal && ((s.season||DATA_SEASON)===ACTIVE_SEASON))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""));

  const totalFT = finishedStages.reduce((sum,s)=>sum+getFTContribution(s),0);

  // Each stage contributes to ONE of NLH or PKO (based on type), plus Ranking and FT.
  // Taxa FT ÷ 3 → split equally between: [NLH or PKO], Ranking Geral, Mesa Final.
  let poteNHL = 0, potePKO = 0, poteRanking = 0, poteMesaFinal = 0;
  finishedStages.forEach(s=>{
    const contrib = getFTContribution(s);
    const each = contrib / 3;
    if(s.type==="nlholdem") poteNHL += each;
    else potePKO += each;
    poteRanking   += each;
    poteMesaFinal += each;
  });

  const potCard = (label, emoji, value, dimmed=false) => `
    <div style="background:var(--surface2);border:1px solid ${dimmed?"var(--border)":"var(--border)"};border-radius:6px;padding:10px 12px;text-align:center;opacity:${dimmed?0.45:1}">
      <div style="font-size:16px;margin-bottom:4px">${emoji}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">${label}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;color:${dimmed?"var(--muted)":"var(--yellow)"}">${value>0?fmtBRL(value):"R$ 0"}</div>
    </div>`;

  const stageRows = finishedStages.map(s=>{
    const contrib = getFTContribution(s);
    const isOverridden = s.ftContribution !== undefined && s.ftContribution !== null;
    const auto = calcTaxaFT(s);
    const each = contrib / 3;
    const isNLH = s.type==="nlholdem";
    return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;color:#fff">${s.name}</div>
          <div style="font-size:11px;color:var(--muted)">${fmtD(s.date)} · ${isNLH?"NL Hold'em":"PKO"}</div>
          ${isOverridden?`<div style="font-size:10px;color:var(--yellow);margin-top:2px">✏️ Valor editado (auto: ${fmtBRL(auto)})</div>`:""}
        </div>
        ${IS_ADMIN?`
        <div style="position:relative;width:110px;flex-shrink:0">
          <span style="position:absolute;left:8px;top:8px;color:var(--muted);font-size:12px;pointer-events:none">R$</span>
          <input data-ft-stage="${s.id}" type="number" inputmode="decimal" value="${contrib.toFixed(2)}" style="width:100%;background:var(--surface2);border:1px solid ${isOverridden?"var(--yellow)":"var(--border)"};border-radius:4px;padding:7px 8px 7px 28px;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box;text-align:right"/>
        </div>`:`<div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:var(--yellow);flex-shrink:0">${fmtBRL(contrib)}</div>`}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        <div style="background:var(--bg-dark);border-radius:4px;padding:5px 6px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">${isNLH?"NLH":"PKO"}</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#fff">${fmtBRL(each)}</div>
        </div>
        <div style="background:var(--bg-dark);border-radius:4px;padding:5px 6px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Ranking</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#fff">${fmtBRL(each)}</div>
        </div>
        <div style="background:var(--bg-dark);border-radius:4px;padding:5px 6px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">FT</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#fff">${fmtBRL(each)}</div>
        </div>
      </div>
    </div>`;
  }).join("");

  return `<div class="sec">
    <button id="btn-ft-prize-back" class="btn bo mb10" style="font-size:12px">‹ Voltar</button>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;margin-bottom:4px">🏆 Premiação Final de Temporada</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Temporada ${ACTIVE_SEASON} — acumulado por etapa</div>

    <!-- Total acumulado -->
    <div style="background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,215,0,0.04));border:2px solid #FFD700;border-radius:8px;padding:16px 20px;margin-bottom:14px;text-align:center">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px">Total Acumulado</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:36px;color:#FFD700">${fmtBRL(totalFT)}</div>
    </div>

    <!-- 4 pot breakdown cards (2x2 grid) -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      ${potCard("Pote NLH","🃏",poteNHL)}
      ${potCard("Pote PKO","🥊",potePKO)}
      ${potCard("Pote Ranking","🏅",poteRanking)}
      ${potCard("Pote Mesa Final","🏆",poteMesaFinal)}
    </div>

    <!-- Per-stage list -->
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Por etapa</div>
    <div class="card" style="padding:0 12px">
      ${finishedStages.length===0?'<div style="color:var(--muted);font-size:13px;padding:16px 0">Nenhuma etapa finalizada ainda.</div>':stageRows}
    </div>
    ${IS_ADMIN?`<div style="font-size:11px;color:var(--muted);margin-top:10px">✏️ Admins podem editar o valor total de cada etapa — os 4 potes se atualizam automaticamente (Taxa FT ÷ 4). A edição não afeta os cálculos do Financeiro da etapa.</div>`:""}
  </div>`;
}

const esc = v => String(v==null?"":v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderV2Panel(){

window.v2Ui = async function(act){
  const log = m=>{ V2_LOG += m+"\n"; render(); };
  try{
    if(act==="backup"){
      const snap = await getDoc(doc(db,"seasons",DATA_SEASON)); if(!snap.exists()) throw new Error("documento da temporada não encontrado");
      const d = snap.data();
      const extra = SCHEMA_V2 ? await srvRead() : null;
      const out = {geradoEm:new Date().toISOString(), temporada:DATA_SEASON, estrutura:SCHEMA_V2?"v2":"antiga", documentoDaTemporada:d, ...(extra?{estruturaNova:extra}:{})};
      const txt = JSON.stringify(out,(k,v)=> (v && typeof v==="object" && typeof v.toDate==="function") ? v.toDate().toISOString() : v, 1);
      const blob = new Blob([txt],{type:"application/json"}), url = URL.createObjectURL(blob), a = document.createElement("a");
      const pad=n=>String(n).padStart(2,"0"), t=new Date(); a.href=url; a.download=`backup-ppp-poker-${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
      V2_LOG = `Backup baixado: ${(d.players||[]).length} jogadores, ${(d.stages||[]).length} etapas, ${Math.round(txt.length/1024)} KB.\nGuarde o arquivo fora do celular (e-mail para você mesmo, Drive).`; render(); return;
    }
    if(act==="verify"){ await sendEmailVerification(CURRENT_USER); V2_PERM="E-mail de verificação enviado para "+CURRENT_USER.email+". Se não achar, olhe o spam."; render(); openVerifySentModal(CURRENT_USER.email); return; }
    if(act==="verified"){ await CURRENT_USER.reload(); await CURRENT_USER.getIdToken(true); V2_PERM = CURRENT_USER.emailVerified ? "✓ E-mail verificado. Toque em “Testar permissões” para confirmar." : "Ainda não consta como verificado. Clique no link do e-mail e tente de novo."; render(); return; }
    if(act==="perm"){ V2_PERM="Testando…"; render(); const out=[]; const t=async(nome,fn)=>{ try{ await fn(); out.push("✓ "+nome); }catch(e){ out.push("✗ "+nome+" → "+(e.code||"")+" "+e.message); } };
      let tok=""; try{ const r=await CURRENT_USER.getIdTokenResult(true); tok="token: email="+r.claims.email+" email_verified="+r.claims.email_verified+" provedor="+(r.signInProvider||""); }catch(e){ tok="token: "+e.message; } out.push(tok);
      await t("ler documento da temporada", ()=>getDoc(doc(db,"seasons",DATA_SEASON)));
      await t("gravar no documento da temporada (só updatedAt)", ()=>updateDoc(doc(db,"seasons",DATA_SEASON),{updatedAt:serverTimestamp()}));
      await t("transação no documento da temporada", ()=>runTransaction(db, async tx=>{ const sn=await tx.get(doc(db,"seasons",DATA_SEASON)); tx.update(doc(db,"seasons",DATA_SEASON),{updatedAt:serverTimestamp()}); }));
      await t("ler config/schema", ()=>getDoc(doc(db,"config","schema")));
      await t("ler jogadores (estrutura nova)", ()=>getDocs(collection(db,"players")));
      V2_PERM=out.join("\n"); render(); return; }
    if(act==="migrate"){ V2_LOG=""; await v2Migrate(log); }
    else if(act==="activate"){ if(!V2.verified) return; if(!confirm("Virar para a estrutura nova? Os usuários passam a ler e gravar nela. Dá para voltar pelo mesmo painel.")) return; await v2Activate(); V2_LOG="Virada feita. O app recarrega sozinho."; }
    else if(act==="rollback"){ if(!confirm("Voltar ao modelo antigo? O estado atual é copiado de volta para o documento da temporada.")) return; V2_LOG=""; await v2Rollback(log); }
    else if(act.startsWith("approve:")){ const c=V2.claims.find(x=>x.uid===act.slice(8)); if(c && await v2ApproveClaim(c)) showToast("Vínculo aprovado","green"); }
    else if(act.startsWith("reject:")){ await deleteDoc(v2ClaimRef(act.slice(7))); }
  }catch(e){ V2_LOG += "Erro: "+e.message+"\n"; }
  render();
};

async function runFixDupes(){
  const data = await srvRead();
  let players = [...(data.players||[])];
  const stages = data.stages||[];
  const admins = data.admins||[];
  const before = players.length;
  const seen=new Map();
  const cleaned=[];
  players.forEach(p=>{
    if(!seen.has(p.uid)){
      seen.set(p.uid,cleaned.length);
      cleaned.push({...p});
    } else {
      const idx=seen.get(p.uid);
      const existing=cleaned[idx];
      const pIsUser = p.email && p.nickname && p.nickname!==p.name.split(" ")[0];
      const eIsUser = existing.email && existing.nickname && existing.nickname!==existing.name.split(" ")[0];
      if(pIsUser && !eIsUser){ cleaned[idx]={...p}; toolsLog(`🔄 Preferindo: "${p.name}"`, "ok"); }
      else { toolsLog(`🗑️ Removido: "${p.name}"`, "warn"); }
    }
  });
  await srvWriteFull({players:cleaned,stages,admins});
  DB.players=cleaned;
  toolsLog(`✅ ${before} → ${cleaned.length} jogadores (${before-cleaned.length} removidos)`, "ok");
}

        <select class="inp" id="sf-t">
          <option value="nlholdem"${f.type==="nlholdem"?" selected":""}>🃏 NL Hold'em</option>
          <option value="knockout"${f.type==="knockout"?" selected":""}>🥊 Progressive Knockout (PKO)</option>
        </select>
      </div>
      <div class="sep"></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Regras do Torneio</div>
      ${stFields("sf", st0, f.type, ko0)}
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:14px">
        <input type="checkbox" id="sf-f"${f.isFinal?" checked":""} style="width:16px;height:16px;accent-color:var(--yellow)"/>
        <label for="sf-f" style="color:var(--text);font-size:14px;cursor:pointer">🏆 É uma Mesa Final?</label>
      </div>
      <div class="row g8">
        <button class="btn by fw" id="save-stage">Salvar</button>
        <button class="btn bo" id="cancel-stage">Cancelar</button>
      </div>
    </div>
  </div>`;
  const getType = () => document.getElementById("sf-t").value;
  stWire("sf", getType);
  // Ao trocar o formato, carrega os valores padrão dele, a menos que os campos já tenham sido personalizados
  document.getElementById("sf-t").addEventListener("change",function(){
    const t=this.value, prev=t==="nlholdem"?"knockout":"nlholdem";
    const cur = JSON.stringify(stRead("sf").st), isDef = ty => cur===JSON.stringify(textToStruct(DEFAULT_RULES[ty]));
    if(isDef(prev) || isDef(t)) stSet("sf", textToStruct(DEFAULT_RULES[t]), stKoDefaults());
    stRefresh("sf", t);
  });
  document.getElementById("sm-ov").addEventListener("click",e=>{if(e.target===document.getElementById("sm-ov"))closeAdminModal();});
  document.getElementById("cancel-stage").addEventListener("click",closeAdminModal);
  document.getElementById("save-stage").addEventListener("click",()=>{
    const name=document.getElementById("sf-n").value.trim();
    const date=document.getElementById("sf-d").value;
    if(!name||!date)return;
    const type=getType(), {st,ko}=stRead("sf");
    const err=structValidate(st,type,ko);
    if(err){ showToast(err,"red"); return; }
    const txt=structToText(st,type,ko.per);
    const data={
      name,date,
      time:document.getElementById("sf-h").value,
      location:document.getElementById("sf-l").value.trim(),
      address:document.getElementById("sf-a").value.trim(),
      type,
      isFinal:document.getElementById("sf-f").checked,
      buyin:txt.buyin, rebuy:txt.rebuy, addon:txt.addon, timechip:txt.timechip,
      season:ACTIVE_SEASON
    };
    // Só mexe no financeiro quando preciso: etapa sem dados financeiros e com o KO padrão continua sem eles (o app já usa esse padrão), então nada é "congelado" sem querer
    const applyKO = s => { if(type!=="knockout") return s; if(!s.finance && ko.value===DEFAULT_KO_VALUE && ko.per===DEFAULT_KO_PER_ENTRY) return s; const fin=getFinanceData(s); fin.koValue=ko.value; fin.koPer=ko.per; return s; };
    if(stage){ DB.stages=DB.stages.map(s=>s.id===stage.id?applyKO({...s,...data}):s); }
    else { DB.stages=[...DB.stages,applyKO({id:mkId(),...data,status:"upcoming",inscriptions:[],results:[]})].sort((a,b)=>a.date.localeCompare(b.date)); }
    save(); closeAdminModal(); render();
  });
}

// ── RESULT MODAL ──────────────────────────────────────────────────────────────
let autoSaveTimer = null;

function openResultModal(sid){
  var stage=DB.stages.find(function(s){return s.id===sid;});
  if(!stage)return;
  resultStage=stage;
  var draft=stage.draft||[];
  var results=stage.results||[];
  var base=(stage.inscriptions||[]).map(function(uid){
    var dr=draft.find(function(r){return r.uid===uid;});
    var ex=results.find(function(r){return r.playerId===uid;});
    if(dr) return {uid:uid, pos:dr.pos||"", ko:dr.ko||"0"};
    if(ex) return {uid:uid, pos:String(ex.position), ko:String(ex.knockouts||0)};
    return {uid:uid, pos:"", ko:"0"};
  });
  results.forEach(function(r){
    if(!base.find(function(x){return x.uid===r.playerId;}))
      base.push({uid:r.playerId, pos:String(r.position), ko:String(r.knockouts||0)});
  });
  resultRows=base;
  drawResultModal();
}

function autoSaveDraft(){
  if(!resultStage)return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(function(){
    DB.stages=DB.stages.map(function(s){
      if(s.id!==resultStage.id)return s;
      return Object.assign({},s,{draft:resultRows.map(function(r){return {uid:r.uid,pos:r.pos,ko:r.ko};})});
    });
    save();
    var ind=document.getElementById("autosave-ind");
    if(ind){ind.textContent="✓ Salvo";ind.style.color="var(--green)";}
    setTimeout(function(){var ind=document.getElementById("autosave-ind");if(ind)ind.textContent="";},2000);
  },800);
}

function drawResultModal(){
  var s=resultStage;
  var isKO=s.type==="knockout";
  var hasPublished=s.status==="finished";
  var maxPos=Math.max(resultRows.length,2);

  function takenBy(exceptUid){
    return resultRows.filter(function(r){return r.uid!==exceptUid&&r.pos&&parseInt(r.pos)>0;}).map(function(r){return parseInt(r.pos);});
  }
  function sortedRows(){
    return resultRows.slice().sort(function(a,b){
      var pa=parseInt(a.pos)>0?parseInt(a.pos):9999;
      var pb=parseInt(b.pos)>0?parseInt(b.pos):9999;
      return pa-pb;
    });
  }
  var notIn=DB.players.filter(function(p){return !resultRows.find(function(r){return r.uid===p.uid;});});
  var wrap=document.getElementById("result-modal");
  wrap.innerHTML="";
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;";
  wrap.appendChild(ov);
  var box=document.createElement("div");
  box.style.cssText="background:var(--surface);border-top:3px solid var(--yellow);border:1px solid var(--border);border-radius:4px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-sizing:border-box;";
  ["click","mousedown","touchstart"].forEach(function(ev){box.addEventListener(ev,function(e){e.stopPropagation();},{passive:true});});
  ov.appendChild(box);
  var tRow=document.createElement("div");
  tRow.style.cssText="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px";
  tRow.innerHTML="<b style=\"font-family:'Barlow Condensed',sans-serif;font-size:20px;color:#fff;text-transform:uppercase;letter-spacing:1px\">Resultado \u2014 "+s.name+"</b><span id='autosave-ind' style='font-size:11px;color:var(--muted)'></span>";
  box.appendChild(tRow);
  var bn=document.createElement("div");
  bn.style.cssText="font-size:12px;padding:8px 12px;border-radius:3px;margin-bottom:12px;border:1px solid;"+(hasPublished?"background:rgba(46,204,113,.1);color:var(--green);border-color:rgba(46,204,113,.3);":"background:rgba(245,168,0,.08);color:var(--yellow);border-color:rgba(245,168,0,.2);");
  bn.textContent=hasPublished?"\u2713 Resultado publicado":"\uD83D\uDD8A Rascunho \u2014 preencha e publique ao final";
  box.appendChild(bn);
  var hdr=document.createElement("div");
  hdr.style.cssText="display:grid;grid-template-columns:1fr 110px"+(isKO?" 80px":"")+";gap:8px;padding:0 4px;margin-bottom:6px;";
  hdr.innerHTML="<div class='lbl' style='margin:0'>Jogador</div><div class='lbl' style='margin:0;text-align:center'>Posi\u00e7\u00e3o</div>"+(isKO?"<div class='lbl' style='margin:0;text-align:center'>KOs</div>":"");
  box.appendChild(hdr);
  var listEl=document.createElement("div");
  box.appendChild(listEl);

  function rebuildList(){
    listEl.innerHTML="";
    sortedRows().forEach(function(row){
      var pl=getP(row.uid)||{name:"?",nickname:"?"};
      var curPos=parseInt(row.pos)>0?parseInt(row.pos):0;
      var pts=curPos?getPts(curPos):0;
      var rd=document.createElement("div");
      rd.style.cssText="display:grid;grid-template-columns:1fr 110px"+(isKO?" 80px":"")+";gap:8px;margin-bottom:8px;align-items:center;padding:10px 10px;border-radius:4px;border:2px solid "+(curPos?"var(--yellow)":"var(--border)")+";background:"+(curPos?"var(--surface2)":"var(--surface)")+";";
      var info=document.createElement("div");
      info.style.cssText="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden";
      info.innerHTML="<div class='av' style='width:32px;height:32px;font-size:10px;flex-shrink:0'>"+ini(pl.name)+"</div><div style='min-width:0'><div style='font-size:14px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+pl.nickname+"</div><div style='font-size:11px;font-weight:700;font-family:Barlow Condensed,sans-serif;color:"+(curPos?"var(--yellow)":"var(--muted)")+"'>"+(curPos?curPos+"\u00ba \u00b7 "+pts+" pts":"sem posi\u00e7\u00e3o")+"</div></div>";
      rd.appendChild(info);
      var ps=document.createElement("select");
      ps.style.cssText="background:var(--surface2);border:2px solid "+(curPos?"var(--yellow)":"var(--border2)")+";border-radius:4px;color:#fff;padding:10px 2px;text-align:center;text-align-last:center;font-size:17px;font-family:Barlow Condensed,sans-serif;font-weight:900;width:100%;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;";
      var optsHtml="<option value=''>—</option>";
      for(var i=1;i<=maxPos;i++) optsHtml+="<option value='"+i+"'"+(curPos===i?" selected":"")+">"+i+"\u00ba</option>";
      ps.innerHTML=optsHtml;
      (function(rowRef,psEl,rdEl){
        psEl.addEventListener("change",function(){
          var newPos=parseInt(psEl.value)||0;
          var oldPos=parseInt(rowRef.pos)||0;
          if(newPos>0&&newPos!==oldPos){
            var shifted=[];
            function shiftDown(pos,skipUid){
              var occupant=resultRows.find(function(r){return r.uid!==skipUid&&parseInt(r.pos)===pos;});
              if(occupant&&shifted.indexOf(occupant.uid)<0){shifted.push(occupant.uid);shiftDown(pos+1,occupant.uid);occupant.pos=String(pos+1);}
            }
            shiftDown(newPos,rowRef.uid);
          }
          rowRef.pos=psEl.value;
          maxPos=Math.max(maxPos,resultRows.reduce(function(m,r){return Math.max(m,parseInt(r.pos)||0);},0));
          autoSaveDraft();
          rebuildList();
        });
      })(row,ps,rd);
      rd.appendChild(ps);
      if(isKO){
        var curKO=parseInt(row.ko)||0;
        var ks=document.createElement("input");
        ks.type="number";
        ks.inputMode="numeric";
        ks.pattern="[0-9]*";
        ks.min="0";
        ks.value=curKO;
        ks.placeholder="0";
        ks.style.cssText="background:var(--surface2);border:2px solid var(--border2);border-radius:4px;color:#fff;padding:10px 6px;text-align:center;font-size:15px;font-family:Barlow Condensed,sans-serif;font-weight:700;width:100%;outline:none;box-sizing:border-box;";
        ks.addEventListener("input",function(){var v=parseInt(ks.value);if(isNaN(v)||v<0){v=0;ks.value=0;}row.ko=v;autoSaveDraft();});
        ks.addEventListener("blur",function(){if(ks.value===""||isNaN(parseInt(ks.value))){ks.value=0;row.ko=0;autoSaveDraft();}});
        rd.appendChild(ks);
      }
      listEl.appendChild(rd);

// Export podium as image
window.exportPodium = async function(){
  const el = document.getElementById("podium-export");
  if(!el){ showToast("Pódio não encontrado","red"); return; }
  try {
    if(!window.html2canvas){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
    }
    showToast("Gerando imagem...","green");

    // Collect all external photo URLs from the podium element (img + background-image)
    const _urlToDataUri = (url) => new Promise(resolve => {
      if(!url || url.startsWith("data:")) return resolve(url);
      const ctrl = new AbortController();
      const t = setTimeout(() => { ctrl.abort(); resolve(null); }, 5000);
      fetch(url, {signal: ctrl.signal})
        .then(r => r.ok ? r.blob() : null)
        .then(blob => {
          clearTimeout(t);
          if(!blob) return resolve(null);
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        })
        .catch(() => { clearTimeout(t); resolve(null); });
    });

    // Clone the element so we can mutate without affecting the live DOM
    const clone = el.cloneNode(true);
    clone.style.position = "fixed";
    clone.style.left = "-9999px";
    clone.style.top = "0";
    clone.style.width = el.offsetWidth + "px";
    document.body.appendChild(clone);

    // Replace all <img src> with data URIs
    const cloneImgs = Array.from(clone.querySelectorAll("img"));
    await Promise.race([
      Promise.allSettled(cloneImgs.map(async img => {
        const src = img.src;
        if(!src || src.startsWith("data:")) return;
        const dataUri = await _urlToDataUri(src);
        if(dataUri) img.src = dataUri;
        else img.style.display = "none";
      })),
      new Promise(res => setTimeout(res, 8000))
    ]);

    // Replace all background-image: url(...) with data URIs
    const allEls = Array.from(clone.querySelectorAll("*"));
    await Promise.race([
      Promise.allSettled(allEls.map(async node => {
        const bg = node.style.backgroundImage || getComputedStyle(node).backgroundImage;
        const match = bg && bg.match(/url\(["']?([^"')]+)["']?\)/);
        if(!match) return;
        const url = match[1];
        if(!url || url.startsWith("data:")) return;
        const dataUri = await _urlToDataUri(url);
        if(dataUri) node.style.backgroundImage = "url('" + dataUri + "')";
        else node.style.backgroundImage = "none";
      })),
      new Promise(res => setTimeout(res, 8000))
    ]);

    if(window.__pppIcons) window.__pppIcons(clone);

    const canvas = await html2canvas(clone, {
      backgroundColor:"#1a1a1a",
      scale:2,
      allowTaint:false,
      useCORS:false,
      logging:false
    });

    document.body.removeChild(clone);
    const link = document.createElement("a");
    link.download = "podium-ppp-poker.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("Imagem salva!","green");
  } catch(e){
    showToast("Erro ao exportar: "+e.message,"red");
  }
};

      clockWakeLock();                   // tela não apaga durante o jogo
      clockAudio();                      // destrava o som (precisa do toque do usuário)

  // Close clock — release wake lock and stop listening
  document.getElementById("clk-close")?.addEventListener("click",()=>{

  // ── CLOCK HANDLERS ──────────────────────────────────────────────────────────
  // Grava SÓ a estrutura de blinds desta etapa, sobre a versão mais recente do documento (transação):
  // inscrições/resultados feitos por outras pessoas enquanto o editor estava aberto não são sobrescritos.
  async function saveClockState(s){
    try{
      const ref = doc(db,"seasons",DATA_SEASON);
      if(SCHEMA_V2){ await updateDoc(v2StageRef(s.id), {blindLevels: deepSanitize(s.blindLevels)}); return true; }
      await runTransaction(db, async (tx)=>{
        const snap = await tx.get(ref);
        const stages = snap.exists() ? (snap.data().stages||[]) : [];
        const i = stages.findIndex(x=>x.id===s.id);
        if(i<0) throw new Error("etapa não encontrada no servidor");
        stages[i] = {...stages[i], blindLevels: deepSanitize(s.blindLevels)};
        tx.update(ref,{stages: stages.map(deepSanitize), updatedAt: serverTimestamp()});
      });
      return true;
    } catch(e){ showToast("Erro ao salvar blinds: "+e.message,"red"); return false; }
  }

  // Generic double-confirmation modal for all clock actions
  function clkConfirm(title, msg, onConfirm){
    const el = document.getElementById("admin-modal"); if(!el) return;
    el.innerHTML = `
    <div class="ov" style="z-index:1300">
      <div class="modal" style="max-width:320px;text-align:center;padding:26px 20px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;margin-bottom:6px">${title}</div>

        <button id="clk-cf-no"  class="btn bo fw" style="font-size:14px;padding:12px">Cancelar</button>
      </div>
    </div>`;
    document.getElementById("clk-cf-no").addEventListener("click", closeAdminModal);
    document.getElementById("clk-cf-yes").addEventListener("click", ()=>{ closeAdminModal(); onConfirm(); });
  }

  // (Sons do relógio: playWarnBeep / playLevelUpBeep, definidos junto do bloco do clock.)

  // Bind all clock buttons — using data-clk attribute so both portrait+landscape
  // buttons are handled (querySelectorAll finds all, not just the first like getElementById)
  function bindClkBtn(action, handler){
    document.querySelectorAll(`[data-clk="${action}"]`).forEach(el=>{
      el.addEventListener("click", handler);
    });
  }

  bindClkBtn("play", ()=>{
    const s0=DB.stages.find(x=>x.id===CLOCK_STAGE_ID);
    const wait = !!(s0 && clockView(s0).waiting);
    clkConfirm(wait?"▶ Iniciar Break":"▶ Iniciar Relógio",
      wait?"A contagem do break começará agora para todos os aparelhos.":"O contador começará agora para todos os aparelhos.",
      ()=> clockAct({type:"start"}));
  });

  bindClkBtn("pause", ()=>{
    clkConfirm("⏸ Pausar Relógio", "O contador será pausado para todos os aparelhos.", ()=> clockAct({type:"pause"}));
  });

  bindClkBtn("prev", ()=>{
    const s=DB.stages.find(x=>x.id===CLOCK_STAGE_ID); if(!s) return;
    const levels=getBlindLevels(s);
    const lv=levels[Math.max(0,clockView(s).idx-1)];
    const label=lv?.isBreak?"Break":"o nível anterior";
    clkConfirm("◀ Nível Anterior", `Voltar para ${label}?`, ()=> clockAct({type:"prev"}));
  });

  bindClkBtn("next", ()=>{
    const s=DB.stages.find(x=>x.id===CLOCK_STAGE_ID); if(!s) return;

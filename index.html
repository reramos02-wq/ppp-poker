function cleanName(s, max){
  return String(s||"").replace(/[\u0000-\u001f\u007f|]/g," ").replace(/\s+/g," ").trim().slice(0, max||60);
}
// Troca um uid por outro em TUDO que a etapa guarda (inscrições, resultados, buy-ins, cash game, rascunhos…),
// tanto em valores quanto em chaves de objetos. Devolve novo objeto; não altera o original.
function remapUidDeep(v, oldUid, newUid){
  if(v === oldUid) return newUid;
  if(Array.isArray(v)) return v.map(x=>remapUidDeep(x, oldUid, newUid));
  if(v && typeof v === "object" && !(v instanceof Date)){
    const o = {};
    for(const k of Object.keys(v)) o[k===oldUid ? newUid : k] = remapUidDeep(v[k], oldUid, newUid);
    return o;
  }
  return v;
}

      const merged = existingPlayers.map(p=>{

        // Merge fcmTokens: union of Firestore tokens + local tokens, deduplicated.
        // This preserves tokens from other devices (e.g. phone + tablet) instead

        const remoteToks = p.fcmTokens||[];
        const localToks  = myPlayer.fcmTokens||[];
        const mergedToks = [...new Set([...remoteToks, ...localToks])];
        return {...p, ...myPlayer, fcmTokens: mergedToks};
      });
      if(!merged.find(p=>p.uid===myUid)) merged.push(myPlayer);
      await seasonUpdate({
        players: sanitizePlayers(merged),
        updatedAt: serverTimestamp()
      });
      // Update local DB to stay in sync
      DB.players = merged;
      setBaseline(DB.players, DB.stages, DB.admins);
    }
    return true;
  } catch(e){
    console.error("savePlayers error:", e);
    return false;
  }

// ── CALCULATIONS ──────────────────────────────────────────────────────────────
// ── TIEBREAKER ────────────────────────────────────────────────────────────────
// In case of equal points: most 1st places → most 2nd places → ... → most Nth places
function buildPositionCounts(uid, stageFilter){
  const counts = {}; // position → count
  DB.stages.filter(stageFilter).forEach(s=>{
    const r = (s.results||[]).find(x=>x.playerId===uid);
    if(r) counts[r.position] = (counts[r.position]||0) + 1;
  });
  return counts;
}

function tiebreak(a, b, stageFilter){
  // 1) Compare position by position: 1st, 2nd, 3rd, ... (up to 100)
  const ca = buildPositionCounts(a.p.uid, stageFilter);
  const cb = buildPositionCounts(b.p.uid, stageFilter);
  const maxPos = 100;
  for(let pos=1; pos<=maxPos; pos++){
    const diff = (cb[pos]||0) - (ca[pos]||0);
    if(diff !== 0) return diff;
  }
  // 2) Final fallback: best single finish (lowest position number wins)
  const bestA = Math.min(...Object.keys(ca).map(Number));
  const bestB = Math.min(...Object.keys(cb).map(Number));
  if(isFinite(bestA) && isFinite(bestB) && bestA !== bestB) return bestA - bestB;
  return 0;
}

function calcRank(type){
  const fin = DB.stages.filter(s=>
    s.status==="finished" && s.type===type && !s.isFinal &&
    ((s.season||DATA_SEASON)===ACTIVE_SEASON)
  );
  const sc = {};
  // Seed with all known players
  DB.players.forEach(p=>{ sc[p.uid]={p,total:0,stages:0,ko:0}; });
  // Also seed from results (catches any UIDs not yet in players list)
  fin.forEach(s=>(s.results||[]).forEach(r=>{
    if(!sc[r.playerId]){
      const p = getPlayer(r.playerId) || {uid:r.playerId, name:r.playerId, nickname:"?"};
      sc[r.playerId] = {p, total:0, stages:0, ko:0};
    }
  }));
  fin.forEach(s=>(s.results||[]).forEach(r=>{
    if(!sc[r.playerId]) return;
    const pts = getPts(r.position);
    sc[r.playerId].total  += pts; // KOs are stats only, not added to ranking points
    sc[r.playerId].stages++;
    sc[r.playerId].ko     += r.knockouts||0;
  }));
  const stageFilter = s =>
    s.status==="finished" && s.type===type && !s.isFinal &&
    ((s.season||DATA_SEASON)===ACTIVE_SEASON);
  return Object.values(sc).filter(s=>s.stages>0).sort((a,b)=>{
    if(b.total !== a.total) return b.total - a.total;
    return tiebreak(a, b, stageFilter);
  });
}

function calcRankGeral(){
  const sc = {};
  // Seed with all known players
  DB.players.forEach(p=>{ sc[p.uid]={p,total:0,stages:0,ko:0,nlPts:0,koPts:0}; });
  const finStages = DB.stages.filter(s=>
    s.status==="finished" && !s.isFinal &&
    ((s.season||DATA_SEASON)===ACTIVE_SEASON)
  );
  // Also seed from results (catches UIDs not in players list)
  finStages.forEach(s=>(s.results||[]).forEach(r=>{
    if(!sc[r.playerId]){
      const p = getPlayer(r.playerId) || {uid:r.playerId, name:r.playerId, nickname:"?"};
      sc[r.playerId] = {p, total:0, stages:0, ko:0, nlPts:0, koPts:0};
    }
  }));
  finStages.forEach(s=>{
    (s.results||[]).forEach(r=>{
      if(!sc[r.playerId]) return;
      const pts = getPts(r.position); // KOs are stats only, not added to points
      sc[r.playerId].total  += pts;
      sc[r.playerId].stages++;
      sc[r.playerId].ko     += r.knockouts||0;
      if(s.type==="nlholdem") sc[r.playerId].nlPts += pts;
      else                    sc[r.playerId].koPts += pts;
    });
  });
  const stageFilterGeral = s =>
    s.status==="finished" && !s.isFinal &&
    ((s.season||DATA_SEASON)===ACTIVE_SEASON);
  return Object.values(sc).filter(s=>s.stages>0).sort((a,b)=>{
    if(b.total !== a.total) return b.total - a.total;
    return tiebreak(a, b, stageFilterGeral);
  });
}

// ── FINANCIAL RANKING ─────────────────────────────────────────────────────────
// Builds per-player financial summaries across all finished stages.
// Returns array sorted by saldoGeral desc (best first, negatives last).
function calcFinancialRanking(){
  const finishedStages = DB.stages.filter(s=>
    s.status==="finished" && ((s.season||DATA_SEASON)===ACTIVE_SEASON)
  );
  const map = {}; // uid → {uid, entradas, premios, saldoTorneio, cashEntradas, cashSaidas, saldoCash, saldoGeral}

  const ensurePlayer = uid => {
    if(!map[uid]) map[uid] = {uid, entradas:0, premios:0, saldoTorneio:0, cashEntradas:0, cashSaidas:0, saldoCash:0, saldoGeral:0};
    return map[uid];
  };

  // Ensure ALL players appear (even with zero activity)
  DB.players.forEach(p => ensurePlayer(p.uid));

  finishedStages.forEach(s=>{
    const vals = getBuyinValues(s);
    const ins = s.inscriptions||[];
    const premios = calcPremiacao(s);
    const results = s.results||[];
    const cg = getCashGameData(s);

    // Torneio entries and prizes
    ins.forEach(uid=>{
      const rec = getBuyinRecord(s, uid);
      const entrada = entradaJogador(vals, rec);
      const result = results.find(r=>r.playerId===uid);
      const prize = result ? (premios.find(p=>p.position===result.position)?.value||0) : 0;
      const row = ensurePlayer(uid);
      row.entradas += entrada;
      row.premios += prize + (s.type==="knockout" ? calcKOEarnings(s, uid) : 0);   // PKO: prêmio + bounties (igual ao Resumo)
    });

    // Cash game entries and cashouts
    (cg.players||[]).forEach(uid=>{
      const row = ensurePlayer(uid);
      row.cashEntradas += getCashPlayerTotalEntries(s, uid);
      const cashout = getCashPlayerCashout(s, uid);
      if(cashout !== null) row.cashSaidas += cashout;
    });
  });

  // Compute derived fields
  Object.values(map).forEach(r=>{
    r.saldoTorneio = r.premios - r.entradas;
    r.saldoCash    = r.cashSaidas - r.cashEntradas;
    r.saldoGeral   = r.saldoTorneio + r.saldoCash;
  });

  return Object.values(map)
    .filter(r=> r.entradas>0 || r.cashEntradas>0) // exclude players with zero activity
    .sort((a,b)=> b.saldoGeral - a.saldoGeral);
}


function calcStats(uid){
  let p=0,w=0,wNL=0,wKO=0,wFT=0,ft=0,ko=0;
  DB.stages.filter(s=>s.status==="finished"&&((s.season||DATA_SEASON)===ACTIVE_SEASON)).forEach(s=>{
    const r=(s.results||[]).find(r=>r.playerId===uid);
    if(!r)return;
    if(!s.isFinal) p++;
    if(r.position<=9) ft++;
    if(r.position===1){
      if(s.isFinal)        wFT++;
      else if(s.type==="nlholdem") wNL++;
      else if(s.type==="knockout") wKO++;
      w++;
    }
    ko+=r.knockouts||0;
  });
  return {p,w,wNL,wKO,wFT,ft,ko};
}

function calcHOF(){
  // Seed from all players AND from results (catches unregistered UIDs)
  const allUids = new Set(DB.players.map(p=>p.uid));
  DB.stages.filter(s=>s.status==="finished").forEach(s=>
    (s.results||[]).forEach(r=>allUids.add(r.playerId))
  );
  return [...allUids].map(uid=>{
    const pl = getPlayer(uid)||{uid,name:uid,nickname:"?"};
    const st = calcStats(uid);
    const wTotal = st.wNL + st.wKO + st.wFT; // all wins
    return {pl,...st,wTotal};
  }).filter(h=>h.wTotal>0||h.wFT>0).sort((a,b)=>b.wTotal-a.wTotal||b.wFT-a.wFT||b.p-a.p);
}

// ── IMAGE UPLOAD HELPERS ──────────────────────────────────────────────────────
// ── CANVAS CROP ENGINE ────────────────────────────────────────────────────────
function openCropModal(file){
  return new Promise((resolve, reject)=>{
    const modal  = document.getElementById("crop-modal");
    const canvas = document.getElementById("crop-canvas");
    const ctx    = canvas.getContext("2d");
    const SIZE   = 300; // display canvas size
    canvas.width = SIZE; canvas.height = SIZE;

    let img, imgW, imgH;
    let scale = 1, minScale = 1;
    let offX = 0, offY = 0;
    let dragging = false, lastX = 0, lastY = 0;
    let lastDist = 0; // for pinch zoom

    function clamp(){
      const w = imgW*scale, h = imgH*scale;
      if(w < SIZE){ offX = (SIZE-w)/2; }
      else { offX = Math.min(0, Math.max(SIZE-w, offX)); }
      if(h < SIZE){ offY = (SIZE-h)/2; }
      else { offY = Math.min(0, Math.max(SIZE-h, offY)); }
    }

    function draw(){
      ctx.clearRect(0,0,SIZE,SIZE);
      ctx.drawImage(img, offX, offY, imgW*scale, imgH*scale);
    }

    const reader = new FileReader();
    reader.onload = e=>{
      img = new Image();
      img.onload = ()=>{
        imgW = img.width; imgH = img.height;
        // Fit so shortest side = SIZE
        minScale = SIZE / Math.min(imgW, imgH);
        scale = minScale;
        offX = (SIZE - imgW*scale)/2;
        offY = (SIZE - imgH*scale)/2;
        clamp(); draw();
        modal.style.display = "flex";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);

    // Mouse drag
    canvas.onmousedown  = e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; };
    canvas.onmousemove  = e=>{ if(!dragging) return; offX+=e.clientX-lastX; offY+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; clamp(); draw(); };
    canvas.onmouseup    = ()=>dragging=false;
    canvas.onmouseleave = ()=>dragging=false;

    // Touch drag + pinch
    canvas.ontouchstart = e=>{
      e.preventDefault();
      if(e.touches.length===1){ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
      if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
    };
    canvas.ontouchmove = e=>{
      e.preventDefault();
      if(e.touches.length===1 && dragging){
        offX+=e.touches[0].clientX-lastX; offY+=e.touches[0].clientY-lastY;
        lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
        clamp(); draw();
      }
      if(e.touches.length===2){
        const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        const factor=dist/lastDist;
        const cx=(SIZE/2-offX)/scale, cy=(SIZE/2-offY)/scale;
        scale=Math.max(minScale,Math.min(scale*factor,4));
        offX=SIZE/2-cx*scale; offY=SIZE/2-cy*scale;
        lastDist=dist; clamp(); draw();
      }
    };
    canvas.ontouchend = ()=>dragging=false;

    // Scroll to zoom
    canvas.onwheel = e=>{
      e.preventDefault();
      const factor = e.deltaY<0?1.1:0.9;
      const cx=(SIZE/2-offX)/scale, cy=(SIZE/2-offY)/scale;
      scale=Math.max(minScale,Math.min(scale*factor,4));
      offX=SIZE/2-cx*scale; offY=SIZE/2-cy*scale;
      clamp(); draw();
    };

    const doCancel = ()=>{ modal.style.display="none"; reject(new Error("Cancelado")); };
    document.getElementById("crop-cancel").onclick  = doCancel;
    document.getElementById("crop-cancel2").onclick = doCancel;

    document.getElementById("crop-confirm").onclick = ()=>{
      // Export 400x400
      const out = document.createElement("canvas");
      out.width=400; out.height=400;
      const ratio = 400/SIZE;
      out.getContext("2d").drawImage(img,
        -offX*ratio/scale*scale, -offY*ratio/scale*scale,
        imgW*scale*ratio, imgH*scale*ratio
      );
      // Simpler: just scale the visible canvas area
      const out2 = document.createElement("canvas");
      out2.width=400; out2.height=400;
      out2.getContext("2d").drawImage(canvas,0,0,400,400);
      out2.toBlob(blob=>{ modal.style.display="none"; resolve(blob); },"image/jpeg",0.85);
    };
  });
}

// Upload photo to Firebase Storage, return download URL
async function uploadPhoto(file, path, crop=true){
  let blob;
  if(crop){
    blob = await openCropModal(file);
  } else {
    // For stage photos: just compress without crop
    blob = await new Promise((res,rej)=>{
      const reader = new FileReader();
      reader.onerror = rej;
      reader.onload = e=>{
        const img = new Image();
        img.onerror = rej;
        img.onload = ()=>{
          const maxW = 1200;
          const scale = Math.min(1, maxW/Math.max(img.width,img.height));
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const cv = document.createElement("canvas");
          cv.width=w; cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          cv.toBlob(b=>b?res(b):rej(new Error("Falhou")), "image/jpeg", 0.80);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  const sRef = storageRef(storage, path);
  await uploadBytes(sRef, blob, {contentType:"image/jpeg"});
  return await getDownloadURL(sRef);
}

// ── NAVEGAÇÃO × BOTÃO VOLTAR (Android/iOS/navegador) ─────────────────────────
// O app troca de tela só por variáveis; sem isto, o botão voltar do aparelho (ou o gesto de voltar do iPhone)
// sai do app em vez de voltar uma tela. Aqui cada "página" (detalhe, financeiro, relógio…) vira uma entrada do
// histórico do navegador. Regras:
//  • abrir um detalhe/relógio/gestão  → nova entrada (voltar fecha o detalhe)
//  • trocar de aba principal           → Início → aba empilha; aba → aba substitui (voltar vai ao Início)
//  • sub-abas (Entradas/Custos…)       → só substituem o estado (voltar não passa por elas)
//  • botão "Voltar" da própria tela    → vira history.back() (não cresce a pilha)
//  • janela aberta (modal, foto, menu) → voltar FECHA a janela e fica na tela
let NAV_INIT = false, NAV_STACK = [], NAV_IDX = 0, NAV_SKIP_POP = false, NAV_OV = false;
function navSnapshot(){
  return { TAB, STAGE_DETAIL, ADMIN_TAB, ADMIN_STAGE_DETAIL, RULES_TAB, RULES_VIEW, BUYIN_MGMT, BUYIN_PLAYER, BUYIN_TAB,
           CASHGAME_MGMT, CASHGAME_PLAYER, RANK_TAB, TOOLS_VIEW, CLOCK_STAGE_ID, STATS_VIEW };
}
function navKey(s){
  return JSON.stringify([s.TAB, s.STAGE_DETAIL, s.ADMIN_STAGE_DETAIL, s.BUYIN_MGMT, s.BUYIN_PLAYER, s.CASHGAME_MGMT, s.CASHGAME_PLAYER, s.CLOCK_STAGE_ID, s.TOOLS_VIEW, s.RULES_VIEW, !!s.STATS_VIEW]);
}
function navIsRoot(s){
  return !s.STATS_VIEW && !s.STAGE_DETAIL && !s.ADMIN_STAGE_DETAIL && !s.BUYIN_MGMT && !s.BUYIN_PLAYER && !s.CASHGAME_MGMT && !s.CASHGAME_PLAYER
      && !s.CLOCK_STAGE_ID && (s.TOOLS_VIEW||"home")==="home" && (s.RULES_VIEW||"rules")==="rules";
}
function navApply(s){
  const wasClock = CLOCK_STAGE_ID;
  TAB=s.TAB||"home"; STAGE_DETAIL=s.STAGE_DETAIL||null; ADMIN_TAB=s.ADMIN_TAB||"stages"; ADMIN_STAGE_DETAIL=s.ADMIN_STAGE_DETAIL||null;
  RULES_TAB=s.RULES_TAB||"nlholdem"; RULES_VIEW=s.RULES_VIEW||"rules"; BUYIN_MGMT=s.BUYIN_MGMT||null; BUYIN_PLAYER=s.BUYIN_PLAYER||null;
  BUYIN_TAB=s.BUYIN_TAB||"entradas"; CASHGAME_MGMT=s.CASHGAME_MGMT||null; CASHGAME_PLAYER=s.CASHGAME_PLAYER||null;
  RANK_TAB=s.RANK_TAB||"geral"; TOOLS_VIEW=s.TOOLS_VIEW||"home"; STATS_VIEW=!!s.STATS_VIEW; MENU_OPEN=false; EXPANDED=null;
  const toClock = s.CLOCK_STAGE_ID || null;
  if(wasClock && wasClock!==toClock){
    try{ if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){}
    stopClockSync();
  }
  CLOCK_STAGE_ID = toClock;
  if(toClock && toClock!==wasClock){ try{ startClockSync(toClock); }catch(e){} }
}
// Há alguma janela (modal, foto, recorte, menu) aberta por cima da tela?
function navOverlayOpen(){
  const shown = (id)=>{ const e=document.getElementById(id); return !!e && e.style.display!=="none" && e.style.display!==""; };
  const filled = (id)=>{ const e=document.getElementById(id); return !!e && e.children.length>0; };
  return shown("crop-modal") || shown("lightbox") || filled("admin-modal") || filled("result-modal") || !!MENU_OPEN;
}
function navSync(){
  try{
    let dropAfter = false;
    if(NAV_OV && !navOverlayOpen()){ NAV_OV = false; dropAfter = true; }   // janela fechada pela própria tela
    const snap = navSnapshot(), key = navKey(snap);
    if(!NAV_INIT){
      NAV_INIT = true; NAV_STACK = [{key}]; NAV_IDX = 0;
      history.replaceState({ppp:snap, idx:0}, "");
    } else {
      const cur = NAV_STACK[NAV_IDX] || {key:null};
      if(key === cur.key){
        if(dropAfter && cur.ov) navDropOverlayEntry();       // mesma tela, janela fechou: remove a entrada da janela
        else history.replaceState({ppp:snap, idx:NAV_IDX, ov:cur.ov?1:0}, "");
      } else {
        // "Voltar" feito pela própria tela: o destino é uma página anterior da pilha → volta no histórico
        let target = NAV_IDX-1;
        while(target>=0 && NAV_STACK[target] && NAV_STACK[target].ov) target--;
        if(target>=0 && NAV_STACK[target] && NAV_STACK[target].key===key){
          const delta = target - NAV_IDX;
          NAV_IDX = target; NAV_SKIP_POP = true; NAV_OV = false; history.go(delta);
          return;
        }
        const prevSnap = history.state && history.state.ppp;
        // aba principal → aba principal (fora do Início): substitui em vez de empilhar
        if(prevSnap && !cur.ov && navIsRoot(prevSnap) && navIsRoot(snap) && prevSnap.TAB!=="home"){
          NAV_STACK[NAV_IDX] = {key}; history.replaceState({ppp:snap, idx:NAV_IDX}, "");
        } else {
          NAV_STACK = NAV_STACK.slice(0, NAV_IDX+1); NAV_STACK.push({key}); NAV_IDX++;
          history.pushState({ppp:snap, idx:NAV_IDX}, "");
        }
      }
    }
    navOverlaySync();
  }catch(e){ /* histórico indisponível (iframe/sandbox): o app segue funcionando sem ele */ }
}
// A janela fechou sem navegação: tira a entrada dela do histórico (senão o 1º "voltar" pareceria não fazer nada).
function navDropOverlayEntry(){
  try{
    if(NAV_STACK[NAV_IDX] && NAV_STACK[NAV_IDX].ov && NAV_IDX>0){
      NAV_STACK.pop(); NAV_IDX--; NAV_SKIP_POP = true; history.back();
    }
  }catch(e){}
}
// Janela abriu → ganha uma entrada no histórico, para o "voltar" fechá-la em vez de sair da tela.
function navOverlaySync(){
  try{
    if(!NAV_INIT) return;
    const open = navOverlayOpen();
    if(open && !NAV_OV){
      NAV_OV = true;
      const snap = navSnapshot(), key = navKey(snap);
      NAV_STACK = NAV_STACK.slice(0, NAV_IDX+1); NAV_STACK.push({key, ov:true}); NAV_IDX++;
      history.pushState({ppp:snap, idx:NAV_IDX, ov:1}, "");
    } else if(!open && NAV_OV){ NAV_OV = false; navDropOverlayEntry(); }
  }catch(e){}
}
// Fecha a janela aberta mais "por cima". Devolve true se fechou alguma.
function navCloseTopOverlay(){
  try{
    const crop = document.getElementById("crop-modal");
    if(crop && crop.style.display!=="none" && crop.style.display!==""){ (document.getElementById("crop-cancel")||{click(){}}).click(); return true; }
    const lb = document.getElementById("lightbox");
    if(lb && lb.style.display!=="none" && lb.style.display!==""){ lb.style.display="none"; return true; }
    const am = document.getElementById("admin-modal");
    if(am && am.children.length){ BLV_DRAFT = null; am.innerHTML=""; return true; }
    const rm = document.getElementById("result-modal");
    if(rm && rm.children.length){ closeResultModal(); return true; }
    if(MENU_OPEN){
      MENU_OPEN=false;
      document.getElementById("more-menu")?.classList.remove("open");
      document.getElementById("menu-backdrop")?.classList.remove("open");
      document.getElementById("btn-more")?.classList.remove("menu-open");
      return true;
    }
  }catch(e){}
  return false;
}
window.addEventListener("popstate", (e)=>{
  if(NAV_SKIP_POP){ NAV_SKIP_POP = false; return; }
  const st = e.state;
  const newIdx = (st && typeof st.idx==="number") ? st.idx : null;
  if(navOverlayOpen()){
    // "voltar" só para fechar a janela (a tela de baixo não muda)
    if(newIdx!==null) NAV_IDX = newIdx;
    NAV_OV = false;
    navCloseTopOverlay();
    setTimeout(navOverlaySync, 0);        // ainda sobrou outra janela? ganha nova entrada
    return;
  }
  if(!st || !st.ppp) return;
  // entrada "velha" de janela já fechada: pula na direção em que o usuário estava indo
  if(st.ov){
    const dir = (newIdx!==null && newIdx > NAV_IDX) ? 1 : -1;
    NAV_IDX = newIdx!==null ? newIdx : NAV_IDX;
    NAV_SKIP_POP = false;
    history.go(dir);
    return;
  }
  if(!CURRENT_USER) return;                     // na tela de login não há o que restaurar
  NAV_IDX = newIdx!==null ? newIdx : 0;
  NAV_STACK[NAV_IDX] = {key: navKey(st.ppp)};
  navApply(st.ppp);
  render();
  window.scrollTo(0,0);
});
// janelas abrem/fecham sem passar pelo render(): observa os contêineres
let NAV_OBSERVING = false;
function navObserveOverlays(){
  if(NAV_OBSERVING) return;
  try{
    NAV_OBSERVING = true;
    const mo = new MutationObserver(()=>navOverlaySync());
    ["admin-modal","result-modal"].forEach(id=>{ const e=document.getElementById(id); if(e) mo.observe(e,{childList:true}); });
    ["lightbox","crop-modal"].forEach(id=>{ const e=document.getElementById(id); if(e) mo.observe(e,{attributes:true, attributeFilter:["style"]}); });
  }catch(e){}
}
if(document.readyState!=="loading") navObserveOverlays(); else document.addEventListener("DOMContentLoaded", navObserveOverlays);

// Altera só o registro do jogador logado, numa transação sobre a versão mais nova do servidor (como mutateMyTokens)
async function mutateMyPlayer(fn){
  if(!CURRENT_USER_UID) return null;
  const ref = doc(db,"seasons",DATA_SEASON); let out = null;
  if(SCHEMA_V2){
    const pref = v2PlayerRef(CURRENT_USER_UID);
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(pref); if(!snap.exists()) throw new Error("perfil do jogador não encontrado");
      out = fn(snap.data()); tx.set(pref, deepSanitize(out));
    });
    const idx2 = DB.players.findIndex(p=>p.uid===CURRENT_USER_UID); if(idx2>=0) DB.players[idx2] = {...DB.players[idx2], ...out};
    return out;
  }
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(ref); if(!snap.exists()) throw new Error("temporada não encontrada");
    const players = (snap.data().players||[]).slice(); const i = players.findIndex(p=>p.uid===CURRENT_USER_UID);
    if(i<0) throw new Error("perfil do jogador não encontrado");
    out = fn(players[i]); players[i] = out;
    tx.update(ref,{players: sanitizePlayers(players), updatedAt: serverTimestamp()});
  });
  const idx = DB.players.findIndex(p=>p.uid===CURRENT_USER_UID); if(idx>=0) DB.players[idx] = {...DB.players[idx], ...out};
  return out;
}

    <div class="row g8" style="margin-top:14px">

  ov.appendChild(box); wrap.appendChild(ov); box.addEventListener("click",e=>e.stopPropagation());

      if(isGoogle) await reauthenticateWithPopup(user, googleProvider);

      // 2) anonimiza o registro e tira das etapas futuras (sem mexer em quem já tem registro financeiro)

        const drop = DB.stages.filter(s=>s.status==="upcoming" && !(s.buyinData||[]).some(r=>r.uid===uid)).map(s=>v2RegId(s.id,uid));
        await v2Batched(drop.map(id=>b=>b.delete(v2RegRef(id))));
      } else
      await runTransaction(db, async(tx)=>{
        const snap = await tx.get(ref); if(!snap.exists()) throw new Error("temporada não encontrada");
        const d = snap.data(); const players = (d.players||[]).map(p=>p.uid===uid?anonymizePlayerRec(p):p);
        const stages = (d.stages||[]).map(s=> s.status==="upcoming" && !(s.buyinData||[]).some(r=>r.uid===uid) ? {...s, inscriptions:(s.inscriptions||[]).filter(x=>x!==uid)} : s);
        tx.update(ref,{players: sanitizePlayers(players), stages: sanitizeStages(stages), updatedAt: serverTimestamp()});
      });
      // 3) foto e token do aparelho
      try{ await deleteObject(storageRef(storage, `avatars/${uid}`)); }catch(e){}
      try{ await deleteToken(messaging); }catch(e){}
      try{ localStorage.removeItem("ppp_priv_"+uid); }catch(e){}
      // 4) apaga o login
      stopListeners(); await deleteUser(user);
      wrap.innerHTML = ""; showToast("Conta excluída. Seus dados pessoais foram removidos.","green");
    }catch(e){
      const c = e && e.code || "";
      err.textContent = c==="auth/wrong-password"||c==="auth/invalid-credential" ? "Senha incorreta." : c==="auth/missing-password" ? "Digite a sua senha." : c==="auth/popup-closed-by-user" ? "Confirmação cancelada." : "Não foi possível concluir: "+(e.message||c);
      go.disabled = false; go.textContent = "Excluir definitivamente"; window._deletingAccount = false;
    }
  });
}

// ── INSTALAR COMO APP (PWA) ──────────────────────────────────────────────────
// Android/Chrome/Edge/desktop: o navegador avisa (beforeinstallprompt) e instalamos com um toque.
// iPhone/iPad (Safari): não existe esse aviso; o caminho é Compartilhar → Adicionar à Tela de Início, então mostramos o passo a passo.
let INSTALL_EVT = null;
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const IS_MOBILE_UA = IS_IOS || /android|mobile/i.test(navigator.userAgent);
const IS_STANDALONE = () => { try{ return matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone===true; }catch(e){ return false; } };
const canInstall = () => !IS_STANDALONE() && (!!INSTALL_EVT || IS_MOBILE_UA);
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); INSTALL_EVT = e; if(CURRENT_USER && !document.querySelector(".ov")) render(); });
window.addEventListener("appinstalled", ()=>{ INSTALL_EVT = null; try{ showToast("PPP Poker instalado!","green"); }catch(_){} render(); });
const ICON_INSTALL = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 8v6m0 0l-2.5-2.5M12 14l2.5-2.5"/><path d="M10.5 18.5h3"/></svg>`;

function openInstallHelp(){
  const wrap = document.getElementById("result-modal"); if(!wrap) return;
  const steps = IS_IOS
    ? ['Toque no botão <b>Compartilhar</b> <span style="display:inline-block;border:1px solid var(--border2);border-radius:6px;padding:0 6px">⬆︎</span> na barra do Safari.',
       'Role a lista e toque em <b>Adicionar à Tela de Início</b>.',
       'Confirme em <b>Adicionar</b>. O ícone do PPP aparece na sua tela, e o app abre em tela cheia.']
    : ['Abra o menu do navegador (<b>⋮</b>, no canto superior).',
       'Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.',
       'Confirme. O ícone do PPP aparece na sua tela, e o app abre em tela cheia.'];
  wrap.innerHTML = `<div class="ov ov-center" id="install-ov"><div class="modal" style="max-width:420px">
    <div class="mtitle">Instalar PPP Poker</div>
    <div style="font-size:13.5px;color:var(--muted);margin-bottom:14px">Use como um app de verdade: tela cheia, ícone na tela inicial e abertura mais rápida.</div>
    <ol style="margin:0 0 14px 18px;padding:0;display:grid;gap:10px;font-size:14px;line-height:1.45">${steps.map(s=>`<li>${s}</li>`).join("")}</ol>
    ${IS_IOS?`<div style="font-size:12.5px;color:var(--muted);background:var(--bg-dark);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px">No iPhone, use o <b style="color:var(--text)">Safari</b>. As notificações só funcionam depois de instalar o app e abri-lo pelo ícone.</div>`:""}
    <button class="btn by fw" id="install-close">Entendi</button>
  </div></div>`;
  const close = ()=>{ wrap.innerHTML=""; };
  wrap.querySelector("#install-close").addEventListener("click", close);
  wrap.querySelector("#install-ov").addEventListener("click", e=>{ if(e.target.id==="install-ov") close(); });
}
async function installApp(){
  if(INSTALL_EVT){
    const ev = INSTALL_EVT; INSTALL_EVT = null;      // o aviso só pode ser usado uma vez
    try{ await ev.prompt(); await ev.userChoice; }catch(_){ openInstallHelp(); return; }
    render();
    return;
  }
  openInstallHelp();
}

// ── RELÓGIO NA TELA PRINCIPAL ─────────────────────────────────────────────────
// Todos os relógios do Firestore (clocks/{temporada}_{etapa}). Um relógio aparece na tela principal para TODOS
// enquanto não estiver "zerado", mesmo com a etapa finalizada (zerado = parado no nível 1 com o tempo cheio, como logo após o Reset).
const CLOCK_LIVE = {};   // etapaId → estado normalizado
function clockStartedStages(){
  return DB.stages.filter(s=>{
    const st = CLOCK_LIVE[s.id];
    return !!st && (st.status!=="idle" || (st.elapsedMs||0) > 0);
  });
}
function clockBannerSig(){ return clockStartedStages().map(s=>s.id+":"+CLOCK_LIVE[s.id].status).join(","); }
function renderClockBanner(){
  const list = clockStartedStages();
  if(!list.length) return "";
  return list.map(s=>{
    const st = CLOCK_LIVE[s.id];
    const running = st.status==="running";
    return `<button data-open-clock="${s.id}" class="clk-home-banner" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:14px 16px;background:linear-gradient(135deg,rgba(52,152,219,.22),rgba(52,152,219,.08));border:1px solid var(--blue);border-radius:6px;color:#fff;cursor:pointer;text-align:left">

        <span style="font-size:24px">⏱</span>

          <span style="display:block;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue)">Relógio ao vivo</span>

      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);flex-shrink:0">Abrir →</span>
    </button>`;
  }).join("");
}

// ── STATS (início) ── cálculo puro (sem DOM): tudo derivado de DB.stages, então atualiza sozinho a cada etapa concluída
function statsOrder(stages, season){
  return stages.filter(s=>!s.isFinal && ((s.season||"2026")===season)).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
// Ranking (lista de uids) considerando só as etapas de "done". Mesmas regras do ranking do app: pontos e desempate por contagem de posições.
function statsRankAfter(done, players){
  const sc = {};
  players.forEach(p=>{ sc[p.uid] = {uid:p.uid,total:0,n:0,counts:{},best:Infinity}; });
  done.forEach(s=>(s.results||[]).forEach(r=>{
    const o = sc[r.playerId] || (sc[r.playerId] = {uid:r.playerId,total:0,n:0,counts:{},best:Infinity});
    o.total += getPts(r.position); o.n++; o.counts[r.position] = (o.counts[r.position]||0)+1;
    if(r.position < o.best) o.best = r.position;
  }));
  return Object.values(sc).filter(o=>o.n>0).sort((a,b)=>{
    if(b.total!==a.total) return b.total-a.total;
    for(let p=1;p<=100;p++){ const d=(b.counts[p]||0)-(a.counts[p]||0); if(d) return d; }
    if(isFinite(a.best)&&isFinite(b.best)&&a.best!==b.best) return a.best-b.best;
    return 0;
  });
}
// type: "geral" | "nlholdem" | "knockout". Etapas futuras entram como colunas em branco; a final fica de fora.
function statsBuild(stages, players, season, type){
  const t = type||"geral";
  const all = statsOrder(stages, season).filter(s=>t==="geral" || s.type===t);
  const cols = all.map(s=>({id:s.id, name:s.name, date:s.date, type:s.type, done:s.status==="finished" && (s.results||[]).length>0}));
  const map = {}; const ensure = u => map[u] || (map[u] = {uid:u, pos:cols.map(()=>null), pts:cols.map(()=>null), res:cols.map(()=>null), sp:cols.map(()=>null), delta:cols.map(()=>null)});
  const doneList = []; const prevPos = {}; let last = [];
  all.forEach((s,i)=>{
    if(!cols[i].done) return;
    doneList.push(s);
    const rk = statsRankAfter(doneList, players); last = rk.map(o=>o.uid);
    rk.forEach((o,idx)=>{
      const e = ensure(o.uid); e.pos[i] = idx+1; e.pts[i] = o.total;
      if(prevPos[o.uid]!=null) e.delta[i] = prevPos[o.uid] - (idx+1);
      prevPos[o.uid] = idx+1;
    });
    (s.results||[]).forEach(r=>{ const e = ensure(r.playerId); e.res[i] = r.position; e.sp[i] = getPts(r.position); });
  });
  const series = last.map(u=>map[u]);
  let maxPos = 3, maxPts = 25;
  series.forEach(e=>e.pos.forEach((p,i)=>{ if(p!=null){ maxPos = Math.max(maxPos,p); maxPts = Math.max(maxPts,e.pts[i]); } }));
  return {cols, series, last, maxPos, maxPts, doneCount: cols.filter(c=>c.done).length};
}
// Estatísticas de temporada (sem financeiro). Mesa final = top 9 da etapa.
function statsExtras(stages, players, season){
  const fin = statsOrder(stages, season).filter(s=>s.status==="finished" && (s.results||[]).length>0);
  const m = {};
  players.forEach(p=>{ m[p.uid] = {uid:p.uid, played:0, wins:0, p2:0, p3:0, ft:0, ko:0, pts:0}; });
  fin.forEach(s=>(s.results||[]).forEach(r=>{
    const o = m[r.playerId] || (m[r.playerId] = {uid:r.playerId, played:0, wins:0, p2:0, p3:0, ft:0, ko:0, pts:0});
    o.played++; o.pts += getPts(r.position); if(r.position===1) o.wins++; if(r.position===2) o.p2++; if(r.position===3) o.p3++;
    if(r.position<=9) o.ft++; o.ko += Number(r.knockouts)||0;
  }));
  const rows = Object.values(m).filter(o=>o.played>0);
  const D = statsBuild(stages, players, season, "geral");
  let rise = null, fall = null;
  D.series.forEach(e=>e.delta.forEach((d,i)=>{
    if(d==null) return;
    if(d>0 && (!rise || d>rise.d)) rise = {uid:e.uid, d, i};
    if(d<0 && (!fall || d<fall.d)) fall = {uid:e.uid, d, i};
  }));
  return {rows, total:fin.length, rise, fall, cols:D.cols};
}

const RECAP_DAYS = 5;   // o banner da Início fica do dia seguinte até o 5º dia após a etapa
// ── RESUMO (início) ── resumo pós-etapa: tudo derivado dos resultados publicados, aparece sozinho (nenhuma ação de admin)
// Etapa a resumir: a última etapa finalizada, no dia seguinte e no seguinte a ele; se o resultado só foi publicado depois (atrasado),
// aparece por 36h a partir da publicação.
function recapPick(stages, season, now){
  const fin = stages.filter(s=>((s.season||"2026")===season) && s.status==="finished" && (s.results||[]).length && s.date)
    .slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const st = fin[fin.length-1]; if(!st) return null;
  const [y,m,d] = st.date.split("-").map(Number);
  const days = Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - Date.UTC(y,m-1,d))/86400000);
  const pub = Number(st.publishedAt)||0;
  const late = pub>0 && days>=1 && (now.getTime()-pub) < 36*3600*1000;
  return ((days>=1 && days<=RECAP_DAYS) || late) ? st : null;
}
// prizeInfo (opcional): {prize, bounty} do campeão, calculado por quem chama (o cálculo financeiro fica fora deste bloco puro)
function buildRecap(stages, players, season, st, prizeInfo){
  const res = (st.results||[]).slice().sort((a,b)=>a.position-b.position);
  const ordered = statsOrder(stages, season);
  const idx = ordered.findIndex(s=>s.id===st.id);          // -1 = mesa final (fora do ranking)
  const isFinal = idx<0;
  const withRes = s => s.status==="finished" && (s.results||[]).length;
  const upTo = isFinal ? ordered.filter(withRes) : ordered.slice(0,idx+1).filter(withRes);
  const before = isFinal ? upTo : upTo.filter(s=>s.id!==st.id);
  const lead = (list, type) => { const r = statsRankAfter(type==="geral" ? list : list.filter(s=>s.type===type), players); return r[0] ? {uid:r[0].uid, pts:r[0].total} : null; };
  const leaders = {};
  ["geral","nlholdem","knockout"].forEach(t=>{
    const now = lead(upTo,t), prev = lead(before,t);
    leaders[t] = now ? {...now, changed: !!(prev && prev.uid!==now.uid), isNew: !prev && !isFinal} : null;
  });
  let rises=[], falls=[], entered=[], left=[];
  if(!isFinal){
    const D = statsBuild(stages, players, season, "geral");
    const col = D.cols.findIndex(c=>c.id===st.id);
    D.series.forEach(e=>{
      const pos = e.pos[col]; if(pos==null) return;
      const d = e.delta[col], prev = d==null ? null : pos + d;
      if(d>0) rises.push({uid:e.uid, d, from:prev, to:pos}); else if(d<0) falls.push({uid:e.uid, d, from:prev, to:pos});
      if(pos<=9 && (prev==null || prev>9)) entered.push({uid:e.uid, to:pos});
      if(pos>9 && prev!=null && prev<=9) left.push({uid:e.uid, to:pos});
    });
    rises.sort((a,b)=>b.d-a.d || a.to-b.to); falls.sort((a,b)=>a.d-b.d || a.to-b.to);
    rises = rises.slice(0,3); falls = falls.slice(0,2);
    entered.sort((a,b)=>a.to-b.to); left.sort((a,b)=>a.to-b.to);
  }
  const ko = st.type==="knockout" ? (()=>{ const tot = res.reduce((n,r)=>n+(Number(r.knockouts)||0),0); const mx = Math.max(0,...res.map(r=>Number(r.knockouts)||0));
    return {total:tot, top: mx>0 ? res.filter(r=>(Number(r.knockouts)||0)===mx).map(r=>r.playerId) : [], topN:mx}; })() : null;
  const seen = new Set(); before.forEach(s=>(s.results||[]).forEach(r=>seen.add(r.playerId)));
  const debuts = isFinal ? [] : res.filter(r=>!seen.has(r.playerId)).map(r=>r.playerId);
  const nextStage = stages.filter(s=>s.status==="upcoming" && s.date).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0] || null;
  return {
    stage:{id:st.id, name:st.name, type:st.type, date:st.date, isFinal},
    podium: res.slice(0,3).map(r=>({uid:r.playerId, pos:r.position, pts:getPts(r.position), ko:Number(r.knockouts)||0})),
    participants: res.length, prize: prizeInfo||null, leaders, rises, falls, entered, left, ko, debuts,
    season:{done:upTo.length, total:ordered.length}, next: nextStage ? {name:nextStage.name, date:nextStage.date, time:nextStage.time||""} : null
  };
}

function statsChartSvg(D, sel, mode, cw){
  const n = D.cols.length;
  if(!n) return '<div class="empty">Nenhuma etapa cadastrada.</div>';
  const S = D.series.filter(e=>sel.has(e.uid));
  const isPos = mode==="pos";
  // escala acompanha os jogadores selecionados (com 90 jogadores, escalar pelo total deixaria o gráfico ilegível)
  let lo = Infinity, hi = -Infinity, vmax = 25;
  S.forEach(e=>e.pos.forEach((p,i)=>{ if(p!=null){ lo=Math.min(lo,p); hi=Math.max(hi,p); vmax=Math.max(vmax,e.pts[i]); } }));
  if(!isFinite(lo)){ lo = 1; hi = 10; }
  if(hi-lo<2) hi = lo+2;
  const span = hi-lo, many = S.length>12;
  const padL=36, padR=16, padT=16, padB=36, H = isPos && span>14 ? 340 : 270, minStep=56;
  const base = Math.max(cw||340, 300);
  const step = n>1 ? Math.max(minStep, (base-padL-padR)/(n-1)) : 0;
  const W = n>1 ? padL+padR+(n-1)*step : base;
  const x = i => n>1 ? padL + i*step : padL + (W-padL-padR)/2;
  const ih = H-padT-padB;
  const y = v => isPos ? padT + (v-lo)/span*ih : padT + (1-v/vmax)*ih;
  let g = "";
  if(isPos){
    const every = Math.max(1, Math.ceil(span/9));
    for(let p=lo;p<=hi;p+=every) g += `<line x1="${padL}" x2="${W-padR+6}" y1="${y(p)}" y2="${y(p)}" stroke="rgba(255,255,255,.07)"/><text x="${padL-8}" y="${y(p)+4}" text-anchor="end" font-size="11" fill="#8d8d98">${p}º</text>`;
  } else {
    const top = Math.ceil(vmax/25)*25, q = top/4;
    for(let k=0;k<=4;k++){ const v=k*q, yy=y(v*vmax/top); g += `<line x1="${padL}" x2="${W-padR+6}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.07)"/><text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#8d8d98">${v}</text>`; }
  }
  const xl = D.cols.map((c,i)=>`${c.done?"":`<line x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${H-padB}" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>`}<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" font-weight="600" fill="${c.done?"#c9c9d1":"#5d5d68"}">E${i+1}</text>`).join("");
  let lines = "", dots = "";
  const sw = many ? 1.8 : 2.4, rr = many ? 3 : 4;
  S.slice().sort((a,b)=>(a.uid===STATS_FOCUS)-(b.uid===STATS_FOCUS)).forEach(e=>{
    const col = statsColor(e.uid), val = isPos ? e.pos : e.pts, pts = [];
    const op = STATS_FOCUS && e.uid!==STATS_FOCUS ? .14 : 1;
    val.forEach((v,i)=>{ if(v!=null && D.cols[i].done) pts.push([i, x(i), y(v)]); });
    if(pts.length>1) lines += `<polyline points="${pts.map(q=>q[1].toFixed(1)+","+q[2].toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="${e.uid===STATS_FOCUS?3.4:sw}" stroke-linejoin="round" stroke-linecap="round" opacity="${op}"/>`;
    pts.forEach(q=>{ dots += `<circle cx="${q[1].toFixed(1)}" cy="${q[2].toFixed(1)}" r="${rr}" fill="${col}" stroke="#111114" stroke-width="1.5" opacity="${op}"/><circle class="stx-hit" data-i="${q[0]}" data-u="${e.uid}" cx="${q[1].toFixed(1)}" cy="${q[2].toFixed(1)}" r="${many?9:13}" fill="transparent"/>`; });
  });
  const empty = !S.length ? `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="#8d8d98">${D.doneCount?"Escolha jogadores para ver o gráfico":"O gráfico aparece quando a primeira etapa for concluída"}</text>` : "";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução dos jogadores nas etapas">${g}${xl}${lines}${dots}${empty}</svg>`;
}

  const box = document.getElementById("stx-chart-card"); if(!box) return;

function statsWire(box){
  box.onclick = ev => {
    const t = ev.target.closest("[data-stx-type],[data-stx-mode],[data-stx-pick],[data-stx-chip],[data-stx-closeres],.stx-hit");
    if(!t){ if(STATS_FOCUS && ev.target.closest("#stx-scroll")){ STATS_FOCUS=null; statsDyn(); } return; }
    const D = statsBuild(DB.stages, DB.players, ACTIVE_SEASON, STATS_TYPE);
    if(t.dataset.stxType){ STATS_TYPE=t.dataset.stxType; STATS_FOCUS=null; statsRefresh(); }
    else if(t.dataset.stxMode){ STATS_MODE=t.dataset.stxMode; STATS_FOCUS=null; statsRefresh(); }
    else if(t.dataset.stxPick){
      const k=t.dataset.stxPick, s=statsSelection(D);
      if(k==="me"){ if(D.last.includes(CURRENT_USER_UID)) s.has(CURRENT_USER_UID) ? s.delete(CURRENT_USER_UID) : s.add(CURRENT_USER_UID); }
      else statsSaveSel(new Set(k==="none" ? [] : D.last.slice(0,Number(k))));
      if(k==="me") statsSaveSel(s);
      STATS_FOCUS=null; statsDyn(true);
    }
    else if(t.dataset.stxChip){ const s=statsSelection(D), u=t.dataset.stxChip; s.has(u)?s.delete(u):s.add(u); statsSaveSel(s); if(STATS_FOCUS===u) STATS_FOCUS=null; statsDyn(true); }
    else if(t.hasAttribute("data-stx-closeres")){ STATS_OPEN=false; STATS_Q=""; const i=document.getElementById("stx-q"); if(i) i.value=""; statsDyn(); }
    else if(t.classList.contains("stx-hit")){
      const u=t.dataset.u; STATS_FOCUS = STATS_FOCUS===u ? null : u; statsDyn();
      const tip=document.getElementById("stx-tip"); if(tip) tip.innerHTML = statsTipHtml(D, u, Number(t.dataset.i), STATS_MODE);
    }
  };
  const inp = box.querySelector("#stx-q");
  if(inp){ inp.oninput = ()=>{ STATS_Q = inp.value; statsDyn(); }; inp.onfocus = ()=>{ if(!STATS_OPEN){ STATS_OPEN=true; statsDyn(); } }; }
}

const PC_KEY = "ppp_photo_checks_v1";
let PC_RUNNING = false, PC_CUR = null;
function pcLoad(){ try{ return JSON.parse(localStorage.getItem(PC_KEY)||"[]"); }catch(e){ return []; } }
function pcSave(runs){ try{ localStorage.setItem(PC_KEY, JSON.stringify(runs.slice(-2))); }catch(e){} }
function pcItems(){
  const out = [];
  DB.players.forEach(pl=>{ if(pl.photoURL) out.push({id:"P:"+pl.uid, tipo:"Perfil", nome:pl.nickname||pl.name||pl.uid, url:pl.photoURL, path:`avatars/${pl.uid}`}); });
  DB.stages.forEach(s=>{ [["photoChampion","campeão"],["photoFinalTable","mesa final"]].forEach(([k,l])=>{ if(s[k]) out.push({id:"S:"+s.id+":"+k, tipo:"Etapa", nome:`${s.name} · ${l}`, url:s[k], path:`stages/${s.id}/${k}.jpg`}); }); });
  return out;
}
const pcWithTimeout = (pr, ms) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
async function pcCheckOne(it){
  const r = {id:it.id, tipo:it.tipo, nome:it.nome};
  // 1) a imagem carrega como o app a mostra?
  r.carrega = await new Promise(res=>{ const im=new Image(); const t=setTimeout(()=>res(false),9000); im.onload=()=>{clearTimeout(t);res(true);}; im.onerror=()=>{clearTimeout(t);res(false);}; im.src=it.url; });
  // 2) leitura pelo caminho, logado (depende da regra de leitura do Storage)
  try{ await pcWithTimeout(getDownloadURL(storageRef(storage, it.path)), 9000); r.logado = true; }catch(e){ r.logado = false; r.logadoErro = (e && (e.code||e.message))||"erro"; }
  // 3) leitura pelo caminho SEM login (REST, sem token): true = aberta ao público
  try{
    const bucket = "pppoker-c5f0d.firebasestorage.app";
    const resp = await pcWithTimeout(fetch(`https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(it.path)}`, {cache:"no-store"}), 9000);
    r.publica = resp.status===200 ? true : (resp.status===401||resp.status===403 ? false : null);
  }catch(e){ r.publica = null; }
  return r;
}
async function runPhotoCheck(){
  if(PC_RUNNING) return; PC_RUNNING = true;
  const items = pcItems(); const res = []; let i = 0;
  const btn = document.getElementById("pc-run"); if(btn){ btn.disabled = true; btn.textContent = "Checando…"; }
  PC_CUR = {em:new Date().toISOString(), total:items.length, itens:res, andamento:true}; photoCheckPaint();
  const worker = async()=>{ while(i<items.length){ const it = items[i++]; res.push(await pcCheckOne(it)); PC_CUR.feitos = res.length; photoCheckPaint(); } };
  await Promise.all(Array.from({length:6}, worker));
  res.sort((a,b)=>a.id.localeCompare(b.id)); PC_CUR.andamento = false;
  const runs = pcLoad(); runs.push({em:PC_CUR.em, total:items.length, itens:res}); pcSave(runs);
  PC_RUNNING = false; photoCheckPaint(); if(btn){ btn.disabled = false; btn.textContent = "Rodar checagem"; }
}
const pcSum = run => ({ok:run.itens.filter(x=>x.carrega).length, falha:run.itens.filter(x=>!x.carrega).length, logado:run.itens.filter(x=>x.logado).length, publica:run.itens.filter(x=>x.publica===true).length});
function pcDiff(prev, cur){
  if(!prev) return [];
  const m = new Map(prev.itens.map(x=>[x.id,x])), d = [];
  cur.itens.forEach(x=>{ const o = m.get(x.id); if(!o) return;
    if(o.carrega!==x.carrega) d.push(`${x.nome}: carregava ${o.carrega?"✓":"✗"} → ${x.carrega?"✓":"✗"}`);
    if(o.logado!==x.logado) d.push(`${x.nome}: leitura logado ${o.logado?"✓":"✗"} → ${x.logado?"✓":"✗"}`);
    if(o.publica!==x.publica) d.push(`${x.nome}: acesso sem login ${o.publica===true?"aberto":o.publica===false?"bloqueado":"?"} → ${x.publica===true?"aberto":x.publica===false?"bloqueado":"?"}`);
  });
  return d;
}
function photoCheckText(){
  const runs = pcLoad(), cur = runs[runs.length-1], prev = runs[runs.length-2]; if(!cur) return "Nenhuma checagem ainda.";
  const f = r=>{ const t = pcSum(r); return `${new Date(r.em).toLocaleString("pt-BR")} — ${r.total} fotos: carregam ${t.ok}, falham ${t.falha}, leitura logado ${t.logado}, abertas sem login ${t.publica}`; };
  const L = ["Checagem de fotos PPP Poker","ATUAL: "+f(cur)]; if(prev) L.push("ANTERIOR: "+f(prev));
  const d = pcDiff(prev,cur); L.push("", d.length?"Mudanças:":"Sem mudanças em relação à anterior.", ...d);
  const bad = cur.itens.filter(x=>!x.carrega); if(bad.length) L.push("", "Fotos que NÃO carregam:", ...bad.map(x=>`- ${x.nome}`));
  return L.join("\n");
}
function photoCheckPaint(){
  const out = document.getElementById("pc-out"); if(!out) return;
  const runs = pcLoad(); const live = PC_CUR && PC_CUR.andamento ? PC_CUR : null;
  const cur = live ? null : runs[runs.length-1], prev = live ? runs[runs.length-1] : runs[runs.length-2];
  const box = (t,c)=>`<div style="flex:1;min-width:90px;background:var(--surface2);border-radius:8px;padding:10px;text-align:center"><div style="font-family:var(--f-d);font-weight:800;font-size:22px;color:${c||"#fff"}">${t[0]}</div><div style="font-size:11px;color:var(--muted)">${t[1]}</div></div>`;
  let html = "";
  if(live){ html += `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Checando… ${live.feitos||0} de ${live.total}</div>`; }
  if(cur){

function recapCurrent(sid){

    const pr = calcPremiacao(ghost).find(p=>p.position===1);
    const prize = pr && pr.value>0 ? pr.value : 0;
    const bounty = st.type==="knockout" && champ ? calcKOEarnings(ghost, champ.playerId) : 0;
    if(st.finance && (prize>0 || bounty>0)) prizeInfo = {prize, bounty};

// URL → data URI (recorte quadrado centralizado). Tenta CORS e fetch; se o servidor não permitir, devolve null (cai nas iniciais).
function recapImgData(url, size, focusY){
  const crop = img => { try{
    const cv = document.createElement("canvas"); cv.width = cv.height = size; const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth-side)/2, sy = Math.max(0, Math.min(img.naturalHeight-side, (img.naturalHeight-side)*(focusY==null?.5:focusY)));
    cv.getContext("2d").drawImage(img, sx, sy, side, side, 0, 0, size, size); return cv.toDataURL("image/jpeg",.88);
  }catch(e){ return null; } };
  const load = (src, cors) => new Promise(res=>{ const im = new Image(); const t = setTimeout(()=>res(null),6000); if(cors) im.crossOrigin = "anonymous";
    im.onload = ()=>{ clearTimeout(t); res(im); }; im.onerror = ()=>{ clearTimeout(t); res(null); }; im.src = src; });
  return (async()=>{
    if(!url) return null;
    let im = await load(url, true); let d = im && crop(im); if(d) return d;
    try{ const b = await (await fetch(url)).blob(); const u = URL.createObjectURL(b); im = await load(u,false); d = im && crop(im); URL.revokeObjectURL(u); if(d) return d; }catch(e){}
    return null;
  })();
}

    modal.querySelector("#rcp-prev").innerHTML = `<img src="${dataUrl}" style="width:100%;display:block"/>`; modal.querySelector("#rcp-prev").style.display = "block";
    modal.querySelector("#rcp-msg").style.display = "none"; modal.querySelector("#rcp-btns").style.display = "flex";
    const blob = await (await fetch(dataUrl)).blob(), file = new File([blob], fname, {type:"image/png"});
    const canShareFile = !!(navigator.share && navigator.canShare && navigator.canShare({files:[file]}));
    if(canShareFile){
      modal.querySelector("#rcp-share").style.display = "";
      modal.querySelector("#rcp-share").addEventListener("click", async()=>{ try{ await navigator.share({files:[file], text}); }catch(e){ /* cancelado */ } });
    } else {
      modal.querySelector("#rcp-wa").style.display = "";
      modal.querySelector("#rcp-wa").addEventListener("click",()=>{ const a=document.createElement("a"); a.href=dataUrl; a.download=fname; a.click(); setTimeout(()=>window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank"),800); });
    }
    modal.querySelector("#rcp-dl").addEventListener("click",()=>{ const a=document.createElement("a"); a.href=dataUrl; a.download=fname; a.click(); });
  }catch(err){
    modal.querySelector("#rcp-msg").innerHTML = `<span style="color:var(--red)">Não foi possível gerar a imagem (${err.message}). Você ainda pode copiar o texto.</span>`;
    modal.querySelector("#rcp-btns").style.display = "flex"; modal.querySelector("#rcp-dl").style.display = "none";
  }
}

  return `<div style="display:flex;align-items:center;gap:8px;margin-top:4px">

// ── HOF ───────────────────────────────────────────────────────────────────────
function renderHOF(){
  const all = calcHOF();

  // Apply filter
  let filtered;
  if(HOF_FILTER==="ft"){
    filtered = all.filter(h=>h.wFT>0).sort((a,b)=>b.wFT-a.wFT||b.wTotal-a.wTotal);
  } else if(HOF_FILTER==="stages"){
    filtered = all.filter(h=>(h.wNL+h.wKO)>0).sort((a,b)=>(b.wNL+b.wKO)-(a.wNL+a.wKO)||b.wTotal-a.wTotal);
  } else {
    // total: all wins combined
    filtered = all.sort((a,b)=>b.wTotal-a.wTotal||b.wFT-a.wFT);
  }

  const tabs = [
    {id:"total",  icon:"🏅", label:"Total"},
    {id:"stages", icon:"🃏", label:"Etapas"},
    {id:"ft",     icon:"🏆", label:"Mesa Final"},
  ];

  return `<div class="sec">
  <div class="st">Hall of <span class="ac">Fame</span></div>
  <div class="ss">Campeões da Temporada ${ACTIVE_SEASON}</div>
  <div class="dv"></div>

  <div class="tabs" style="margin-bottom:16px">
    ${tabs.map(t=>`<button class="tb${HOF_FILTER===t.id?" on":""}" data-hof-tab="${t.id}">
      ${t.icon} ${t.label}
    </button>`).join("")}
  </div>

  ${filtered.length===0?`<div class="empty">Nenhuma vitória ${HOF_FILTER==="ft"?"em Mesa Final":HOF_FILTER==="stages"?"em etapas":""} ainda.</div>`:""}

  ${filtered.map((h,i)=>{
    const wStages = h.wNL + h.wKO;
    const isFirst = i===0;

    // What to show based on filter
    let statMain="", statSub="";
    if(HOF_FILTER==="ft"){
      statMain = `${h.wFT}`;
      statSub = `vitória${h.wFT!==1?"s":""} FT`;
    } else if(HOF_FILTER==="stages"){
      statMain = `${wStages}`;
      statSub = `vitória${wStages!==1?"s":""} etapa`;
    } else {
      statMain = `${h.wTotal}`;
      statSub = `vitória${h.wTotal!==1?"s":""}`;
    }

    return `<div class="hfc" data-profile="${h.pl.uid}" style="cursor:pointer${isFirst?";border-color:rgba(255,215,0,.4);border-top:2px solid #FFD700":""}">
      <div class="hfr ${pcls(i)}">${i+1}</div>
      ${AV(h.pl.uid,"lg")}
      <div style="flex:1;min-width:0">
        <div class="hfn">${h.pl.name} <span style="color:var(--muted);font-size:13px;font-weight:400">"${h.pl.nickname}"</span></div>
        <div class="hfb">
          ${h.wNL>0?`<span class="hfbdg hby">🃏 ${h.wNL}</span>`:""}
          ${h.wKO>0?`<span class="hfbdg hby">🥊 ${h.wKO}</span>`:""}
          ${h.wFT>0?`<span class="hfbdg" style="background:rgba(52,152,219,.15);color:#3498db;border:1px solid rgba(52,152,219,.3)">🏆 FT ${h.wFT}</span>`:""}
          <span class="hfbdg hbg">▶ ${h.p} etapa${h.p!==1?"s":""}</span>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:var(--yellow);line-height:1">${statMain}</div>
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px">${statSub}</div>
      </div>
    </div>`;
  }).join("")}
  </div>`;
}

function isValidPlayerName(name){
  // Filter out obvious username/email accounts (no spaces, all lowercase, has special chars)
  if(!name) return false;
  const n = name.trim();
  if(n.length < 2) return false;
  return true; // show all, let admin clean up
}

      <button class="btn by fw" id="er-save">✓ Salvar</button>
      <button class="btn bo" id="er-cancel">Cancelar</button>

    DEFAULT_RULES.knockout = {...structToText(ko.st,"knockout",ko.ko.per), koValue:ko.ko.value, koPer:ko.ko.per};
    saveRules();
    wrap.innerHTML="";
    render();
  });
}

    const s = DB.stages.find(x=>x.id===BUYIN_MGMT);

    BUYIN_MGMT = null; BUYIN_PLAYER = null;
  }

  // If a stage is expanded, show detail view
  if(ADMIN_STAGE_DETAIL){
    const s = DB.stages.find(x=>x.id===ADMIN_STAGE_DETAIL);
    if(s) return renderAdminStageDetail(s);
    ADMIN_STAGE_DETAIL = null;
  }

  // Stage list
  const sorted = [...DB.stages].sort((a,b)=>a.date.localeCompare(b.date));
  return `
  <button class="btn by fw mb10" id="btn-new-stage">+ Nova Etapa</button>
  ${sorted.length===0?'<div class="empty">Nenhuma etapa.</div>':''}
  ${sorted.map(s=>`
    <div class="card" style="cursor:pointer;border-left:3px solid ${s.isFinal?"var(--blue)":s.status==="finished"?"var(--green)":"var(--yellow)"}" data-admin-stage="${s.id}">
      <div class="btw">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:#fff">
            ${s.name}${s.isFinal?" 🏆":""}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">
            ${fmtD(s.date)}${s.time?" às "+s.time:""} · ${typeLbl(s.type)}${s.location?" · "+s.location:""}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">
            ${(s.inscriptions||[]).length} inscrito${(s.inscriptions||[]).length!==1?"s":""}
            ${s.status==="finished"?" · "+(s.results||[]).length+" resultados":""}
          </div>
        </div>
        <span class="badge ${s.status==="finished"?"bdone":"bnext"}" style="flex-shrink:0">
          ${s.status==="finished"?"✓ OK":"Pendente"}
        </span>
      </div>
    </div>
  `).join("")}`;
}

let MANAGE_INS_SID = null;
let PENDING_REMOVALS = new Set();

        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;color:#fff;letter-spacing:1px">👥 GERIR INSCRIÇÕES</div>

window.openManageIns = function(sid){
  MANAGE_INS_SID = sid;
  PENDING_REMOVALS = new Set();
  const el = document.createElement("div");
  el.id = "manage-ins-wrap";
  el.innerHTML = renderManageInscriptions(sid);
  document.body.appendChild(el);
  bindManageInsEvents(sid);
};

function bindManageInsEvents(sid){
  const overlay = document.getElementById("manage-ins-overlay");
  const el = document.getElementById("manage-ins-wrap");

  document.getElementById("manage-ins-close")?.addEventListener("click",()=>{
    el?.remove(); PENDING_REMOVALS=new Set();
  });

  // Mark for removal (strikethrough)
  document.querySelectorAll("[data-remove-ins]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const uid = btn.dataset.removeIns;
      const row = document.getElementById(`manage-row-${uid}`);
      const nameEl = document.getElementById(`manage-name-${uid}`);
      if(PENDING_REMOVALS.has(uid)){
        PENDING_REMOVALS.delete(uid);
        row.style.opacity="1";
        if(nameEl) nameEl.style.textDecoration="none";
        btn.textContent="✕ Remover";
        btn.style.background="";
      } else {
        PENDING_REMOVALS.add(uid);
        row.style.opacity="0.45";
        if(nameEl) nameEl.style.textDecoration="line-through";
        btn.textContent="↺ Desfazer";
        btn.style.background="rgba(231,76,60,.2)";
      }
      updatePendingBar();
    });
  });

  // Search to add player
  const searchInput = document.getElementById("manage-ins-search");
  const resultsDiv  = document.getElementById("manage-ins-results");

  function renderSearchResults(query){
    const s = DB.stages.find(x=>x.id===sid);
    const ins = s?.inscriptions||[];
    const q = (query||"").toLowerCase().trim();
    resultsDiv.innerHTML = "";
    if(!q) return;
    const matches = DB.players
      .filter(p=>!ins.includes(p.uid))
      .filter(p=>{
        const name = (p.name||"").toLowerCase();
        const nick = (p.nickname||"").toLowerCase();
        return name.includes(q) || nick.includes(q);
      })
      .slice(0, 8);
    if(matches.length===0){
      resultsDiv.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:6px 2px">Nenhum jogador encontrado. Use "+ Criar" para adicionar.</div>`;
      return;
    }
    matches.forEach(p=>{
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:background .15s";
      row.innerHTML = `${AV(p.uid)}<div style="flex:1"><div style="font-size:13px;color:#fff;font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--muted)">"${p.nickname}"</div></div><button class="btn by sm" style="font-size:11px;padding:4px 10px;flex-shrink:0">+ Adicionar</button>`;
      row.querySelector("button").addEventListener("click", async()=>{
        const s2 = DB.stages.find(x=>x.id===sid);
        if(!s2) return;
        const newIns = [...new Set([...(s2.inscriptions||[]), p.uid])];
        row.querySelector("button").disabled=true; row.querySelector("button").textContent="...";
        try {
          const prevIns = s2.inscriptions; s2.inscriptions = newIns;
          try { await commitDB(); } catch(e){ s2.inscriptions = prevIns; throw e; }
          const ls = DB.stages.find(x=>x.id===sid);
          if(ls) ls.inscriptions=newIns;
          showToast(p.name+" inscrito ✓","green");
          el?.remove();
          STAGE_DETAIL=sid; TAB="stages"; render();
          setTimeout(()=>window.openManageIns(sid),200);
        } catch(err){ showToast("Erro: "+err.message,"red"); }
      });
      resultsDiv.appendChild(row);
    });
  }

  searchInput?.addEventListener("input", e=>renderSearchResults(e.target.value));

  // Create player without UID
  document.getElementById("manage-ins-create")?.addEventListener("click",()=>{
    const q = searchInput?.value.trim()||"";
    // Show inline create form
    const existing = document.getElementById("manage-ins-create-form");
    if(existing){ existing.remove(); return; }
    const form = document.createElement("div");
    form.id = "manage-ins-create-form";
    form.style.cssText = "margin-top:8px;padding:12px;background:var(--surface);border:1px solid var(--yellow);border-radius:4px;display:flex;flex-direction:column;gap:8px";
    form.innerHTML = `
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase">Novo Jogador (sem login)</div>
      <input class="inp" id="new-player-name" placeholder="Nome completo *" style="margin:0;font-size:13px" value="${q}"/>
      <input class="inp" id="new-player-nick" placeholder="Apelido *" style="margin:0;font-size:13px"/>
      <div id="new-player-err" style="font-size:12px;color:var(--red);display:none"></div>
      <div style="display:flex;gap:6px">
        <button id="new-player-save" class="btn by fw sm" style="font-size:13px">✓ Criar e Inscrever</button>
        <button id="new-player-cancel" class="btn bo sm" style="font-size:13px">Cancelar</button>
      </div>`;
    document.getElementById("manage-ins-results").parentNode.appendChild(form);
    document.getElementById("new-player-cancel")?.addEventListener("click",()=>form.remove());
    document.getElementById("new-player-save")?.addEventListener("click", async()=>{
      const name = document.getElementById("new-player-name")?.value.trim();
      const nick = document.getElementById("new-player-nick")?.value.trim();
      const errEl = document.getElementById("new-player-err");
      if(!name||!nick){ errEl.textContent="Nome e apelido são obrigatórios."; errEl.style.display="block"; return; }
      // Generate mock UID
      const uid = "p_"+name.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"")+"_"+Date.now().toString(36);
      const newPlayer = {uid, name, nickname:nick, email:"", season:ACTIVE_SEASON, needsSetup:false};
      const s2 = DB.stages.find(x=>x.id===sid);
      if(!s2) return;
      const newIns = [...new Set([...(s2.inscriptions||[]), uid])];
      const saveBtn = document.getElementById("new-player-save");
      saveBtn.disabled=true; saveBtn.textContent="Salvando...";
      const prevPlayers = DB.players, prevIns2 = s2.inscriptions;
      try {
        DB.players = [...DB.players, newPlayer]; s2.inscriptions = newIns;
        try { await commitDB(); } catch(e){ DB.players = prevPlayers; s2.inscriptions = prevIns2; throw e; }
        const ls = DB.stages.find(x=>x.id===sid);
        if(ls) ls.inscriptions=newIns;
        showToast(name+" criado e inscrito ✓","green");
        el?.remove();
        STAGE_DETAIL=sid; TAB="stages"; render();
        setTimeout(()=>window.openManageIns(sid),200);
      } catch(err){ showToast("Erro: "+err.message,"red"); saveBtn.disabled=false; saveBtn.textContent="✓ Criar e Inscrever"; }
    });
  });

  // Undo all
  document.getElementById("manage-ins-undo")?.addEventListener("click",()=>{
    PENDING_REMOVALS=new Set();
    document.querySelectorAll("[data-remove-ins]").forEach(btn=>{
      const uid=btn.dataset.removeIns;
      const row=document.getElementById(`manage-row-${uid}`);
      const nameEl=document.getElementById(`manage-name-${uid}`);
      row.style.opacity="1";
      if(nameEl) nameEl.style.textDecoration="none";
      btn.textContent="✕ Remover"; btn.style.background="";
    });
    updatePendingBar();
  });

  // Confirm removals
  document.getElementById("manage-ins-save")?.addEventListener("click", async()=>{
    if(PENDING_REMOVALS.size===0) return;
    const s = DB.stages.find(x=>x.id===sid);
    if(!s) return;
    const saveBtn = document.getElementById("manage-ins-save");
    saveBtn.disabled=true; saveBtn.textContent="Salvando...";
    const newIns = (s.inscriptions||[]).filter(uid=>!PENDING_REMOVALS.has(uid));
    try {
      const prevIns3 = s.inscriptions; s.inscriptions = newIns;
      try { await commitDB(); } catch(e){ s.inscriptions = prevIns3; throw e; }
      const ls=DB.stages.find(x=>x.id===sid);
      if(ls) ls.inscriptions=newIns;
      showToast(`${PENDING_REMOVALS.size} inscrito(s) removido(s) ✓`,"green");
      PENDING_REMOVALS=new Set();
      el?.remove();
      STAGE_DETAIL=sid; TAB="stages"; render();
    } catch(err){ showToast("Erro: "+err.message,"red"); saveBtn.disabled=false; saveBtn.textContent="💾 Confirmar"; }
  });
}

function updatePendingBar(){
  const bar=document.getElementById("manage-ins-pending");
  const txt=document.getElementById("manage-pending-txt");
  if(!bar) return;
  if(PENDING_REMOVALS.size>0){
    bar.style.display="block";
    const names=[...PENDING_REMOVALS].map(uid=>getP(uid)?.nickname||uid).join(", ");
    txt.textContent=`Marcado para remover: ${names}`;
  } else {
    bar.style.display="none";
  }
}

  ];
  const tabsHtml = `

    ${tabDefs.map(t=>`
    <button data-bi-tab="${t.key}" style="background:none;border:none;border-bottom:${BUYIN_TAB===t.key?"2px solid var(--yellow)":"2px solid transparent"};color:${BUYIN_TAB===t.key?"var(--yellow)":"var(--muted)"};font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;cursor:pointer;margin-bottom:-2px;white-space:nowrap;flex-shrink:0">

    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;margin-bottom:4px">💰 Financeiro</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">${s.name} · Buy-in: ${s.buyin||"—"}</div>
    ${tabsHtml}`;

  let body = "";
  if(BUYIN_TAB==="entradas")       body = renderBuyinEntradas(s);
  else if(BUYIN_TAB==="custos")    body = renderBuyinCustos(s);
  else if(BUYIN_TAB==="premiacao") body = renderBuyinPremiacao(s);

  return `<div class="sec">${header}${body}</div>`;
}

    <div style="display:flex;gap:8px;margin-bottom:8px">

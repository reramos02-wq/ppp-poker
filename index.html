<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0e0e0e"/>
<meta name="description" content="PPP Poker — Gestão de torneios de poker"/>
<title>PPP Poker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1a1a1a;--bg-dark:#0e0e0e;--surface:#222;--surface2:#2c2c2c;--border:#333;--border2:#3e3e3e;--yellow:#F5A800;--yl:#FFD166;--gray:#808080;--text:#dedede;--muted:#666;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg-dark);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
#result-modal{position:fixed;inset:0;z-index:999;pointer-events:none;}
#result-modal:not(:empty){pointer-events:all;}
#admin-modal{position:fixed;inset:0;z-index:998;pointer-events:none;}
#admin-modal:not(:empty){pointer-events:all;}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px;}

/* HEADER */
.hdr{background:var(--bg-dark);border-bottom:2px solid var(--yellow);padding:10px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;}
.hl{display:flex;align-items:center;gap:10px;}
.hn{font-family:'Barlow Condensed',sans-serif;font-weight:900;line-height:1;}
.hn .p1{color:#fff;font-size:20px;}.hn .p2{color:#808080;font-size:20px;}.hn .p3{color:#F5A800;font-size:20px;}.hn .pk{color:#fff;font-size:14px;letter-spacing:2px;margin-left:4px;}
.hsb{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px;}
.hbdg{background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;padding:4px 10px;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:2px;}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-dark);border-top:2px solid var(--yellow);display:flex;z-index:200;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 10px;gap:3px;cursor:pointer;border:none;border-top:2px solid transparent;margin-top:-2px;background:none;color:var(--muted);transition:color .15s,border-color .15s;font-family:'Barlow Condensed',sans-serif;}
.nb.on{color:var(--yellow);border-top-color:var(--yellow);}
.ni{font-size:17px;line-height:1;}.nl{font-size:8px;letter-spacing:1px;text-transform:uppercase;font-weight:700;}

/* MORE MENU */
.nb-more{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 10px;gap:3px;cursor:pointer;border:none;border-top:2px solid transparent;margin-top:-2px;background:none;color:var(--muted);transition:color .15s,border-color .15s;font-family:'Barlow Condensed',sans-serif;position:relative;}
.nb-more.on{color:var(--yellow);border-top-color:var(--yellow);}
.nb-more.menu-open{color:var(--yellow);border-top-color:var(--yellow);}
.more-icon{font-size:20px;line-height:1;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;height:20px;}
.more-icon span{display:block;width:16px;height:2px;background:currentColor;border-radius:1px;transition:all .2s;}
.more-menu{position:fixed;bottom:76px;right:0;left:0;margin:0 auto;max-width:480px;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;overflow:hidden;z-index:199;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);pointer-events:none;}
.more-menu.open{transform:translateY(0);pointer-events:all;}
.more-menu-backdrop{position:fixed;inset:0;z-index:198;background:rgba(0,0,0,0);pointer-events:none;transition:background .25s;}
.more-menu-backdrop.open{background:rgba(0,0,0,.5);pointer-events:all;}
.more-menu-handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:10px auto 6px;}
.more-menu-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:4px 20px 12px;}
.more-item{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;transition:background .15s;border-top:1px solid var(--border);}
.more-item:active{background:var(--surface2);}
.more-item.active-item{background:rgba(245,168,0,.06);}
.more-item-icon{font-size:22px;width:28px;text-align:center;flex-shrink:0;}
.more-item-info{flex:1;}
.more-item-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px;color:#fff;}
.more-item-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.more-item-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0;}
.more-safe{height:env(safe-area-inset-bottom,0px);background:var(--surface);}

/* SECTIONS */
.sec{padding:18px 16px;}
@keyframes fu{from{opacity:0}to{opacity:1}}
.st{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;letter-spacing:1px;color:#fff;text-transform:uppercase;margin-bottom:2px;}
.ac{color:var(--yellow);}
.ss{color:var(--muted);font-size:13px;margin-bottom:14px;}
.dv{width:32px;height:3px;background:var(--yellow);margin-bottom:16px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px;margin-bottom:10px;}
.cy{border-left:3px solid var(--yellow);}.cg{border-left:3px solid var(--green);}.cr{border-left:3px solid var(--red);}

/* TABS */
.tabs{display:flex;margin-bottom:14px;border:1px solid var(--border);border-radius:2px;overflow:hidden;}
.tb{flex:1;padding:9px 4px;text-align:center;cursor:pointer;border:none;background:var(--surface);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .15s;}
.tb.on{background:var(--yellow);color:#000;}

/* RANK LIST */
.rl{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.rr{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);position:relative;}
.rr:last-child{border-bottom:none;}
.rpos{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.rp1{color:#FFD700;font-size:22px;}.rp2{color:#C0C0C0;font-size:20px;}.rp3{color:#CD7F32;font-size:18px;}.rpx{color:var(--muted);font-size:14px;}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--yellow);font-family:'Barlow Condensed',sans-serif;flex-shrink:0;}
.avlg{width:52px;height:52px;font-size:15px;border-width:2px;}
.avxl{width:64px;height:64px;font-size:18px;border:3px solid var(--yellow);}
.ri{flex:1;min-width:0;overflow:visible;}
.rn{font-size:14px;color:#fff;font-weight:600;white-space:nowrap;overflow:visible;}
.rm{font-size:11px;color:var(--muted);margin-top:1px;}
.rv{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--yellow);}
.rvl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

/* STAGES */
.sgc{background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:10px;overflow:hidden;}
.sgh{padding:12px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
.sgh:active{background:var(--surface2);}
.sgn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:#fff;}
.sgm{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6;}
.sgr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.sgb{border-top:1px solid var(--border);padding:12px 13px;}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;padding:3px 8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.bdone{background:rgba(231,76,60,.1);color:var(--red);border:1px solid rgba(231,76,60,.25);}
.bnext{background:rgba(46,204,113,.1);color:var(--green);border:1px solid rgba(46,204,113,.25);}
.bfuture{background:rgba(245,168,0,.1);color:var(--yellow);border:1px solid rgba(245,168,0,.25);}
.bfin{background:rgba(52,152,219,.12);color:var(--blue);border:1px solid rgba(52,152,219,.25);}
.resrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1c1c1c;font-size:13px;}
.resrow:last-child{border-bottom:none;}
.respos{width:22px;text-align:center;color:var(--muted);font-size:11px;font-family:'Barlow Condensed',sans-serif;}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.chip{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:4px 10px 4px 5px;font-size:12px;color:var(--text);}

/* PLAYERS GRID */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pcrd{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px 12px;text-align:center;cursor:pointer;transition:border-color .15s;}
.pcrd:active{border-color:var(--yellow);}
.pn{font-size:13px;font-weight:600;color:#fff;margin-top:8px;}
.pk2{font-size:12px;color:var(--muted);margin-top:2px;}
.psg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.ps{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:10px 8px;text-align:center;}
.psv{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--yellow);}
.psl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

/* HOF */
.hfc{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.hfr{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;width:32px;text-align:center;flex-shrink:0;}
.hfn{font-size:15px;color:#fff;font-weight:600;}
.hfb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.hfbdg{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:3px 8px;border-radius:2px;}
.hby{background:rgba(245,168,0,.15);color:var(--yellow);border:1px solid rgba(245,168,0,.3);}
.hbg{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.25);}

/* POINTS TABLE */
.ptable{width:100%;border-collapse:collapse;font-size:13px;}
.ptable th{background:var(--surface2);color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
.ptable td{padding:7px 10px;border-bottom:1px solid #1c1c1c;color:var(--text);}
.ptable tr:last-child td{border-bottom:none;}

/* HERO */
.hero{background:var(--bg-dark);border-bottom:1px solid var(--border);padding:24px 18px 22px;position:relative;overflow:hidden;}
.hero::after{content:'';}
.hppp{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:52px;line-height:1;letter-spacing:6px;margin-bottom:4px;}
.hppp .h1{color:#fff;}.hppp .h2{color:#808080;}.hppp .h3{color:#F5A800;}
.hpsub{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:5px;color:var(--muted);text-transform:uppercase;margin-bottom:18px;}
.hsts{display:flex;gap:10px;}
.hst{flex:1;background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--yellow);padding:10px 8px;text-align:center;border-radius:2px;}
.hsv{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;color:var(--yellow);}
.hsl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px;}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.ov-center{align-items:center;}
.modal{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--yellow);padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.mtitle{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}

/* ADMIN */
.atag{background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;letter-spacing:1px;}
.urow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);}
.urow:last-child{border-bottom:none;}
.rbdg{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;letter-spacing:1px;text-transform:uppercase;}
.rm2{background:rgba(255,215,0,.15);color:#FFD700;border:1px solid rgba(255,215,0,.3);}
.ru{background:rgba(128,128,128,.12);color:var(--muted);border:1px solid rgba(128,128,128,.2);}


/* BUTTONS */
.btn{padding:9px 18px;border-radius:2px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.by{background:var(--yellow);color:#000;}.bo{background:transparent;border:1px solid var(--border2);color:var(--text);}
.bd{background:transparent;border:1px solid rgba(231,76,60,.4);color:var(--red);}
.br{background:var(--red);color:#fff;}
.sm{padding:6px 12px;font-size:12px;}.fw{width:100%;}

/* INPUTS */
.inp{background:var(--surface2);border:1px solid var(--border2);border-radius:2px;color:var(--text);padding:9px 12px;font-family:'Barlow',sans-serif;font-size:14px;width:100%;transition:border-color .15s;}
.inp:focus{outline:none;border-color:var(--yellow);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}
select.inp{appearance:none;}
.lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.fr{margin-bottom:11px;}

/* UTILS */
.row{display:flex;}.btw{display:flex;justify-content:space-between;align-items:center;}
.g8{gap:8px;}.mt16{margin-top:16px;}.mt12{margin-top:12px;}.mt8{margin-top:8px;}
.mb16{margin-bottom:16px;}.mb10{margin-bottom:10px;}
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:15px;}

3.0 581 466.5 575 467.0 567C465.0 569.5 461.0 571 457.0 571C447.0 571 437.0 564 437.0 551C437.0 531 459.0 517 469.0 505Z%22 fill=%22%23888%22 fill-rule=%22evenodd%22/%3E%3C/svg%3E");}
.hero{isolation:isolate;}
.hero::after{content:"";position:absolute;right:-30px;bottom:-26px;width:260px;height:140px;background:var(--wm) center/contain no-repeat;opacity:.022;z-index:-1;pointer-events:none;}
.empty::before{content:"";display:block;width:76px;height:41px;margin:0 auto 14px;background:var(--wm) center/contain no-repeat;opacity:.08;}
.sep{height:1px;background:var(--border);margin:14px 0;}
.pill{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 7px;letter-spacing:1px;border-radius:2px;}
.py{background:rgba(245,168,0,.15);color:var(--yellow);}
.hidden{display:none!important;}

/* ── RESPONSIVE: TABLET & DESKTOP (≥768px) ── */
@media(min-width:768px){
  html:not(.pl) body{background:var(--bg);}

  /* Layout shell */
  html:not(.pl) #app{max-width:100%;padding-bottom:0;display:flex;min-height:100vh;}

  /* Sidebar */
  html:not(.pl) .sidebar{
    width:240px;flex-shrink:0;
    background:var(--bg-dark);
    border-right:2px solid var(--yellow);
    position:fixed;top:0;left:0;bottom:0;
    display:flex;flex-direction:column;
    z-index:200;overflow-y:auto;
  }
  html:not(.pl) .sb-logo{
    display:flex;align-items:center;gap:10px;
    padding:20px 18px 16px;
    border-bottom:1px solid var(--border);
  }
  html:not(.pl) .sb-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;line-height:1;}
  html:not(.pl) .sb-title .p1{color:#fff;font-size:22px;}
  html:not(.pl) .sb-title .p2{color:#808080;font-size:22px;}
  html:not(.pl) .sb-title .p3{color:#F5A800;font-size:22px;}
  html:not(.pl) .sb-title .pk{color:#fff;font-size:15px;letter-spacing:2px;margin-left:4px;}
  html:not(.pl) .sb-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px;}
  html:not(.pl) .sb-nav{flex:1;padding:12px 0;}
  html:not(.pl) .sb-section-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:10px 18px 6px;}
  html:not(.pl) .sb-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 18px;cursor:pointer;
    border:none;background:none;width:100%;text-align:left;
    color:var(--muted);font-family:'Barlow Condensed',sans-serif;
    font-size:15px;font-weight:700;letter-spacing:.5px;
    transition:all .15s;border-left:3px solid transparent;
  }
  html:not(.pl) .sb-item:hover{color:var(--text);background:var(--surface);}

<style id="ui-refresh">
/* ═══ UI REFRESH ═══ camada de acabamento por cima do CSS base (remover este bloco volta ao visual anterior) */
:root{
  --bg-dark:#0b0b0d; --bg:#111114; --surface:#18181c; --surface2:#212126;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
body{background:var(--bg-dark);text-rendering:optimizeLegibility;}
.pi{--cut:var(--surface);}

:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px;}
button,[data-goto],[data-detail],.more-item,.sgh,.pcrd{-webkit-user-select:none;user-select:none;}

/* ── tipografia ── */
.st,.mtitle,.login-title,.topbar-title,.tb-title,.hfr,.sgn,.more-item-label,.sb-season{font-family:var(--f-d);}
.st{font-weight:800;font-size:27px;letter-spacing:.005em;line-height:1.08;}
.mtitle{font-weight:800;font-size:19px;letter-spacing:.01em;}
.sgn{font-weight:700;font-size:16.5px;letter-spacing:.005em;}
.ss{color:var(--muted);font-size:13.5px;}
.hsv,.rv,.psv,.rpos,.podium-pts,.podium-base,.hfr,.rvl{font-family:var(--f-d);font-variant-numeric:tabular-nums;}
.hsv{font-weight:800;font-size:27px;letter-spacing:-.01em;}
.rv{font-weight:800;font-size:21px;letter-spacing:-.01em;}
.psv{font-weight:800;}
.rpos{font-weight:800;}
.lbl,.badge,.pill,.rbdg,.atag,.hfbdg,.tb,.ltb,.btn,.nl,.hpsub,.hsl,.psl,.sb-lbl,.more-menu-title,.live-badge{font-family:var(--f-d);}
.lbl{font-weight:600;letter-spacing:.09em;font-size:10.5px;}
.hsl,.psl,.rvl{letter-spacing:.09em;font-weight:600;}
.hpsub{letter-spacing:.32em;font-size:11px;font-weight:500;}
.dv{width:28px;height:3px;border-radius:3px;margin-bottom:18px;}

/* ── cabeçalho e navegação: vidro escuro + fio de ouro em degradê (sem barras amarelas chapadas) ── */
.hdr{background:rgba(11,11,13,.8);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--border);position:sticky;}
.hdr::after,html:not(.pl) .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(248,183,11,.65) 18%,rgba(248,183,11,.65) 82%,transparent);pointer-events:none;}
html:not(.pl) .topbar{background:rgba(11,11,13,.8);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);}
html:not(.pl) .topbar-title,.tb-title{font-weight:800;font-size:20px;letter-spacing:.02em;}
.nav{background:rgba(11,11,13,.86);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);}
.nb,.nb-more{border-top:none;margin-top:0;padding:8px 2px 8px;gap:4px;color:var(--muted);transition:color .18s var(--ease);}
.nb .ni,.nb-more .more-icon{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s var(--ease),transform .15s var(--ease);}
.more-icon{flex-direction:column;gap:3px;}
.nb.on .ni,.nb-more.on .more-icon,.nb-more.menu-open .more-icon{background:rgba(248,183,11,.16);}
.nb:active .ni,.nb-more:active .more-icon{transform:scale(.92);}
.nb.on,.nb-more.on,.nb-more.menu-open{border-top:none;color:var(--yellow);}
.nl{font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:none;}
.more-menu{bottom:var(--nav-h);border-radius:20px 20px 0 0;background:rgba(24,24,28,.96);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:0 -24px 48px -24px rgba(0,0,0,.8);transition:transform .3s var(--ease),visibility 0s linear .3s;visibility:hidden;}
.more-menu.open{visibility:visible;transition:transform .3s var(--ease),visibility 0s;}
.more-menu-backdrop.open{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.more-menu-handle{width:38px;height:4px;background:var(--border2);margin:10px auto 4px;}
.more-menu-title{font-weight:600;letter-spacing:.14em;padding:6px 20px 8px;}
.more-item{border-top:1px solid var(--border);padding:13px 20px;gap:14px;transition:background .15s;}
.more-item-icon{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;}
.more-item-label{font-weight:700;font-size:15.5px;letter-spacing:.005em;}
.more-item-sub{font-size:12.5px;}
.more-item.active-item{background:rgba(248,183,11,.07);}
.more-item.active-item .more-item-icon{background:rgba(248,183,11,.16);color:var(--yellow);}
.more-item.install .more-item-icon{background:var(--yellow);color:#111;}
.more-item.install .more-item-label{color:var(--yellow);}

/* ── superfícies: cartões com relevo suave, cantos maiores, sem listras laterais chapadas ── */
.card,.rl,.sgc,.pcrd,.hfc,.hst,.ps,.tabs,.login-tabs{border-radius:var(--r);}
.card,.rl,.sgc,.pcrd,.hfc,.hst,.ps{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),var(--surface);
  border:1px solid var(--border);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 24px -16px rgba(0,0,0,.7);
}
.card{padding:15px;}
.cy,.cg,.cr{border-left:1px solid var(--border);position:relative;}
.cy::before,.cg::before,.cr::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--yellow);}
.cg::before{background:var(--green);}.cr::before{background:var(--red);}
.hst{border-top:1px solid var(--border);padding:12px 8px;}
.hst .hsv{color:#fff;}
.hero{background:radial-gradient(120% 90% at 0% 0%,rgba(248,183,11,.07),transparent 55%),var(--bg-dark);border-bottom:1px solid var(--border);}
.rr{border-bottom:1px solid var(--border);transition:background .15s;}
.rr:active,.sgh:active,.pcrd:active{background:var(--surface2);}
.rr:first-child{background:linear-gradient(90deg,rgba(248,183,11,.08),transparent 60%);}
.av{border:1.5px solid var(--border2);}
.avxl{border:2px solid var(--yellow);}
.pcrd{transition:transform .15s var(--ease),border-color .15s;}
.pcrd:active{transform:scale(.98);}
.sgc{transition:border-color .2s;}
.sgh{padding:14px;}
.sgb{border-top:1px solid var(--border);}
.sep{background:var(--border);}
.resrow,.ptable td{border-bottom:1px solid var(--border);}
.ptable th{background:var(--surface2);font-weight:600;letter-spacing:.08em;}
.empty{color:var(--muted);}

/* ── tabs (controle segmentado) ── */
.tabs,.login-tabs{background:var(--bg-dark);border:1px solid var(--border);padding:3px;gap:3px;overflow:hidden;}
.tb,.ltb{border-radius:9px;background:transparent;color:var(--muted);font-weight:700;letter-spacing:.05em;transition:background .18s var(--ease),color .18s;}
.tb.on,.ltb.on{background:var(--yellow);color:#111;box-shadow:0 4px 12px -4px rgba(248,183,11,.5);}

/* ── selos / badges em pílula, mais calmos ── */
.badge,.pill,.rbdg,.hfbdg,.atag,.live-badge{border-radius:999px;padding-left:9px;padding-right:9px;letter-spacing:.07em;font-weight:700;}
.atag{padding:3px 9px;}
.hbdg{border-radius:999px;font-family:var(--f-d);}

/* ── botões e campos ── */
.btn{border-radius:10px;font-weight:700;letter-spacing:.06em;font-size:13px;transition:transform .12s var(--ease),filter .15s,background .15s,border-color .15s,box-shadow .15s;}
.btn:active{transform:scale(.97);}
.by{background:var(--yellow);color:#111;box-shadow:0 6px 16px -8px rgba(248,183,11,.7),0 1px 0 rgba(255,255,255,.35) inset;}
.by:hover{filter:brightness(1.07);}
.bo{border:1px solid var(--border2);background:rgba(255,255,255,.02);}
.bo:hover{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.05);}
.bd{border-radius:10px;}
.sm{padding:6px 12px;}
.inp{background:var(--bg-dark);border:1px solid var(--border2);border-radius:10px;padding:10px 13px;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(248,183,11,.16);}
.inp::placeholder{color:#5f5f69;}
.google-btn{border-radius:10px;}

/* ── modais ── */
.ov{background:rgba(5,5,7,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.modal{border:1px solid var(--border);border-top:1px solid var(--border2);border-radius:20px 20px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.9);animation:sheetUp .32s var(--ease) both;}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
html:not(.pl) .modal{border-radius:18px;}
.login-box{border-radius:18px;}
@media(min-width:768px){.login-box{border-top:1px solid var(--border2);border-radius:18px;}}
.err-msg{border-radius:10px;}

/* ── barra lateral (tablet/desktop) ── */
html:not(.pl) .sidebar{border-right:1px solid var(--border);background:linear-gradient(180deg,#0e0e11,#0b0b0d);}
html:not(.pl) .sb-item{border-left:none;border-radius:10px;margin:2px 12px;width:calc(100% - 24px);padding:10px 12px;font-family:var(--f-d);font-weight:600;font-size:14px;letter-spacing:.01em;transition:background .15s,color .15s;}
html:not(.pl) .sb-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
html:not(.pl) .sb-item.on,html:not(.pl) .sb-item.active{background:rgba(248,183,11,.13);color:var(--yellow);border-left:none;}
html:not(.pl) .sb-item .sb-icon,html:not(.pl) .sb-item-icon{width:22px;}
html:not(.pl) .rr:hover,html:not(.pl) .sgh:hover{background:var(--surface2);}
html:not(.pl) .pcrd:hover{border-color:rgba(248,183,11,.5);transform:translateY(-1px);}
html:not(.pl) .hst{padding:16px 10px;}
html:not(.pl) .hsv{font-size:32px;}
.sb-install{margin:10px 12px 0;}

/* ── pódio ── */
.podium-base{border-radius:8px 8px 0 0;}
.podium-photo{border-width:2px;}

/* ── movimento respeitando preferência do sistema ── */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* ── ajustes finos: banner da premiação, pontos lado a lado, sidebar sem logo repetido ── */
.ft-prize{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;margin-bottom:14px;cursor:pointer;color:inherit;font:inherit;
  border:1px solid rgba(255,210,94,.42);border-radius:var(--r);background:linear-gradient(135deg,rgba(248,183,11,.17),rgba(248,183,11,.04));transition:transform .12s var(--ease),border-color .15s;}
.ft-prize:active{transform:scale(.985);}
.ft-prize:hover{border-color:rgba(255,210,94,.7);}
.ft-prize-ic{font-size:22px;line-height:1;flex-shrink:0;}
.ft-prize-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ft-prize-t{font-family:var(--f-d);font-weight:800;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:#FFD25E;line-height:1.2;}
.ft-prize-s{font-size:11.5px;color:var(--muted);}
.ft-prize-v{font-family:var(--f-d);font-weight:800;font-size:19px;color:#FFD25E;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}
.rvw{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;white-space:nowrap;flex-shrink:0;}
.rvw .rv{line-height:1;}
.rvl{text-transform:lowercase;font-size:11px;letter-spacing:.02em;font-weight:600;color:var(--muted);}

/* ── estatísticas ── */
.stx-bn{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;margin-top:16px;cursor:pointer;color:inherit;font:inherit;
  border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);transition:transform .12s var(--ease),border-color .15s;}
.stx-bn:active{transform:scale(.985);}
.stx-bn:hover{border-color:rgba(248,183,11,.5);}
.stx-bn-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 80%);mask-image:linear-gradient(90deg,transparent 30%,#000 80%);}
.stx-bn>.stx-ic,.stx-bn>.stx-tx,.stx-bn>.stx-go{position:relative;}
.stx-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(248,183,11,.14);color:var(--yellow);border:1px solid rgba(248,183,11,.32);}
.stx-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.stx-t{font-family:var(--f-d);font-weight:800;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:#fff;line-height:1.2;}
.stx-s{font-size:11.5px;color:var(--muted);}
.stx-go{margin-left:auto;color:var(--muted);font-size:22px;line-height:1;}
.stx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.stx-h{font-family:var(--f-d);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);margin-bottom:10px;}
.stx-sub{font-size:12px;color:var(--muted);margin:-6px 0 8px;}
.stx-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.stx-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.stx-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.stx-chip i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35;}
.stx-chip.on{color:#fff;border-color:var(--c);background:rgba(255,255,255,.05);}
.stx-chip.on i{opacity:1;}
.stx-link{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px 6px;}
.stx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;}
.stx-scroll svg{display:block;}
.stx-hit{cursor:pointer;}
.stx-tip{min-height:40px;margin-top:8px;padding:9px 11px;border-radius:8px;background:var(--surface2);font-size:12.5px;line-height:1.45;color:var(--text);}
.stx-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);cursor:pointer;}
.stx-row:first-of-type{border-top:0;}
.stx-n{flex:0 0 30%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px;color:#fff;}
.stx-bar{flex:1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;}
.stx-bar b{display:block;height:100%;background:var(--yellow);border-radius:99px;}
.stx-val{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
.stx-picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.stx-pick{padding:6px 12px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.stx-pick:active{transform:scale(.96);}
.stx-pick.clr{background:transparent;color:var(--muted);}
.stx-search{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border2);border-radius:10px;background:var(--bg-dark);color:var(--muted);}
.stx-search:focus-within{border-color:var(--yellow);color:var(--yellow);}
.stx-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:11px 0;}
.stx-res-wrap:empty{display:none;}
.stx-res-wrap{margin-top:8px;border:1px solid var(--border2);border-radius:10px;overflow:hidden;background:var(--surface2);}
.stx-resh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);}
.stx-resl{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.stx-res{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer;}
.stx-res i{width:10px;height:10px;border-radius:50%;flex-shrink:0;opacity:.4;}
.stx-res.on i{opacity:1;}
.stx-res.on{background:rgba(255,255,255,.05);color:#fff;}
.stx-rk{flex:0 0 34px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.stx-rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.stx-ck{flex:0 0 auto;color:var(--yellow);font-weight:800;}
.stx-selh{margin:12px 0 0;font-size:12px;color:var(--muted);}
.stx-selh b{color:#fff;}
.stx-chips{max-height:92px;overflow-y:auto;}
.stx-chip em{font-style:normal;opacity:.55;margin-left:2px;}
.stx-none{font-size:13px;color:var(--muted);padding:10px 12px;}
.stx-more{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border2);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.stx-more:active{transform:scale(.985);}
.stx-bar{display:flex;}
.stx-bar b:first-child{border-radius:99px 0 0 99px;}
.stx-bar b:last-child{border-radius:0 99px 99px 0;}
.stx-bar b:only-child{border-radius:99px;}
.stf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stf-l{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.stf-l i{font-style:normal;text-transform:none;letter-spacing:0;opacity:.7;font-weight:400;}
.stf-w{position:relative;}
.stf-w .inp{width:100%;box-sizing:border-box;}
.stf-pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.stf-suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none;white-space:nowrap;}
.stf-hp{padding-left:36px!important;}
.stf-hs{padding-right:84px!important;}
.stf-prev{margin:4px 0 14px;padding:10px 12px;border-radius:10px;background:var(--bg-dark);border:1px dashed var(--border2);font-size:12.5px;line-height:1.6;color:var(--muted);}
.stf-prev b{color:#fff;font-weight:600;}
.stf-pt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;}
.rcp{margin-bottom:14px;padding:16px;border-radius:var(--r);border:1px solid rgba(248,183,11,.4);background:linear-gradient(160deg,rgba(248,183,11,.13),rgba(248,183,11,.02) 55%),var(--surface);}
.rcp-h{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;}
.rcp-t{font-family:var(--f-d);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);}
.rcp-s{font-family:var(--f-d);font-weight:800;font-size:17px;color:#fff;line-height:1.2;}
.rcp-pods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.rcp-pod{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--surface2);border-top:3px solid var(--m);min-width:0;}
.rcp-m{font-family:var(--f-d);font-weight:800;font-size:12px;color:var(--m);}
.rcp-pn{font-weight:700;font-size:13.5px;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rcp-pp{font-size:11.5px;color:var(--muted);}
.rcp-prize{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(248,183,11,.12);border:1px solid rgba(248,183,11,.35);margin-bottom:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#FFD25E;}
.rcp-prize b{font-family:var(--f-d);font-size:18px;letter-spacing:0;text-transform:none;}
.rcp-prize small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-align:right;}
.rcp-lds{display:grid;gap:6px;margin-bottom:10px;}
.rcp-ld{display:flex;align-items:baseline;gap:8px;font-size:13.5px;}
.rcp-ld>span:first-child{flex:0 0 78px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.rcp-ld b{color:#fff;}
.rcp-ld em{font-style:normal;color:var(--yellow);}
.rcp-dim{color:var(--muted);}
.rcp-row{display:flex;flex-direction:column;gap:2px;font-size:13px;margin-bottom:8px;color:var(--text);}
.rcp-k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.rcp-facts{font-size:12px;color:var(--muted);margin:4px 0 12px;line-height:1.5;}
.rcp-btn{font-size:14px;}
.stx-mvl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;}

// ── LIVE & RANKING MOVEMENT HELPERS ──────────────────────────────────────────
function getLiveStage(){
  // A stage is LIVE if: status=upcoming, date=today, time has been reached
  // Pick the EARLIEST upcoming stage that has passed its start time
  const now = new Date();
  const candidates = [...DB.stages].filter(s=>{
    if(s.status !== "upcoming") return false;
    if(!s.date || !s.time) return false;
    const [y,m,d] = s.date.split("-").map(Number);
    const [h,mi]  = s.time.split(":").map(Number);
    const stageStart = new Date(y, m-1, d, h, mi, 0);
    return now >= stageStart;
  });
  // Sort by date ascending, return the first (most overdue)
  candidates.sort((a,b)=>a.date.localeCompare(b.date));
  return candidates[0] || null;
}

function isLive(stage){
  if(!stage || stage.status !== "upcoming") return false;
  if(!stage.date || !stage.time) return false;
  const now = new Date();
  const [y,m,d] = stage.date.split("-").map(Number);
  const [h,mi]  = stage.time.split(":").map(Number);
  return now >= new Date(y, m-1, d, h, mi, 0);
}

// Always returns the earliest upcoming stage by date — single source of truth
function getNextStage(){
  const live = getLiveStage();
  if(live) return live;
  return DB.stages
    .filter(s=>s.status==="upcoming")
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""))[0] || null;
}

function shouldShowMovement(){
  const now = new Date();
  // Check if there's a live stage
  const live = getLiveStage();
  if(live) return true;
  // Check if last finished stage was recent enough
  const lastFinished = [...DB.stages].filter(s=>s.status==="finished")
    .sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!lastFinished) return false;
  // Hide 48h BEFORE next upcoming stage (not after)
  const nextStage = [...DB.stages].filter(s=>s.status==="upcoming").sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(nextStage && nextStage.date && nextStage.time){
    const [y,m,d] = nextStage.date.split("-").map(Number);
    const [h,mi]  = nextStage.time.split(":").map(Number);
    const nextStart = new Date(y, m-1, d, h, mi, 0);
    const diffHours = (nextStart - now) / (1000*60*60);
    // Only hide if next stage is in less than 48h AND hasn't started yet
    if(diffHours > 0 && diffHours <= 48) return false;
  }
  return true;
}

function calcRankingMovement(type){
  // Returns map of uid → {prev, curr, delta}
  // Uses the SAME calcRank/calcRankGeral functions the app uses
  // to guarantee consistency with the displayed ranking

  const live = getLiveStage();
  const lastFinished = [...DB.stages]
    .filter(s=>s.status==="finished")
    .sort((a,b)=>b.date.localeCompare(a.date))[0];
  const targetStage = live || lastFinished;
  if(!targetStage) return {};

  const t = type||"geral";

  // Temporarily hide targetStage from DB to calculate "before" ranking
  const savedResults   = targetStage.results;
  const savedStatus    = targetStage.status;
  const savedDraft     = targetStage.draft;

  // ── BEFORE: remove targetStage results ──────────────────────────────────
  targetStage.results = [];
  targetStage.status  = "upcoming"; // hide from finished filter
  targetStage.draft   = null;

  let before;
  if(t==="geral")       before = calcRankGeral();
  else if(t==="nlholdem") before = calcRank("nlholdem");
  else                   before = calcRank("knockout");

  // ── AFTER: restore targetStage ───────────────────────────────────────────
  targetStage.results = savedResults;
  targetStage.status  = savedStatus;
  targetStage.draft   = savedDraft;

  // For live stage, inject draft into results temporarily
  if(live && live.status==="upcoming" && (live.draft||[]).length){
    targetStage.results = (live.draft||[]).map(r=>({
      playerId:r.uid, position:r.pos,
      points:getPts(r.pos), knockouts:r.ko||0
    }));
    targetStage.status = "finished";
  }

  let after;
  if(t==="geral")       after = calcRankGeral();
  else if(t==="nlholdem") after = calcRank("nlholdem");
  else                   after = calcRank("knockout");

  // Restore live stage
  if(live && live.status==="upcoming"){
    targetStage.results = savedResults;
    targetStage.status  = savedStatus;
    targetStage.draft   = savedDraft;
  }

  // Build movement map
  const beforeMap = {};
  before.forEach((r,i)=>{ beforeMap[r.p.uid] = i+1; });

  const movement = {};
  after.forEach((r,i)=>{
    const curr = i+1;
    const prev = beforeMap[r.p.uid] || null;
    // delta > 0 = moved UP (smaller rank number = better position)
    const delta = prev ? prev - curr : 0;
    movement[r.p.uid] = {prev, curr, delta};
  });
  return movement;
}

  if(!shouldShowMovement()) return "";

  return `<span style="color:#e74c3c;font-size:9px;font-weight:700;margin-left:3px;white-space:nowrap">▼${Math.abs(m.delta)}</span>`;
}

// ── BUY-IN MANAGEMENT HELPERS ────────────────────────────────────────────────
// Extract first R$ amount from strings like "R$ 150 (20k fichas)"
// Número no formato brasileiro: "1.500,50" → 1500.5 · "1.500" → 1500 · "12,5" → 12.5 · "100" → 100
const parsePtNum = (s) => {
  s = String(s||"").trim();
  if(!s) return 0;
  let n;
  if(s.includes(",")) n = s.replace(/\./g,"").replace(",",".");          // vírgula = decimal; pontos = milhar
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) n = s.replace(/\./g,"");      // só pontos de milhar
  else n = s;
  const v = parseFloat(n);
  return Number.isFinite(v) ? v : 0;
};
const parseBRL = str => {
  if(!str) return 0;
  const m = String(str).match(/R\$\s*([\d.,]+)/);
  return m ? parsePtNum(m[1]) : 0;
};

// Parse chip count from strings like "R$ 150 (20k fichas)" → 20000
const parseChips = str => {
  if(!str) return 0;
  const m = String(str).match(/\((\d+(?:[.,]\d+)?)k/i);
  if(m) return parsePtNum(m[1])*1000;
  const m2 = String(str).match(/(\d+(?:[.,]\d+)*)\s*fichas/i);
  if(m2) return parsePtNum(m2[1]);
  return 0;
};

// Nome exibido do formato (o valor interno continua "knockout" para não quebrar etapas já salvas)

// Ninguém mais digita o texto à mão; ao abrir uma etapa antiga, o texto é lido de volta para os campos.
const stFmtMoney = v => { v = Number(v)||0; return Number.isInteger(v) ? String(v) : String(+v.toFixed(2)).replace(".",","); };
const stFmtK = v => String(+(Number(v)||0).toFixed(2)).replace(".",",");
function stTypeIsPKO(type){ return type==="knockout"; }
// st = {buyin:{v,k}, rs:{v,k}, rd:{v,k}, addon:{v,k}, tc:{on,k,lvl}}  (v = R$, k = fichas em milhares)
// per = KOs por entrada (só PKO): entra no texto das regras, ex.: "20k fichas + 4 KOs" e "20k+4KO"
function structToText(st, type, per){
  const isKO = stTypeIsPKO(type), n = Math.round(Number(per)||0);
  const tagBuy = !isKO ? "" : n>0 ? ` + ${n} KO${n>1?"s":""}` : " + KO";
  const tagRe  = !isKO ? "" : n>0 ? `+${n}KO` : "+KO";
  const buyin = `R$ ${stFmtMoney(st.buyin.v)} (${stFmtK(st.buyin.k)}k fichas${tagBuy})`;
  const part = o => `R$ ${stFmtMoney(o.v)} (${stFmtK(o.k)}k${tagRe})`;
  const rebuy = st.rs.v>0 ? (st.rd.v>0 ? `${part(st.rs)} / ${part(st.rd)}` : part(st.rs)) : "—";
  const addon = st.addon.v>0 ? `R$ ${stFmtMoney(st.addon.v)} (${stFmtK(st.addon.k)}k fichas)` : "—";
  const timechip = st.tc.on ? `${stFmtK(st.tc.k)}k início ${Math.max(1,Math.round(st.tc.lvl))}º nível` : "—";
  return {buyin, rebuy, addon, timechip};
}
function textToStruct(r){
  r = r || {};
  const one = t => ({v:parseBRL(t), k:parseChips(t)/1000});
  const parts = String(r.rebuy||"").split("/").map(x=>x.trim());
  const rs = one(parts[0]||""), rd = parts[1] ? one(parts[1]) : {v:0,k:0};
  const tcTxt = String(r.timechip||"");
  const m = tcTxt.match(/(\d+(?:[.,]\d+)?)\s*k/i), lv = tcTxt.match(/(\d+)\s*[º°o]\s*n[ií]vel/i);
  const tc = m ? {on:true, k:parsePtNum(m[1]), lvl: lv ? Number(lv[1]) : 1} : {on:false, k:0, lvl:1};
  return {buyin:one(r.buyin), rs, rd, addon:one(r.addon), tc};
}
// Valida a estrutura: devolve a mensagem do 1º problema, ou "" se estiver tudo certo.
function structValidate(st, type, ko){
  const bad = n => !Number.isFinite(n) || n<0;
  const all = [st.buyin.v,st.buyin.k,st.rs.v,st.rs.k,st.rd.v,st.rd.k,st.addon.v,st.addon.k,st.tc.k,st.tc.lvl];
  if(all.some(bad)) return "Preencha os campos só com números (sem letras nem valores negativos).";
  if(!(st.buyin.v>0) || !(st.buyin.k>0)) return "Buy-in: informe o valor e as fichas.";
  if(st.rs.v>0 && !(st.rs.k>0)) return "Rebuy simples: informe as fichas.";
  if(st.rd.v>0 && !(st.rs.v>0)) return "Rebuy duplo: preencha também o rebuy simples.";
  if(st.rd.v>0 && !(st.rd.k>0)) return "Rebuy duplo: informe as fichas.";
  if(st.addon.v>0 && !(st.addon.k>0)) return "Add-on: informe as fichas.";
  if(st.tc.on && (!(st.tc.k>0) || !(st.tc.lvl>=1))) return "Time chip: informe as fichas e o nível.";
  if(stTypeIsPKO(type) && ko){ if(!(ko.value>0)) return "Valor por KO: informe um valor maior que zero."; if(!(ko.per>=1)) return "KOs por entrada: informe 1 ou mais."; }
  return "";
}
// Texto de regras exibido: nas etapas PKO, acompanha os KOs por entrada que valem no financeiro (também para etapas antigas, sem alterar o que está salvo)
function stageStructText(s){
  const raw = {buyin:s.buyin||"", rebuy:s.rebuy||"", addon:s.addon||"", timechip:s.timechip||""};
  if(!stTypeIsPKO(s.type)) return raw;
  const st = textToStruct(raw);
  if(structValidate(st, s.type, null)) return raw;      // texto antigo fora do padrão: mostra como está
  return structToText(st, s.type, Number(s.finance&&s.finance.koPer)||DEFAULT_KO_PER_ENTRY);
}

// Get blind levels for a stage (uses stage.blindLevels or the default)
function getBlindLevels(s){
  if(s.blindLevels && s.blindLevels.length) return s.blindLevels;
  // Modelo "para todas as estruturas futuras" (clocks/{temporada}_blindTemplate); senão o padrão do app
  if(typeof BLIND_TEMPLATE!=="undefined" && Array.isArray(BLIND_TEMPLATE) && BLIND_TEMPLATE.length) return JSON.parse(JSON.stringify(BLIND_TEMPLATE));

// Format chip count for display (100k, 2.5k, etc.)
// Abreviação só a partir de 10.000: 1.600 → "1.600" · 10.000 → "10k" · 12.500 → "12,5k" · 1.300.000 → "1,3MM"
function fmtChips(n){
  if(!n || n===0) return "0";
  const short = (v, suf) => (Math.round(v*10)/10).toLocaleString("pt-BR",{maximumFractionDigits:1})+suf;
  if(n>=1000000) return short(n/1000000, "MM");
  if(n>=10000)   return short(n/1000, "k");
  return Number(n).toLocaleString("pt-BR");
}

// ── BLIND CLOCK — estado no Firestore (coleção "clocks"), tempo sempre DERIVADO ──
// Nada guarda "tempo restante". Cada aparelho calcula nível e tempo a partir de
// (elapsedMs, startedAtMs, estrutura de blinds, hora do SERVIDOR). Só o admin grava
// ações (play/pause/próximo/anterior/reset/editar tempo); o avanço de nível é
// calculado por todos, então não depende de ninguém online. Lógica em clock-core.js.
const CLOCK_DOCS = {};      // stageId → estado vindo do Firestore (undefined = ainda carregando)
let CLOCK_OFFSET_MS = 0;    // hora do servidor − Date.now() do aparelho (via /api/time)
let _clockUnsub = null, _clockSyncTimer = null, _clockStage = null, _tplUnsub = null;
let BLIND_TEMPLATE = undefined;   // undefined = carregando · null = não existe · array = modelo salvo
const tplDocId = () => DATA_SEASON+"_blindTemplate";

function clockNow(){ return Date.now() + CLOCK_OFFSET_MS; }
function clockDocId(stageId){ return DATA_SEASON+"_"+stageId; }
function getClockState(s){ return CLOCK_DOCS[s.id] || CLOCK_IDLE; }
// Visão derivada do relógio da etapa: {idx, level, next, remainingMs, durMs, running, finished}
function clockView(s){ return clockDerive(getBlindLevels(s), getClockState(s), clockNow()); }

// Tempo restante do round em mm:ss (arredonda para cima: 00:00 só aparece no instante exato)
function clockRemaining(v){
  const rem = Math.ceil(v.remainingMs/1000);
  return {mm: Math.floor(rem/60), ss: rem%60, rem, total: Math.round(v.durMs/1000)};
}

// Mede a diferença entre o relógio do aparelho e o do servidor (5 amostras, usa a de menor latência)
async function syncClockOffset(){
  let best = null;
  for(let i=0;i<5;i++){
    try{
      const t0 = Date.now();
      const r = await fetch("/api/time?"+t0+"_"+i, {cache:"no-store"});
      const t1 = Date.now();
      if(!r.ok) continue;
      const j = await r.json();
      if(!Number.isFinite(j.now)) continue;
      const rtt = t1 - t0;
      if(!best || rtt < best.rtt) best = {rtt, offset: j.now - (t0 + rtt/2)};
    }catch(e){}
  }
  if(best && best.rtt < 3000) CLOCK_OFFSET_MS = Math.round(best.offset);
}

function startClockSync(stageId){
  stopClockSync();
  _clockStage = stageId;
  syncClockOffset();
  _clockSyncTimer = setInterval(syncClockOffset, 5*60*1000);
  _clockUnsub = onSnapshot(doc(db,"clocks",clockDocId(stageId)), (snap)=>{
    CLOCK_DOCS[stageId] = snap.exists() ? clockNormalize(snap.data()) : CLOCK_IDLE;
    if(CLOCK_STAGE_ID===stageId) render();
  }, (err)=>{ showToast("Relógio sem conexão: "+err.message,"red"); });
  // Modelo de blinds das etapas futuras: todos os aparelhos carregam ANTES de mostrar o relógio
  _tplUnsub = onSnapshot(doc(db,"clocks",tplDocId()), (snap)=>{
    const d = snap.exists() ? snap.data() : null;
    BLIND_TEMPLATE = (d && Array.isArray(d.levels) && d.levels.length) ? d.levels : null;
    if(CLOCK_STAGE_ID===stageId) render();
  }, ()=>{ BLIND_TEMPLATE = null; if(CLOCK_STAGE_ID===stageId) render(); });
}
function stopClockSync(){
  if(_clockUnsub){ _clockUnsub(); _clockUnsub = null; }
  if(_tplUnsub){ _tplUnsub(); _tplUnsub = null; }
  BLIND_TEMPLATE = undefined;
  if(_clockSyncTimer){ clearInterval(_clockSyncTimer); _clockSyncTimer = null; }
  if(_clockStage!==null){ delete CLOCK_DOCS[_clockStage]; _clockStage = null; }
  window._clkRendered = null;
  window._clkPrev = null;
}

// Ação do admin: transação (lê → calcula → grava) com a hora do servidor.
// Dois admins clicando ao mesmo tempo não se atropelam; offline falha com aviso (nunca diverge).
async function clockAct(action){
  const s = DB.stages.find(x=>x.id===CLOCK_STAGE_ID);
  if(!s || !IS_ADMIN) return false;
  const levels = getBlindLevels(s);
  const ref = doc(db,"clocks",clockDocId(s.id));
  try{
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ref);
      const patch = clockApply(levels, snap.exists()?snap.data():CLOCK_IDLE, action, clockNow());
      if(patch) tx.set(ref, {...patch, stageId:s.id, updatedAt:serverTimestamp(), updatedBy:(auth.currentUser&&auth.currentUser.uid)||null});
    });
    return true;
  } catch(e){ showToast("Erro no relógio: "+e.message,"red"); return false; }
}

// Sons: um AudioContext só, destravado no clique que abre o relógio (exigência dos celulares)
function clockAudio(){
  try{
    if(!window._clkAudio){
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      window._clkAudio = new AC();
    }
    if(window._clkAudio.state==="suspended") window._clkAudio.resume();
    return window._clkAudio;
  }catch(e){ return null; }
}
// n bipes curtos na frequência freq (Hz)
function clockBeeps(n, freq){
  const ctx = clockAudio(); if(!ctx) return;
  try{
    for(let i=0;i<n;i++){
      const t = ctx.currentTime + i*0.25;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.5, t+0.02);
      gain.gain.linearRampToValueAtTime(0, t+0.18);
      osc.start(t); osc.stop(t+0.2);
    }
  }catch(e){}
}
const playWarnBeep    = ()=> clockBeeps(1, 880);   // entrou no último minuto do nível
const playLevelUpBeep = ()=> clockBeeps(4, 1320);  // zerou (bip quádruplo); o nível troca 2s depois

// Tela cheia: ícone do botão sempre coerente com o estado real (também depois de re-render, Esc, gesto de voltar)
const clockFsActive = ()=> !!(document.fullscreenElement || document.webkitFullscreenElement);

// Wake Lock: o navegador solta o lock quando a aba fica oculta → pede de novo ao voltar
function clockWakeLock(){
  if(!navigator.wakeLock || !CLOCK_STAGE_ID || window._wl) return;
  navigator.wakeLock.request("screen").then(wl=>{
    window._wl = wl;
    wl.addEventListener("release",()=>{ if(window._wl===wl) window._wl = null; });
  }).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && CLOCK_STAGE_ID){ clockWakeLock(); clockAudio(); syncClockOffset(); }
});

// Calculate average stack
function calcAvgStack(s){
  const buyinChips  = parseChips(s.buyin);
  const rebuyParts  = (s.rebuy||"").split("/");
  const rsChips     = parseChips(rebuyParts[0]);
  const addonChips  = parseChips(s.addon);
  const records     = s.buyinData||[];
  const ins         = s.inscriptions||[];
  const totalRS     = records.reduce((sum,r)=>sum+(Number(r.rs)||0),0);
  const totalRD     = records.reduce((sum,r)=>sum+(Number(r.rd)||0),0);
  const totalAddon  = records.filter(r=>r.addon).length;
  const numPlayers  = ins.length;
  if(!numPlayers) return 0;
  // RD gives double chips (same as rebuyParts[1] which has 40k fichas)
  const rdChips = parseChips(rebuyParts[1]||rebuyParts[0]);
  const total = numPlayers*buyinChips + totalRS*rsChips + totalRD*rdChips + totalAddon*addonChips;
  return numPlayers>0 ? Math.round(total/numPlayers) : 0;
}

// Returns {buyin, rs, rd, addon} numeric values from a stage's structure strings.
// rebuy field: "R$ 100 (20k) / R$ 180 (40k)" — first = RS, second = RD
function getBuyinValues(s){
  const buyin = parseBRL(s.buyin);
  const addon = parseBRL(s.addon);
  const rebuyParts = (s.rebuy||"").split("/").map(p=>p.trim());
  const rs = parseBRL(rebuyParts[0]);
  const rd = parseBRL(rebuyParts[1]||rebuyParts[0]);
  return {buyin, rs, rd, addon};
}
// Total pago por um jogador no torneio (buy-in + rebuys + add-on). Números sempre válidos (nunca NaN).
function entradaJogador(vals, rec){
  const rs = Number(rec && rec.rs)||0, rd = Number(rec && rec.rd)||0;
  return (Number(vals.buyin)||0) + rs*(Number(vals.rs)||0) + rd*(Number(vals.rd)||0) + ((rec && rec.addon) ? (Number(vals.addon)||0) : 0);
}
// Get or init a player's buy-in record for a stage
function getBuyinRecord(s, uid){
  const records = s.buyinData || [];
  return records.find(r=>r.uid===uid) || {uid, rs:0, rd:0, addon:false};
}
// Set a player's buy-in record in a stage (mutates DB locally, then saves)
function setBuyinRecord(s, record){
  if(!s.buyinData) s.buyinData = [];
  const idx = s.buyinData.findIndex(r=>r.uid===record.uid);
  if(idx>=0) s.buyinData[idx] = record;
  else s.buyinData.push(record);
}
const fmtBRL = v => { const n = Number(v||0); return "R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}); };

// ── FINANCEIRO — Custos, Pot, Premiação (ITM) ───────────────────────────────

// Default costs structure for a stage's financial data
function getFinanceData(s){
  if(!s.finance){
    s.finance = {
      floorName: "",
      floorCost: 550,
      dealers: [{name:"", cost:350}],
      extraCosts: [], // [{label, value}]
      caixinhaCash: 0,
      caixinhaTorneio: 0,
      prizeOverrides: null // null = auto-calculated; array = manually edited
    };
  }
  // backfill in case of partial/old data
  if(s.finance.floorCost===undefined) s.finance.floorCost = 550;
  if(!s.finance.dealers) s.finance.dealers = [{name:"", cost:350}];
  if(!s.finance.extraCosts) s.finance.extraCosts = [];
  if(s.finance.caixinhaCash===undefined) s.finance.caixinhaCash = 0;
  if(s.finance.caixinhaTorneio===undefined) s.finance.caixinhaTorneio = 0;
  return s.finance;
}

// Sum of the "Total" column from Entradas tab (buy-in + RS + RD + addon for all inscribed players)
function calcArrecadado(s){
  const vals = getBuyinValues(s);
  const ins = s.inscriptions||[];
  return ins.reduce((sum,uid)=>{
    const rec = getBuyinRecord(s, uid);
    return sum + entradaJogador(vals, rec);
  }, 0);
}

// Total of fixed costs (Floor + Dealers + Extras) — does NOT include caixinhas
function calcCustosFixos(fin){
  const dealersTotal = (fin.dealers||[]).reduce((sum,d)=>sum+(Number(d.cost)||0),0);
  const extrasTotal  = (fin.extraCosts||[]).reduce((sum,e)=>sum+(Number(e.value)||0),0);
  return (Number(fin.floorCost)||0) + dealersTotal + extrasTotal;
}

// POT FINAL = Arrecadado − Custos fixos (floor+dealers+extras)
function calcPotFinal(s){
  const fin = getFinanceData(s);
  return calcArrecadado(s) - calcCustosFixos(fin);
}

// Taxa FT = 15% da base tributável
// NLH: 15% do Pot Final
// PKO: 15% do (Pot Final − KO Pool) — bounties não entram na base da FT
function calcTaxaFT(s){
  const potFinal = calcPotFinal(s);
  if(s.type==="knockout"){
    return Math.max(0, potFinal - calcKOFromEntries(s)) * 0.15;
  }
  return Math.max(0, potFinal) * 0.15;
}

// FT Prize pool contribution per stage.
// Admins can override this in the FT Prize table (stored in s.ftContribution)
// without affecting the Financeiro → Custos calculations (which always use calcTaxaFT).
function getFTContribution(s){
  if(s.ftContribution !== undefined && s.ftContribution !== null){
    return Number(s.ftContribution);
  }
  return calcTaxaFT(s);
}

// POT LÍQUIDO = base para cálculo do ITM
// NLH: POT FINAL − Taxa FT
// PKO: POT FINAL − Taxa FT − KO Pool (calculado pelas entradas/rebuys, não pelos resultados)
function calcPotLiquido(s){
  const potFinal = calcPotFinal(s);
  const taxaFT   = calcTaxaFT(s);
  const koDeduct = s.type==="knockout" ? calcKOFromEntries(s) : 0;
  return potFinal - taxaFT - koDeduct;
}

// ITM distribution table based on number of inscribed players.
// Returns an array of percentages indexed by position (index 0 = 1st place).
// NL Hold'em ITM distribution
const ITM_TABLE_NLH = [
  { max:12, pcts:[65,35] },
  { max:17, pcts:[50,30,20] },
  { max:22, pcts:[45,28,18,9] },
  { max:27, pcts:[42,27,17,9,5] },
  { max:32, pcts:[40,26,16,9,5,4] },
  { max:40, pcts:[39,25,15,9,5,4,3] },
];
// PKO (Knockout) ITM distribution — prizes only (KO bounties are separate)
const ITM_TABLE_PKO = [
  { max:12, pcts:[50,50] },
  { max:17, pcts:[40,40,20] },
  { max:22, pcts:[37,36,18,9] },
  { max:27, pcts:[35,34,17,9,5] },
  { max:32, pcts:[33,33,16,9,5,4] },
  { max:40, pcts:[32,32,15,9,5,4,3] },
];
// Keep the old name for backward compatibility (used in calcPremiacao)
const ITM_TABLE = ITM_TABLE_NLH;

function getITMPercents(numPlayers, stageType){
  const table = stageType==="knockout" ? ITM_TABLE_PKO : ITM_TABLE_NLH;
  return (table.find(t=>numPlayers<=t.max) || table[table.length-1]).pcts;
}

// Default KO value per knockout (can be overridden per stage in fin.koValue)
const DEFAULT_KO_VALUE = 25;
const DEFAULT_KO_PER_ENTRY = 4; // standard: 4 KO chips distributed per entry/rebuy

// Total KO earnings for a player in a stage (from published results)
function calcKOEarnings(s, uid){
  const fin = getFinanceData(s);
  const koValue = Number(fin.koValue)||DEFAULT_KO_VALUE;
  const result = (s.results||[]).find(r=>r.playerId===uid);
  const kos = result ? (Number(result.knockouts)||0) : 0;
  return kos * koValue;
}

// Total KO payout from published results (conference value — what was actually paid out)
function calcKOTotalPayout(s){
  const fin = getFinanceData(s);
  const koValue = Number(fin.koValue)||DEFAULT_KO_VALUE;
  return (s.results||[]).reduce((sum,r)=>sum+(Number(r.knockouts)||0)*koValue,0);
}

// Total KO pool calculated from entries/rebuys (rule-based — source of truth for pot calc).
// Formula: (entries + RS + RD) × koPer × koValue
// RD counts same as RS (one new entry of KO chips per rebuy, regardless of double stack).
function calcKOFromEntries(s){
  const fin = getFinanceData(s);
  const koValue  = Number(fin.koValue)||DEFAULT_KO_VALUE;
  const koPer    = Number(fin.koPer)||DEFAULT_KO_PER_ENTRY;
  const ins      = (s.inscriptions||[]).length;
  const records  = s.buyinData||[];
  const totalRS  = records.reduce((sum,r)=>sum+(Number(r.rs)||0),0);
  const totalRD  = records.reduce((sum,r)=>sum+(Number(r.rd)||0),0);
  return (ins + totalRS + totalRD) * koPer * koValue;
}

// Calculate prize per position for a stage (NLH only).
// Returns array: [{position, pct, value}], respecting any manual overrides.
// Sum of per-position caixinhas — the new source of truth for caixinhaTorneio.
// In auto mode (no overrides yet), falls back to fin.caixinhaTorneio field.
function calcCaixinhaTorneioTotal(s){
  const fin = getFinanceData(s);
  if(fin.prizeOverrides && fin.prizeOverrides.length){
    return fin.prizeOverrides.reduce((sum,o)=>sum+(Number(o.caixinha)||0),0);
  }
  return Number(fin.caixinhaTorneio)||0;
}

function calcPremiacao(s){
  const fin = getFinanceData(s);
  const potLiquido = calcPotLiquido(s);
  // caixinhaTorneio is derived from per-position caixinhas (or the manual field in auto mode)
  const caixinhaTorneio = calcCaixinhaTorneioTotal(s);
  const totalAPremiar = Math.max(0, potLiquido - caixinhaTorneio);   // nunca prêmio negativo
  const numPlayers = (s.inscriptions||[]).length;
  const autoPcts = getITMPercents(numPlayers, s.type);

  if(fin.prizeOverrides && fin.prizeOverrides.length){
    return fin.prizeOverrides.map((o,i)=>{
      const value = (o.value !== undefined && o.value !== null && o.value !== "") ? (Number(o.value)||0) : totalAPremiar * ((Number(o.pct)||0)/100);
      const caixinha = Number(o.caixinha)||0;
      return {
        position: i+1,
        pct: totalAPremiar>0 ? (value/totalAPremiar)*100 : 0,
        value,
        caixinha
      };
    });
  }
  return autoPcts.map((pct,i)=>({
    position: i+1,
    pct,
    value: Math.round(totalAPremiar * (pct/100) * 100) / 100,   // centavos
    caixinha: 0
  }));
}

// Per-staff (floor/dealer) payout: base cost + share of caixinhas (cash+torneio)
// divided equally among floor + all dealers.
function calcStaffPayouts(s){
  const fin = getFinanceData(s);
  const staffCount = 1 + (fin.dealers||[]).length; // 1 floor + N dealers
  const caixinhasTotal = (Number(fin.caixinhaCash)||0) + calcCaixinhaTorneioTotal(s);
  const share = staffCount>0 ? caixinhasTotal/staffCount : 0;

  const floor = { role:"Floor", name: fin.floorName||"—", base: Number(fin.floorCost)||0, share, total: (Number(fin.floorCost)||0)+share };
  const dealers = (fin.dealers||[]).map((d,i)=>({
    role: "Dealer "+(i+1),
    name: d.name||"—",
    base: Number(d.cost)||0,
    share,
    total: (Number(d.cost)||0)+share
  }));
  return [floor, ...dealers];
}

// ── CASH GAME ─────────────────────────────────────────────────────────────────
// stage.cashGame = { players: [uid, ...], entries: { [uid]: [{value, ts}] }, cashouts: { [uid]: number|null } }
function getCashGameData(s){
  if(!s.cashGame){
    s.cashGame = { players: [], entries: {}, cashouts: {} };
  }
  if(!s.cashGame.players) s.cashGame.players = [];
  if(!s.cashGame.entries) s.cashGame.entries = {};
  if(!s.cashGame.cashouts) s.cashGame.cashouts = {};
  return s.cashGame;
}

function getCashPlayerEntries(s, uid){
  const cg = getCashGameData(s);
  return cg.entries[uid] || [];
}

function getCashPlayerTotalEntries(s, uid){
  return getCashPlayerEntries(s, uid).reduce((sum,e)=>sum+(Number(e.value)||0),0);
}

function getCashPlayerCashout(s, uid){
  const cg = getCashGameData(s);
  const v = cg.cashouts[uid];
  return (v===undefined || v===null) ? null : Number(v);
}

// Saldo = Cashout − Total de Entradas. Returns null if player hasn't cashed out yet.
function getCashPlayerSaldo(s, uid){
  const cashout = getCashPlayerCashout(s, uid);
  if(cashout===null) return null;
  return cashout - getCashPlayerTotalEntries(s, uid);
}

// Append a player's cash-game lifetime history entry (called once per stage,
// when the stage's cash game data is saved — keeps player.cashGameHistory in sync).
function syncCashGameHistory(s){
  const cg = getCashGameData(s);
  (cg.players||[]).forEach(uid=>{
    const pIdx = DB.players.findIndex(p=>p.uid===uid);
    if(pIdx<0) return;
    const totalEntries = getCashPlayerTotalEntries(s, uid);
    const cashout = getCashPlayerCashout(s, uid);
    const saldo = cashout===null ? null : cashout - totalEntries;
    const history = DB.players[pIdx].cashGameHistory || [];
    const hIdx = history.findIndex(h=>h.stageId===s.id);
    const record = { stageId: s.id, stageName: s.name, totalEntries, cashout, saldo };
    if(hIdx>=0) history[hIdx] = record;
    else history.push(record);
    DB.players[pIdx] = {...DB.players[pIdx], cashGameHistory: history};
  });
}

function sanitizePlayers(players){

// Recursively strip undefined values — Firestore rejects any undefined field,
// including inside nested arrays/objects like stage.draft or stage.results
// Defesa contra HTML/JS injetado em nomes, endereços etc. (o app monta telas com innerHTML).
// Tudo que chega do Firestore passa por aqui: < > " ' ` viram caracteres visualmente parecidos e inofensivos;
// campos de link/foto só aceitam http(s)/data:image e têm as aspas codificadas.
const SAFE_KEEP_KEYS = new Set(["id","uid","email","status","type","date","time"]);
function neutralizeText(s){
  return s.replace(/</g,"‹").replace(/>/g,"›").replace(/"/g,"”").replace(/'/g,"’").replace(/`/g,"´");
}
function neutralizeUrl(s){
  if(!s) return s;
  if(!/^(https?:\/\/|data:image\/|blob:)/i.test(s.trim())) return "";
  return s.trim().replace(/"/g,"%22").replace(/'/g,"%27").replace(/</g,"%3C").replace(/>/g,"%3E").replace(/`/g,"%60").replace(/\s/g,"%20");
}
function sanitizeIncoming(v, key){
  if(typeof v === "string"){
    if(key && SAFE_KEEP_KEYS.has(key)) return v.replace(/[<>"'`]/g,"");
    if(key && /photo|url|link|image|img/i.test(key)) return neutralizeUrl(v);
    return neutralizeText(v);
  }
  if(Array.isArray(v)) return v.map(x=>sanitizeIncoming(x, key));
  if(v && typeof v === "object" && !(v instanceof Date) && typeof v.toMillis !== "function"){
    const o = {};
    for(const k of Object.keys(v)) o[k] = sanitizeIncoming(v[k], k);
    return o;
  }
  return v;
}

function deepSanitize(value){
  if(value === undefined) return null; // arrays can't have holes — use null instead of dropping
  if(Array.isArray(value)) return value.map(deepSanitize);
  if(value !== null && typeof value === "object" && !(value instanceof Date)){
    const clean = {};
    for(const [k,v] of Object.entries(value)){
      if(v === undefined) continue; // drop undefined keys entirely on objects
      clean[k] = deepSanitize(v);
    }
    return clean;
  }
  return value;
}

function sanitizeStages(stages){

// ── GRAVAÇÃO COM MESCLAGEM (evita sobrescrever o que outras pessoas gravaram) ──
// BASE = "foto" do que o servidor tinha na última leitura (json por jogador/etapa).
// Ao gravar, lemos a versão MAIS NOVA do servidor numa transação e só substituímos o que ESTE aparelho
// realmente mudou (json diferente da foto). Etapas/jogadores que outra pessoa alterou nesse meio-tempo
// continuam como estão no servidor. Se a comparação falhar por qualquer motivo, o pior caso é
// regravar aquela etapa/jogador (o comportamento antigo) — nunca perder dado de quem não foi tocado.
const BASE = { players:{}, stages:{}, admins:"[]" };
function setBaseline(players, stages, admins){
  BASE.players = {}; BASE.stages = {};
  sanitizePlayers(players).forEach(p=>{ BASE.players[p.uid] = JSON.stringify(p); });
  sanitizeStages(stages).forEach(s=>{ BASE.stages[s.id] = JSON.stringify(s); });
  BASE.admins = JSON.stringify(admins||[]);
}
function mergeById(server, local, base, key, combine){
  const localIds = new Set(local.map(x=>x[key]));
  const out = [];
  const seen = new Set();
  for(const sv of server){
    const id = sv[key];
    if(!localIds.has(id)){
      // sumiu localmente: se estava na foto, foi excluído aqui → remove; senão é novo de outra pessoa → mantém
      if(id in base) continue;
      out.push(sv); seen.add(id); continue;
    }
    const lc = local.find(x=>x[key]===id);
    out.push(JSON.stringify(lc)!==base[id] ? (combine ? combine(sv, lc, base[id]) : lc) : sv); seen.add(id);
  }
  for(const lc of local) if(!seen.has(lc[key])) out.push(lc);
  return out;
}
// Etapa alterada aqui E no servidor: vale a versão local, mas as INSCRIÇÕES são mescladas
// (quem se inscreveu em outro aparelho continua inscrito; só some quem foi removido AQUI).
function mergeStage(sv, lc, baseJson){
  try{
    const b = JSON.parse(baseJson||"{}");
    const baseIns = new Set(b.inscriptions||[]), lcIns = lc.inscriptions||[], lcSet = new Set(lcIns);
    const added = lcIns.filter(u=>!baseIns.has(u));
    const removed = new Set([...baseIns].filter(u=>!lcSet.has(u)));
    const ins = [...new Set([...(sv.inscriptions||[]), ...added])].filter(u=>!removed.has(u));
    return {...lc, inscriptions: ins};
  }catch(e){ return lc; }
}

const V2_LEGACY_ONLY = ["inscriptions","lateList"];          // na estrutura nova vivem nos docs de inscrição (regs), não no doc da etapa

function v2Canon(v){   // JSON com chaves ordenadas (comparação independente da ordem das chaves)

  if(v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+":"+v2Canon(v[k])).join(",") + "}";

const v2Uniq = a => { const o=[]; (a||[]).forEach(u=>{ if(typeof u==="string" && u && !o.includes(u)) o.push(u); }); return o; };

function v2SplitStage(st){

function v2AssembleStages(stageDocs, regDocs){

    return {...d, inscriptions:ins, lateList:late};

}
// Normaliza uma etapa do formato antigo para comparar com a montada da estrutura nova
const v2NormStage = st => ({...st, inscriptions:v2Uniq(st.inscriptions), lateList:v2Uniq(st.lateList)});

function v2Diff(baseP, baseS, locP, locS, o){

  locP.forEach(p=>{ const same = baseP[p.uid]!==undefined && v2Canon(JSON.parse(baseP[p.uid]))===v2Canon(p);
    if(same) return; if(!admin && p.uid!==me){ ops.blocked++; return; } ops.players.set.push(p); });
  if(o.deleteMissing) Object.keys(baseP).forEach(uid=>{ if(!locPIds.has(uid)){ if(admin) ops.players.del.push(uid); else ops.blocked++; } });
  // etapas
  const locSIds = new Set(locS.map(s=>s.id));
  locS.forEach((st,si)=>{
    const baseStage = baseS[st.id]!==undefined ? JSON.parse(baseS[st.id]) : null;
    if(baseStage && v2Canon(v2NormStage(baseStage))===v2Canon(v2NormStage(st))) return;
    const loc = v2SplitStage(st);
    if(admin){
      const bs = baseStage ? v2SplitStage(baseStage).doc : null;
      if(!bs || v2Canon(bs)!==v2Canon(loc.doc)) ops.stages.set.push(loc.doc);
    } else if(!baseStage){ ops.blocked++; return; }
    else if(v2Canon(v2SplitStage(baseStage).doc)!==v2Canon(loc.doc)) ops.blocked++;      // não-admin não altera dados da etapa
    // inscrições / late
    const bIns = baseStage ? v2Uniq(baseStage.inscriptions) : [], bLate = baseStage ? v2Uniq(baseStage.lateList) : [];
    const lIns = v2Uniq(st.inscriptions), lLate = v2Uniq(st.lateList);
    const bAll = new Set([...bIns, ...bLate]), lAll = new Set([...lIns, ...lLate]);
    const mine = u => admin || u===me;
    const orderChanged = JSON.stringify(bIns.filter(u=>lIns.includes(u))) !== JSON.stringify(lIns.filter(u=>bIns.includes(u)));
    const lorderChanged = JSON.stringify(bLate.filter(u=>lLate.includes(u))) !== JSON.stringify(lLate.filter(u=>bLate.includes(u)));
    bAll.forEach(u=>{ if(!lAll.has(u)){ if(mine(u)) ops.regs.del.push(v2RegId(st.id,u)); else ops.blocked++; } });
    let k = 0;
    lAll.forEach(u=>{
      const id = v2RegId(st.id,u), isNew = !bAll.has(u), nowIns = lIns.includes(u), nowLate = lLate.includes(u), wasIns = bIns.includes(u), wasLate = bLate.includes(u);
      const data = {};

      else {
        if(nowIns!==wasIns){ data.inscrito = nowIns; if(nowIns) data.ord = stamp + (k++); }
        else if(nowIns && orderChanged) data.ord = lIns.indexOf(u);
        if(nowLate!==wasLate){ data.late = nowLate; if(nowLate) data.lord = lLate.indexOf(u); }
        else if(nowLate && lorderChanged) data.lord = lLate.indexOf(u);
      }
      if(Object.keys(data).length){ if(mine(u)) ops.regs.set.push({id, data, create:isNew}); else ops.blocked++; }
    });
  });
  if(o.deleteMissing) Object.keys(baseS).forEach(id=>{ if(!locSIds.has(id)){ if(admin){ ops.stages.del.push(id); JSON.parse(baseS[id]).inscriptions && v2Uniq([...(JSON.parse(baseS[id]).inscriptions||[]), ...(JSON.parse(baseS[id]).lateList||[])]).forEach(u=>ops.regs.del.push(v2RegId(id,u))); } else ops.blocked++; } });
  return ops;
}

async function v2ApplyOps(ops){
  const fns = [];
  ops.stages.set.forEach(d=>fns.push(b=>b.set(v2StageRef(d.id), deepSanitize(d))));
  ops.stages.del.forEach(id=>fns.push(b=>b.delete(v2StageRef(id))));
  ops.regs.set.forEach(r=>fns.push(b=>b.set(v2RegRef(r.id), r.data, {merge:true})));
  ops.regs.del.forEach(id=>fns.push(b=>b.delete(v2RegRef(id))));
  ops.players.del.forEach(uid=>fns.push(b=>b.delete(v2PlayerRef(uid))));
  const mine = ops.players.set.filter(p=>p.uid===CURRENT_USER_UID);
  ops.players.set.filter(p=>p.uid!==CURRENT_USER_UID).forEach(pl=>fns.push(b=>b.set(v2PlayerRef(pl.uid), deepSanitize(pl))));
  await v2Batched(fns);
  for(const pl of mine) await v2SaveMyProfile(pl);
}
// Perfil próprio: transação que une os tokens de notificação do servidor com os locais (nunca perde token de outro aparelho)
async function v2SaveMyProfile(pl){
  const ref = v2PlayerRef(pl.uid);
  await runTransaction(db, async(tx)=>{
    const snap = await tx.get(ref); const srv = snap.exists() ? snap.data() : {};
    const toks = [...new Set([...(srv.fcmTokens||[]), ...(pl.fcmTokens||[])])];
    tx.set(ref, deepSanitize({...srv, ...pl, fcmTokens: toks}));
  });
}
// parts: {players?, stages?, admins?, deleteMissing?}. Só grava o que ESTE aparelho mudou desde a última leitura.
async function v2Commit(parts){
  const locP = parts.players ? sanitizePlayers(parts.players) : [], locS = parts.stages ? sanitizeStages(parts.stages) : [];
  const ops = v2Diff(BASE.players, BASE.stages, locP, locS, {isAdmin:IS_ADMIN, uid:CURRENT_USER_UID, deleteMissing: !!parts.deleteMissing && !!parts.players && !!parts.stages});
  if(ops.blocked) console.warn("v2: alterações sem permissão ignoradas:", ops.blocked);
  await v2ApplyOps(ops);
  // atualiza a "foto" do que foi gravado
  const touched = new Set([...ops.stages.set.map(d=>d.id), ...ops.regs.set.map(r=>r.data.stageId||r.id.split("__")[0]), ...ops.regs.del.map(id=>id.split("__")[0])]);
  locS.forEach(st=>{ if(touched.has(st.id)) BASE.stages[st.id] = JSON.stringify(st); });
  ops.stages.del.forEach(id=>{ delete BASE.stages[id]; });
  ops.players.set.forEach(pl=>{ BASE.players[pl.uid] = JSON.stringify(pl); });
  ops.players.del.forEach(uid=>{ delete BASE.players[uid]; });
  if(IS_ADMIN && parts.admins && JSON.stringify(parts.admins)!==BASE.admins){
    await updateDoc(v2SeasonRef(), {admins: parts.admins, updatedAt: serverTimestamp()}); BASE.admins = JSON.stringify(parts.admins);
  }
  return ops;
}

// ── migração: copia do documento antigo para a estrutura nova (não apaga nada) e confere item a item ──
async function v2Migrate(log){
  const snap = await getDoc(doc(db,"seasons",DATA_SEASON)); if(!snap.exists()) throw new Error("documento da temporada não encontrado");
  const data = snap.data();
  const seenP = new Set(); const players = []; let dupP = 0;
  sanitizePlayers(data.players||[]).forEach(pl=>{ if(!pl.uid || seenP.has(pl.uid)){ dupP++; return; } seenP.add(pl.uid); players.push(pl); });
  const stages = sanitizeStages(data.stages||[]);
  log(`Documento antigo: ${players.length} jogadores${dupP?` (${dupP} duplicados ignorados)`:""}, ${stages.length} etapas.`);
  const fns = []; let nRegs = 0;
  players.forEach(pl=>fns.push(b=>b.set(v2PlayerRef(pl.uid), deepSanitize(pl))));
  stages.forEach(st=>{ const sp = v2SplitStage(st); fns.push(b=>b.set(v2StageRef(st.id), deepSanitize(sp.doc))); sp.regs.forEach(r=>{ nRegs++; fns.push(b=>b.set(v2RegRef(r.id), r.data)); }); });
  log(`Gravando ${fns.length} documentos (${nRegs} inscrições)…`); await v2Batched(fns);
  // conferência: relê tudo da estrutura nova e compara com o antigo
  log("Conferindo…");
  const nw = await (async()=>{ const [pS,sS,rS] = await Promise.all([getDocs(collection(db,"players")), getDocs(collection(db,"seasons",DATA_SEASON,"stages")), getDocs(collection(db,"seasons",DATA_SEASON,"regs"))]);
    const pl = [], sd = [], rg = []; pS.forEach(d=>pl.push({...d.data(), uid:d.id})); sS.forEach(d=>sd.push({...d.data(), id:d.id})); rS.forEach(d=>rg.push(d.data())); return {players:pl, stages:v2AssembleStages(sd, rg)}; })();
  const issues = [];
  const nwP = new Map(nw.players.map(x=>[x.uid,x])), nwS = new Map(nw.stages.map(x=>[x.id,x]));
  players.forEach(pl=>{ const o = nwP.get(pl.uid); if(!o) issues.push(`jogador ausente: ${pl.name||pl.uid}`); else if(v2Canon(o)!==v2Canon(JSON.parse(JSON.stringify(pl)))) issues.push(`jogador diferente: ${pl.name||pl.uid}`); });
  stages.forEach(st=>{ const o = nwS.get(st.id); if(!o) issues.push(`etapa ausente: ${st.name||st.id}`); else if(v2Canon(o)!==v2Canon(v2NormStage(JSON.parse(JSON.stringify(st))))) issues.push(`etapa diferente: ${st.name||st.id}`); });
  // conciliação: rankings e financeiro calculados nos dois conjuntos de dados têm que ser idênticos
  const saveP = DB.players, saveS = DB.stages; let sumA, sumB;
  const summary = ()=>JSON.stringify({g:calcRankGeral().map(r=>[r.p.uid,r.total,r.stages,r.ko]), n:calcRank("nlholdem").map(r=>[r.p.uid,r.total,r.stages,r.ko]), k:calcRank("knockout").map(r=>[r.p.uid,r.total,r.stages,r.ko]), f:calcFinancialRanking().map(r=>[r.uid,r.entradas,r.premios,r.saldoGeral,r.cashEntradas,r.cashSaidas])});
  try{ DB.players = players; DB.stages = stages.map(v2NormStage); sumA = summary(); DB.players = nw.players; DB.stages = nw.stages; sumB = summary(); }catch(e){ issues.push("falha ao calcular ranking/financeiro: "+e.message); }
  finally{ DB.players = saveP; DB.stages = saveS; }
  if(sumA!==undefined && sumA!==sumB) issues.push("ranking ou financeiro calculado diferente entre antigo e novo");
  const res = {ok: issues.length===0, players:nw.players.length, stages:nw.stages.length, regs:nRegs, issues};
  log(res.ok ? `✓ Tudo igual: ${res.players} jogadores, ${res.stages} etapas, ${nRegs} inscrições; rankings e financeiro idênticos.` : `✗ ${issues.length} diferença(s):\n- ${issues.join("\n- ")}`);
  V2.verified = res.ok; return res;
}
